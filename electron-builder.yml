appId: com.gemma4kids.app
productName: Gemma4kids
copyright: "Copyright (c) 2026 Gemma4kids contributors"

# Compiled output only - everything is bundled by esbuild into dist/
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
  # Runtime window/taskbar icon (main process); PNG is enough — add icon.ico for sharper Windows taskbar
  - assets/icon.png

directories:
  buildResources: assets
  output: release

# Windows
win:
  icon: assets/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gemma4kids
  license: LICENSE

# macOS
mac:
  icon: assets/icon.png
  category: public.app-category.education
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned - judges are pre-warned in SETUP.md
  hardenedRuntime: false
  target:
    - target: dmg
    - target: zip

dmg:
  title: "Gemma4kids ${version}"

# Linux
linux:
  icon: assets/icon.png
  category: Education
  target:
    - target: AppImage
      arch: [x64]
