appId: com.gemma4kids.app
productName: Gemma4kids
copyright: "Copyright (c) 2026 Gemma4kids contributors"

files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
  - assets/icon.png
  - assets/icon.ico

directories:
  buildResources: assets
  output: release

win:
  icon: icon.ico
  signAndEditExecutable: true
  extraResources:
    - from: piper/win
      to: piper
    - from: voices
      to: voices
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gemma4kids
  license: LICENSE

mac:
  icon: icon.png
  category: public.app-category.education
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: false
  extraResources:
    - from: piper/mac
      to: piper/mac
    - from: voices
      to: voices
  target:
    - target: dmg
      arch: [universal]

dmg:
  title: "Gemma4kids ${version}"
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 380
      type: file
      path: "Install Gemma4kids.command"

linux:
  icon: icons
  category: Education
  extraResources:
    - from: piper/linux
      to: piper/linux
    - from: voices
      to: voices
  target:
    - target: AppImage
      arch: [x64]
