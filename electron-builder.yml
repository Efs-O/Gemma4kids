appId: com.gemma4kids.app
productName: Gemma4kids
copyright: "Copyright (c) 2026 Gemma4kids contributors"

files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
  - assets/icon.png

directories:
  buildResources: assets
  output: release

win:
  icon: assets/icon.png
  signAndEditExecutable: false
  extraResources:
    - from: piper/win
      to: piper
    - from: voices
      to: voices
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gemma4kids
  license: LICENSE

mac:
  icon: assets/icon.png
  category: public.app-category.education
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: false
  # Package the x64 Piper payload for now. The upstream piper_macos_aarch64
  # archive may be mislabeled or otherwise not reliably arm64, so x64 is the
  # safer default until that artifact is verified.
  extraResources:
    - from: piper/mac/x64/piper
      to: piper
    - from: voices
      to: voices
  target:
    - target: dmg
      arch: [x64]

dmg:
  title: "Gemma4kids ${version}"

linux:
  icon: assets/icon.png
  category: Education
  extraResources:
    - from: piper/linux/x64/piper
      to: piper
    - from: voices
      to: voices
  target:
    - target: AppImage
      arch: [x64]
