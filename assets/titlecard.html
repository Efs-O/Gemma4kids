<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #4a0d9e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }

  .logo {
    width: 340px;
    height: 340px;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(255, 200, 120, 0.5));
  }

  .title {
    color: #ffffff;
    font-size: 96px;
    font-weight: 300;
    letter-spacing: 0.08em;
    text-shadow:
      0 0 60px rgba(255, 200, 120, 0.4),
      0 2px 8px rgba(0, 0, 0, 0.4);
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.55);
    font-size: 36px;
    font-weight: 300;
    letter-spacing: 0.2em;

  }
</style>
</head>
<body>
  <img class="logo" src="../dist/renderer/GEMMA.png" alt="Gemma4kids logo">
  <div class="title">Γνωρίστε τη Gemma.</div>
  <div class="subtitle">Offline A.I. για παιδιά</div>
</body>
</html>
