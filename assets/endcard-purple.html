<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #4a0d9e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }

  .logo {
    width: 180px;
    height: 180px;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(255, 200, 120, 0.45));
  }

  .app-name {
    color: #ffffff;
    font-size: 64px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-shadow: 0 0 40px rgba(255, 200, 120, 0.3);
  }

  .divider {
    width: 120px;
    height: 1px;
    background: rgba(255, 255, 255, 0.3);
  }

  .built-for {
    color: rgba(255, 255, 255, 0.6);
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .hackathon {
    color: #ffffff;
    font-size: 46px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-shadow: 0 0 40px rgba(255, 200, 120, 0.25);
  }

  .partners {
    color: rgba(255, 255, 255, 0.5);
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.1em;
  }

  .repo {
    color: rgba(255, 255, 255, 0.35);
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <img class="logo" src="../dist/renderer/GEMMA.png" alt="Gemma4kids logo">
  <div class="app-name">Gemma4kids</div>
  <div class="divider"></div>
  <div class="built-for">Built for the</div>
  <div class="hackathon">Gemma 4 Good Hackathon</div>
  <div class="partners">Kaggle · Google DeepMind</div>
  <div class="repo">github.com/Efs-O/Gemma4kids</div>
</body>
</html>
