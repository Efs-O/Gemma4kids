<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Night Sky Animation</title>
    <style>
        /* --- Global Styling & Setup --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #000d1a; /* Deep Indigo/Black for the night sky */
            overflow: hidden; /* Keep animations contained */
            cursor: none; /* Hides the cursor for a space feel */
        }

        /* --- Star Container & Twinkling Stars --- */
        .star-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore mouse events */
        }

        .star {
            position: absolute;
            background-color: rgba(255, 255, 255, 1);
            border-radius: 50%;
            opacity: 0; /* Start invisible */
            animation: twinkle linear infinite;
        }

        /* Animation Keyframes for Twinkling */
        @keyframes twinkle {
            0% {
                opacity: 0.1;
                transform: scale(0.5);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.1;
                transform: scale(0.5);
            }
        }

        /* --- Shooting Star Animation --- */
        .shooting-star {
            position: absolute;
            width: 0px; /* Initial width, will be animated */
            height: 2px;
            background: linear-gradient(90deg, rgba(255, 255, 102, 0) 0%, rgba(255, 200, 0, 0.8) 50%, rgba(255, 255, 255, 0.8) 100%, rgba(255, 255, 102, 0) 100%);
            z-index: 10;
            opacity: 0;
            animation: shoot-across linear forwards;
        }

        /* Keyframes for Shooting Star Movement */
        @keyframes shoot-across {
            0% {
                transform: translate(-100%, 0);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            100% {
                transform: translate(110vw, 0); /* Moves completely off the right edge */
                opacity: 0.5;
            }
        }

        /* --- Cosmic Glow Effect (Optional background layer) --- */
        .cosmic-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(30, 50, 100, 0.2) 0%, transparent 50%);
            animation: slowPulse 30s infinite alternate;
            pointer-events: none;
        }

        @keyframes slowPulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 0.9; }
        }

    </style>
</head>
<body>

    <!-- Background Cosmic Glow -->
    <div class="cosmic-glow"></div>

    <!-- Star Container (Stars will be injected here or defined by multiple divs) -->
    <div class="star-container" id="starContainer">
        <!-- Stars will be generated via JS for better random distribution -->
    </div>

    <script>
        const starContainer = document.getElementById('starContainer');
        const numStars = 150;

        // --- 1. Generate Twinkling Stars ---
        function createStars() {
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random size (1px to 3px)
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Random position across the viewport
                const topPosition = Math.random() * 100;
                const leftPosition = Math.random() * 100;
                star.style.top = `${topPosition}vh`;
                star.style.left = `${leftPosition}vw`;

                // Random animation duration for varied twinkling speed
                star.style.animationDuration = `${Math.random() * 8 + 4}s`;
                
                starContainer.appendChild(star);
            }
        }

        // --- 2. Generate Shooting Stars ---
        function generateShootingStar(startX, startY, endX, endY, duration) {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            
            // Set initial position (left edge)
            star.style.left = `${startX}vw`;
            star.style.top = `${startY}vh`;
            
            // Adjust CSS animation to use specific target coordinates (handled by keyframes, but this helps set context)
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `-${Math.random() * 3}s`; // Stagger start times

            // Append and ensure it starts animating immediately
            document.body.appendChild(star);
            
            // Use a timeout to remove the element after the animation finishes to prevent memory leaks
            setTimeout(() => {
                star.remove();
            }, (duration * 1000) + 500); 
        }

        // --- Animation Loop ---
        
        // 1. Initialize Stars
        createStars();

        // 2. Function to launch a new star every interval
        function launchStarStream() {
            // Random starting horizontal position (wide sweep)
            const startX = Math.random() * 10 + 5; // 5% to 15% from left
            // Random starting vertical position
            const startY = Math.random() * 80 + 10; // Near the top, avoiding edges
            
            // The animation keyframes are set to move across the screen (100% width), 
            // we just control the speed and initial location for visual variety.
            const duration = Math.random() * 2 + 1.5; // 1.5 to 3.5 seconds long
            
            generateShootingStar(startX, startY, 100, 0, duration);
        }

        // Launch a new star stream every 0.8 to 2.5 seconds
        setInterval(() => {
            launchStarStream();
        }, Math.random() * 1700 + 800); 
        
    </script>
</body>
</html>
