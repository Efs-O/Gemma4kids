<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juggling Clown</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #48dbfb 100%); /* Vivid background */
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .juggling-scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Start the scene from the bottom */
        }

        /* --- Clown Styling --- */
        .clown {
            position: absolute;
            bottom: 50px;
            width: 150px;
            height: 200px;
            background-color: #ffd700; /* Bright yellow/gold */
            border-radius: 50% 50% 0 0;
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            animation: bob 3s ease-in-out infinite alternate; /* Subtle movement */
        }

        @keyframes bob {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }

        /* --- Juggling Balls Styling & Animation --- */
        .ball {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: transform 1.5s ease-out, opacity 0.5s;
            z-index: 5;
        }

        /* Ball 1: Red */
        #ball1 {
            background-color: #ff4d4d;
            left: 10%;
            bottom: 20%;
            animation: juggle1 3s ease-in-out infinite;
        }

        /* Ball 2: Bright Blue */
        #ball2 {
            background-color: #4d94ff;
            left: 35%;
            bottom: 15%;
            animation: juggle2 3s ease-in-out infinite;
        }

        /* Ball 3: Vivid Green */
        #ball3 {
            background-color: #33ff99;
            left: 60%;
            bottom: 25%;
            animation: juggle3 3s ease-in-out infinite;
        }

        /* Ball 4: Orange */
        #ball4 {
            background-color: #ff9933;
            left: 85%;
            bottom: 10%;
            animation: juggle4 3s ease-in-out infinite;
        }

        /* --- Juggling Animations (Simulating arcs) --- */
        @keyframes juggle1 {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-100px) rotate(180deg); }
            66% { transform: translateY(0px) rotate(360deg); }
            100% { transform: translateY(0px) rotate(720deg); }
        }

        @keyframes juggle2 {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-150px) rotate(180deg); }
            66% { transform: translateY(0px) rotate(360deg); }
            100% { transform: translateY(0px) rotate(720deg); }
        }

        @keyframes juggle3 {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-80px) rotate(180deg); }
            66% { transform: translateY(0px) rotate(360deg); }
            100% { transform: translateY(0px) rotate(720deg); }
        }

        @keyframes juggle4 {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-120px) rotate(180deg); }
            66% { transform: translateY(0px) rotate(360deg); }
            100% { transform: translateY(0px) rotate(720deg); }
        }

        /* --- Bouncing Effect (Applying the BOUNCING OBJECT rule) --- */
        /* We define a simple bounce state that resets the ball to the ground level */
        .ball.bounce {
            animation-play-state: paused; /* Pause the juggling arc */
            transform: translateY(0px) !important; /* Keep it on the ground */
        }

        /* Add a slight pulsing effect on the balls to emphasize movement */
        .ball {
            animation-duration: 3s; /* Inherit duration */
        }

    </style>
</head>
<body>

    <div class="juggling-scene">
        
        <!-- The Juggler Clown -->
        <div class="clown"></div>

        <!-- The Juggling Balls -->
        <div id="ball1" class="ball"></div>
        <div id="ball2" class="ball"></div>
        <div id="ball3" class="ball"></div>
        <div id="ball4" class="ball"></div>

    </div>

    <script>
        // JavaScript to simulate the bouncing motion after the juggling arc is complete
        document.addEventListener('DOMContentLoaded', () => {
            const balls = document.querySelectorAll('.ball');

            balls.forEach(ball => {
                // Wait for the initial juggling animation to complete (3s is the duration)
                ball.addEventListener('animationend', () => {
                    // Trigger the bounce effect
                    ball.classList.add('bounce');
                    
                    // After a brief pause, reset the bounce state to allow the cycle to repeat
                    setTimeout(() => {
                        ball.classList.remove('bounce');
                        // Restart the juggling animation for the next cycle
                        ball.style.animation = `juggle${Math.floor(Math.random() * 4) + 1} 3s ease-in-out infinite`;
                    }, 500); // Allow time for the visual bounce to register
                }, { once: true });
            });
        });
    </script>
</body>
</html>
