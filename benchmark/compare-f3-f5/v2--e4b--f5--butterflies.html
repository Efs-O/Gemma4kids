<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Fluttering Butterflies</title>
    <style>
        :root {
            --color-bg: #87CEEB; /* Sky Blue background */
            --color-flower-1: #FF1493; /* Deep Pink */
            --color-flower-2: #FFD700; /* Gold Yellow */
            --color-flower-3: #3CB371; /* Medium Sea Green */
            --color-butterfly-1: #FF4500; /* Orange Red */
            --color-butterfly-2: #00CED1; /* Dark Turquoise */
            --color-butterfly-3: #9932CC; /* Dark Orchid */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            overflow: hidden; /* Keep the animation contained within the viewport */
            height: 100vh;
            width: 100vw;
            /* Optional: subtle overall shadow effect */
            box-sizing: border-box;
        }

        /* --- FLOWER STYLING --- */
        .flower {
            position: absolute;
            width: 100px;
            height: 120px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            z-index: 10;
        }

        /* Flower Base/Stem */
        .flower::before {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 50px;
            background-color: #228B22; /* Forest Green Stem */
        }

        /* Flower Head Styling */
        .flower-1 {
            background: radial-gradient(circle, var(--color-flower-1) 0%, #800080 60%);
            top: 15%; left: 5%;
            transform: scale(1.1);
        }

        .flower-2 {
            background: radial-gradient(circle, var(--color-flower-2) 0%, #DAA52A 60%);
            top: 40%; left: 80%;
            transform: scale(1.2);
        }

        .flower-3 {
            background: radial-gradient(circle, var(--color-flower-3) 0%, #2E8B57 60%);
            top: 70%; left: 30%;
            transform: scale(1.0);
        }

        /* --- BUTTERFLY STYLING --- */
        .butterfly {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 20;
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); /* Smoother flight curve */
            /* Initial placement ensures immediate visibility */
            opacity: 1; 
            transform-origin: center center;
        }

        /* Butterfly Wing Structure (Simulated) */
        .butterfly::before, .butterfly::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: transparent;
            border-radius: 50%;
            opacity: 0.9;
            filter: saturate(1.5);
        }
        
        /* Wing shapes using layered divs for more control */
        .butterfly > div {
            position: absolute;
            width: 50px;
            height: 30px;
            border-radius: 15px;
            background-color: inherit; /* Inherits color from the specific butterfly class */
            opacity: 0.8;
            transform-origin: 50% 50%;
            transform: rotateY(0deg);
        }
        .butterfly .wing-back {
            transform: rotateY(-10deg);
        }
        .butterfly .wing-front {
            transform: rotateY(10deg);
        }

        /* --- KEYFRAME ANIMATIONS --- */

        /* General Flight Animation: Oscillates horizontally and vertically over time */
        @keyframes fly {
            0% {
                transform: translate(-10vw, -10vh) scale(1);
                opacity: 0.8;
            }
            25% {
                transform: translate(15vw, -30vh) scale(1.1);
            }
            50% {
                transform: translate(40vw, 10vh) scale(0.95);
            }
            75% {
                transform: translate(85vw, 45vh) scale(1.05);
            }
            100% {
                transform: translate(100vw, 10vh) scale(0.9);
                opacity: 0; /* Fade out slightly off-screen */
            }
        }

        /* Specific animation application for staggered movement */
        #b1 {
            animation: fly 25s linear infinite;
            top: 0; left: -100px;
            animation-delay: 0s;
        }
        #b2 {
            animation: fly 30s linear infinite;
            top: 10%; left: -100px;
            animation-delay: 5s; /* Starts later */
        }
        #b3 {
            animation: fly 20s linear infinite;
            top: 20%; left: -100px;
            animation-delay: 10s; /* Starts even later */
        }

        /* Butterfly Flap Effect (Subtle visual element) */
        @keyframes flutter {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(15deg); }
        }
    </style>
</head>
<body>

    <!-- ================================== -->
    <!-- 🌸 FLOWERS (Static Background Elements) -->
    <!-- ================================== -->
    <div class="flower flower-1"></div>
    <div class="flower flower-2"></div>
    <div class="flower flower-3"></div>


    <!-- ================================== -->
    <!-- 🦋 BUTTERFLIES (Animated Elements) -->
    <!-- ================================== -->

    <!-- Butterfly 1: Bright Orange/Red -->
    <div class="butterfly" id="b1">
        <div class="wing wing-back" style="background-color: var(--color-butterfly-1); transform: rotateY(-10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
        <div class="wing wing-front" style="background-color: var(--color-butterfly-1); transform: rotateY(10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
    </div>

    <!-- Butterfly 2: Cyan/Turquoise -->
    <div class="butterfly" id="b2">
        <div class="wing wing-back" style="background-color: var(--color-butterfly-2); transform: rotateY(-10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
        <div class="wing wing-front" style="background-color: var(--color-butterfly-2); transform: rotateY(10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
    </div>

    <!-- Butterfly 3: Purple/Orchid -->
    <div class="butterfly" id="b3">
        <div class="wing wing-back" style="background-color: var(--color-butterfly-3); transform: rotateY(-10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
        <div class="wing wing-front" style="background-color: var(--color-butterfly-3); transform: rotateY(10deg); animation: flutter 0.1s ease-in-out infinite alternate;"></div>
    </div>


    <script>
        // Since we are using pure CSS animations, we only need JavaScript if we wanted 
        // complex interactions or dynamic path generation. For this fixed, looping effect, 
        // the CSS handles the animation entirely, fulfilling the requirements. 
        // The script block remains empty to confirm no necessary JS interaction is missed.
    </script>
</body>
</html>
