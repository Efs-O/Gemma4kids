<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentle Snowfall Animation</title>
    <style>
        /* Overall Body Setup: Night Sky Background */
        body {
            background: radial-gradient(circle at 50% 10%, #1a237e, #0d112b);
            overflow: hidden; /* Keep snowflakes contained */
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Snowflake Container for better control */
        .snowflake-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Individual Snowflake Styling */
        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0.7;
            /* Initial animation application via JS/CSS variables */
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Keyframes for Falling and Drifting */
        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.8;
            }
            100% {
                /* Fall off the screen */
                transform: translateY(calc(100vh + 100px)) translateX(calc(100vw + 100px)) scale(0.7);
                opacity: 0;
            }
        }

        /* Staggering and Sizing via JS will handle the placement, 
           but we ensure the base animation applies correctly. */
    </style>
</head>
<body>

    <div class="snowflake-container" id="snowfall-area">
        <!-- Snowflakes will be injected here by JavaScript -->
    </div>

    <script>
        const container = document.getElementById('snowfall-area');
        const numberOfSnowflakes = 80; // Ensuring more than 30 elements

        /**
         * Generates a random integer between min and max (inclusive)
         */
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        /**
         * Creates and styles a single snowflake element.
         */
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // 1. Size variation (Min 5px, Max 12px)
            const size = randomInt(5, 12);
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;

            // 2. Random starting position across the viewport (0vw to 100vw)
            const startX = randomInt(0, window.innerWidth);
            const startY = randomInt(-50, window.innerHeight * 0.5); // Start slightly above screen
            
            snowflake.style.left = `${startX}px`;
            snowflake.style.top = `${startY}px`;

            // 3. Random animation properties (speed, drift, duration)
            // Duration: controls fall time (e.g., 15s to 45s)
            const duration = `${randomInt(20, 50)}s`; 
            // Animation Delay: Ensures staggered start (e.g., 0s to 10s)
            const delay = `${randomInt(0, 10)}s`;
            // Animation Direction/Drift (using translateX in the keyframe concept, simulating drift)
            const drift = randomInt(-3, 3); 

            // Apply CSS animation variables
            snowflake.style.animationDuration = duration;
            snowflake.style.animationDelay = delay;
            
            // Overwrite the default keyframe to include horizontal drift for more natural look
            const styleSheet = document.styleSheets[document.styleSheets.length - 1];
            let keyframeRule = `
                @keyframes fall {
                    0% {
                        transform: translateY(0) translateX(0) scale(1);
                        opacity: 0.8;
                    }
                    100% {
                        transform: translateY(${window.innerHeight + size * 5}px) translateX(${drift * 100}px) scale(0.7);
                        opacity: 0;
                    }
                }
            `;
            // Injecting the custom keyframe scope or relying on the global scope if complex scope management is avoided.
            // For simplicity here, we rely on the initial @keyframes fall structure and let duration/delay control the fall rate.

            // For the necessary drift simulation across the whole duration:
            snowflake.style.animationName = 'fall';
            snowflake.style.animationDuration = duration;
            snowflake.style.animationDelay = delay;
            snowflake.style.animationIterationCount = 'infinite';
            
            // Adding a slight color variation for depth
            const r = randomInt(200, 255);
            const g = randomInt(220, 255);
            const b = randomInt(255, 255);
            snowflake.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.7)`;


            container.appendChild(snowflake);
        }

        // Populate the screen
        for (let i = 0; i < numberOfSnowflakes; i++) {
            createSnowflake();
        }
    </script>

</body>
</html>
