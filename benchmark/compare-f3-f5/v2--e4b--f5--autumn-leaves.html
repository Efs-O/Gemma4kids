<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Leaf Fall Animation</title>
    <style>
        /* --- Global Setup & Atmosphere --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Prevents scrollbars from appearing due to falling elements */
            background: linear-gradient(to bottom, #ffcc66, #b84d2c, #8b0000); /* Vivid gradient background for an autumn feel */
            position: relative;
        }

        /* --- Keyframe Animation Definition --- */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Fall far down, with slight horizontal drift */
                transform: translateY(110vh) translateX(calc(var(--drift-x))) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- Leaf Styling --- */
        .leaf {
            position: absolute;
            background-color: rgba(255, 140, 0, 0.85); /* Base color for shape */
            border-radius: 50% / 30% 70% 50% 50%; /* Irregular leaf shape */
            pointer-events: none; /* Ensures clicks pass through the leaves */
            will-change: transform, opacity; /* Optimization hint for GPU */
            animation-timing-function: cubic-bezier(0.6, -0.4, 0.1, 1.5); /* A springy, gentle motion */
            opacity: 0; /* Starts invisible */
        }

        /* --- Specific Leaf Color Variations --- */

        /* Red Leaf */
        .leaf-red {
            background-color: #D02020; 
            width: 30px; height: 40px;
            animation-duration: 20s;
        }

        /* Orange Leaf */
        .leaf-orange {
            background-color: #FF8C00; 
            width: 25px; height: 35px;
            animation-duration: 25s;
        }
        
        /* Gold Leaf */
        .leaf-gold {
            background-color: #FFD700; 
            width: 35px; height: 30px;
            animation-duration: 18s;
        }

        /* Brown Leaf (Slightly different shape for variety) */
        .leaf-brown {
            background-color: #A0522D;
            width: 20px; height: 30px;
            border-radius: 50% / 40% 60% 50% 50%;
            animation-duration: 30s;
        }


        /* --- Applying the Animation to Instances --- */
        /* Each leaf needs unique animation-delay, starting position, and drift values */
        
        /* Leaf 1: Top Left, Slow Fall */
        #leaf1 {
            left: 5%;
            top: -5%;
            transform: scale(1.1);
            animation-name: fall;
            animation-delay: 0s;
            animation-duration: 28s;
            --drift-x: 50px;
        }

        /* Leaf 2: Top Center, Medium Speed */
        #leaf2 {
            left: 30%;
            top: -10%;
            transform: scale(0.9);
            animation-name: fall;
            animation-delay: 1s;
            animation-duration: 22s;
            --drift-x: -80px;
        }
        
        /* Leaf 3: Top Right, Fast Fall */
        #leaf3 {
            left: 70%;
            top: -5%;
            transform: scale(1.2);
            animation-name: fall;
            animation-delay: 0.5s;
            animation-duration: 19s;
            --drift-x: 120px;
        }

        /* Leaf 4: Mid-Left, Gentle Float */
        #leaf4 {
            left: 10%;
            top: -20%;
            animation-name: fall;
            animation-delay: 2s;
            animation-duration: 35s;
            --drift-x: 20px;
        }

        /* Leaf 5: Center, Medium Drift */
        #leaf5 {
            left: 50%;
            top: -15%;
            animation-name: fall;
            animation-delay: 1.5s;
            animation-duration: 25s;
            --drift-x: -40px;
        }

        /* Leaf 6: Far Left, Long Glide */
        #leaf6 {
            left: 2%;
            top: -1%;
            animation-name: fall;
            animation-delay: 3s;
            animation-duration: 40s;
            --drift-x: 80px;
        }

        /* Leaf 7: Right Cluster Start */
        #leaf7 {
            left: 85%;
            top: -8%;
            animation-name: fall;
            animation-delay: 0.2s;
            animation-duration: 20s;
            --drift-x: -100px;
        }
        
        /* Leaf 8: Mixed Colors and Timing */
        #leaf8 {
            left: 40%;
            top: -25%;
            animation-name: fall;
            animation-delay: 2.5s;
            animation-duration: 30s;
            --drift-x: 150px;
        }
        
        /* Leaf 9: Low Canopy Start */
        #leaf9 {
            left: 65%;
            top: -18%;
            animation-name: fall;
            animation-delay: 1s;
            animation-duration: 28s;
            --drift-x: 0px;
        }
        
        /* Leaf 10: Bottom Edge Filler */
        #leaf10 {
            left: 75%;
            top: -3%;
            animation-name: fall;
            animation-delay: 0.7s;
            animation-duration: 21s;
            --drift-x: 50px;
        }

    </style>
</head>
<body>

    <!-- Vivid, colorful leaves are placed here. Their specific styles and animations are controlled by the CSS. -->
    
    <!-- Red Leaf Examples -->
    <div class="leaf leaf-red" id="leaf1" style="width: 30px; height: 40px;"></div>
    <div class="leaf leaf-red" id="leaf4" style="width: 30px; height: 40px;"></div>
    <div class="leaf leaf-red" id="leaf6" style="width: 30px; height: 40px;"></div>
    
    <!-- Orange Leaf Examples -->
    <div class="leaf leaf-orange" id="leaf2" style="width: 25px; height: 35px;"></div>
    <div class="leaf leaf-orange" id="leaf7" style="width: 25px; height: 35px;"></div>
    
    <!-- Gold Leaf Examples -->
    <div class="leaf leaf-gold" id="leaf3" style="width: 35px; height: 30px;"></div>
    <div class="leaf leaf-gold" id="leaf5" style="width: 35px; height: 30px;"></div>
    
    <!-- Brown Leaf Examples -->
    <div class="leaf leaf-brown" id="leaf8" style="width: 20px; height: 30px;"></div>
    <div class="leaf leaf-brown" id="leaf9" style="width: 20px; height: 30px;"></div>

    <!-- Mixed/Filler Leaves -->
    <div class="leaf leaf-orange" id="leaf10" style="width: 25px; height: 35px;"></div>

</body>
</html>
