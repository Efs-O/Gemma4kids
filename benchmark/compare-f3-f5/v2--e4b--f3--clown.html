<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clown Juggling Show</title>
    <style>
        /* Global Styles & Background */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #ff66b2 0%, #ffcc00 40%, #4dd0e1 100%); /* Vivid Carnival Gradient */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Keep action grounded */
        }

        /* Clown Juggler Character */
        .clown {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 350px;
            z-index: 10;
            animation: sway 5s ease-in-out infinite;
        }

        /* Clown Head (Balloon Nose emphasis) */
        .clown-head {
            width: 120px;
            height: 120px;
            background-color: #ffc0cb; /* Pink skin */
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 10px;
            border: 5px solid #ff0080;
        }

        .clown-nose {
            width: 40px;
            height: 30px;
            background-color: #ff4500; /* Bright Orange */
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 40px;
            border: 3px solid #e63946;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.8);
        }

        .clown-hair {
            width: 100%;
            height: 50px;
            background-color: #ff0000; /* Bright Red */
            border-radius: 50% / 100% 100% 0 0;
            position: absolute;
            top: -10px;
            left: 0;
            z-index: 1;
        }

        /* Clown Body/Suit */
        .clown-body {
            width: 100%;
            height: 220px;
            background: linear-gradient(to bottom, #ff0080 0%, #ff66b2 100%); /* Pink/Magenta Suit */
            border-radius: 10px 10px 50% 50%;
            position: absolute;
            bottom: 0;
            left: 0;
            box-shadow: 0 15px 20px rgba(0, 0, 0, 0.2);
        }

        /* Hands/Juggling Area */
        .clown-hands {
            position: absolute;
            bottom: 30px;
            width: 80px;
            height: 40px;
            background-color: #f7d100; /* Glove Yellow */
            border-radius: 15px;
            z-index: 11;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Juggling Balls */
        .ball {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, white, inherit);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3);
            opacity: 0; /* Start invisible for animation control */
            animation-timing-function: cubic-bezier(0.3, 0.8, 0.2, 1); /* Realistic arc curve */
        }

        /* Specific Ball Colors & Positioning Containers */
        #ball1 { background-color: #ff3366; left: 30px; animation: juggle1 3s infinite; }
        #ball2 { background-color: #33ccff; right: 40px; animation: juggle2 3s infinite; }
        #ball3 { background-color: #ccff33; left: 60px; animation: juggle3 3s infinite; }
        #ball4 { background-color: #ff9933; right: 10px; animation: juggle4 3s infinite; }

        /* --- Keyframe Animations --- */

        /* Clown Movement */
        @keyframes sway {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-52%) rotate(1deg); }
        }

        /* Juggling Ball Animations (Simulating Parabolic Arcs) */
        /* General pattern: Start near hand -> Rise -> Peak -> Fall */

        /* Ball 1 (Left side, upward arc) */
        @keyframes juggle1 {
            0%, 100% { transform: translate(30px, 150px); opacity: 1; }
            5% { transform: translate(40px, 120px); opacity: 1; } /* Initial lift */
            20% { transform: translate(80px, 50px); opacity: 1; } /* Peak */
            60% { transform: translate(120px, 100px); opacity: 1; } /* Falling right */
            100% { transform: translate(30px, 150px); opacity: 1; }
        }

        /* Ball 2 (Right side, upward arc) */
        @keyframes juggle2 {
            0%, 100% { transform: translate(calc(100vw - 130px), 150px); opacity: 1; }
            5% { transform: translate(calc(100vw - 40px + 20px), 120px); opacity: 1; }
            20% { transform: translate(calc(100vw - 60px), 50px); opacity: 1; } /* Peak */
            60% { transform: translate(calc(100vw - 120px), 100px); opacity: 1; } /* Falling left */
            100% { transform: translate(calc(100vw - 130px), 150px); opacity: 1; }
        }

        /* Ball 3 (Center, high arc) */
        @keyframes juggle3 {
            0%, 100% { transform: translate(calc(100vw / 2 - 40px), 150px); opacity: 1; }
            5% { transform: translate(calc(100vw / 2 - 10px), 120px); opacity: 1; }
            25% { transform: translate(calc(100vw / 2 + 50px), 30px); opacity: 1; } /* High Peak */
            55% { transform: translate(calc(100vw / 2 - 20px), 100px); opacity: 1; }
            100% { transform: translate(calc(100vw / 2 - 40px), 150px); opacity: 1; }
        }

        /* Ball 4 (Far side, gentle arc) */
        @keyframes juggle4 {
            0%, 100% { transform: translate(calc(100vw - 160px), 150px); opacity: 1; }
            5% { transform: translate(calc(100vw - 140px), 120px); opacity: 1; }
            30% { transform: translate(calc(100vw - 90px), 70px); opacity: 1; } /* Gentle Peak */
            70% { transform: translate(calc(100vw - 110px), 110px); opacity: 1; }
            100% { transform: translate(calc(100vw - 160px), 150px); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="scene-container">
        <!-- 
            The Clown Character: Structured to appear as one unit
            Dimensions are relative to the bottom of the screen (5vh)
        -->
        <div class="clown">
            <div class="clown-head">
                <div class="clown-nose"></div>
                <div class="clown-hair"></div>
            </div>
            <div class="clown-body"></div>
            <div class="clown-hands">
                <!-- Hands position the starting point for the juggling arcs -->
            </div>
        </div>

        <!-- Juggling Balls -->
        <div class="ball" id="ball1"></div>
        <div class="ball" id="ball2"></div>
        <div class="ball" id="ball3"></div>
        <div class="ball" id="ball4"></div>
    </div>

</body>
</html>
