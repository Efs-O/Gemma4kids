<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentle Snowfall</title>
    <style>
        /* Vivid Sky Background */
        body {
            background: linear-gradient(to bottom, #000033 0%, #000066 50%, #000033 100%);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: sans-serif;
        }

        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FFFFFF; /* Bright white for snow */
            border-radius: 50%;
            opacity: 0.8;
            animation-name fall;
            animation-timing-function ease-in-out;
            animation-iteration-count infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) translateX(50vw); /* Drift horizontally */
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- Snowflake Containers will be injected by JavaScript -->

    <script>
        const container = document.body;
        const numberOfSnowflakes = 50;

        for (let i = 0; i < numberOfSnowflakes; i++) {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            
            // Random starting horizontal position (0 to 100vw)
            const startX = Math.random() * window.innerWidth;
            flake.style.left = `${startX}px`;
            
            // Random animation duration and delay for staggered effect
            const duration = (Math.random() * 6) + 5; // Fall time between 5s and 11s
            const delay = Math.random() * 10; // Stagger start time

            flake.style.animationDuration = `${duration}s`;
            flake.style.animationDelay = `${delay}s`;
            
            // Random horizontal drift variation
            const drift = (Math.random() - 0.5) * 100; 
            flake.style.setProperty('--drift', `${drift}vw`);

            container.appendChild(flake);
        }
    </script>

</body>
</html>
