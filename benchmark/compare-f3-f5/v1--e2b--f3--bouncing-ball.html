<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Animation</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #48d1ff 100%); /* Vivid gradient background */
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ball {
            width: 80px;
            height: 80px;
            background-color: #ffcc00; /* Vivid yellow */
            border-radius: 50%;
            position: absolute;
            bottom: 0; /* Start near the floor */
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            animation: bounce 1.5s ease-in-out infinite alternate;
        }

        /* Define the bouncing motion */
        @keyframes bounce {
            0% {
                transform: translate(-50%, 0); /* Grounded position */
            }
            100% {
                transform: translate(-50%, 100px); /* Highest bounce point */
            }
        }
    </style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
