<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clown Juggling Chaos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a2a; /* Deep night sky/stage background */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Embrace the theme */
        }

        /* --- JUGGLER HAND/CENTER AREA --- */
        .clown-focus {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore mouse events */
            z-index: 1;
        }

        .hand-area {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(circle at 50% 100%, rgba(255,255,0,0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 50px 10px rgba(255, 105, 180, 0.7); /* Hot pink glow */
            z-index: 10;
        }

        /* --- THE BALLS --- */
        .ball {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            animation: juggle 4s infinite ease-in-out;
            opacity: 0.9;
        }

        /* Define the core bouncing animation */
        @keyframes juggle {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                animation-timing-function: cubic-bezier(0.2, 1, 0.5, 1);
            }
            50% {
                /* Bounce upward slightly and wobble */
                transform: translate(5px, -100px) scale(1.1);
                animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
            }
            25%, 75% {
                /* Side drift */
                transform: translate(-10px, 20px) scale(0.95);
            }
        }

        /* Specific Ball Styling and Animation Delays/Offsets */
        .ball:nth-child(1) {
            background-color: #FF00FF; /* Magenta */
            animation-delay: 0s;
            animation-name: juggle1;
            top: 10%; left: 15%;
        }
        .ball:nth-child(2) {
            background-color: #00FFFF; /* Cyan */
            animation-delay: -0.8s;
            animation-name: juggle2;
            top: 15%; left: 75%;
        }
        .ball:nth-child(3) {
            background-color: #FFFF00; /* Electric Yellow */
            animation-delay: -1.6s;
            animation-name: juggle3;
            top: 30%; left: 30%;
        }
        .ball:nth-child(4) {
            background-color: #FF69B4; /* Bright Pink */
            animation-delay: -0.4s;
            animation-name: juggle4;
            top: 60%; left: 60%;
        }
        .ball:nth-child(5) {
            background-color: #32CD32; /* Lime Green */
            animation-delay: -2.4s;
            animation-name: juggle5;
            top: 40%; left: 5%;
        }

        /* Customizing Keyframes for varied paths */
        @keyframes juggle1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -150px) scale(1.1); }
            25%, 75% { transform: translate(10px, 50px) scale(0.95); }
        }
        @keyframes juggle2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -120px) scale(1.1); }
            25%, 75% { transform: translate(-5px, 30px) scale(0.95); }
        }
        @keyframes juggle3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15px, -200px) scale(1.1); }
            25%, 75% { transform: translate(30px, 80px) scale(0.95); }
        }
        @keyframes juggle4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, -140px) scale(1.1); }
            25%, 75% { transform: translate(5px, 40px) scale(0.95); }
        }
        @keyframes juggle5 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -100px) scale(1.1); }
            25%, 75% { transform: translate(-15px, 70px) scale(0.95); }
        }
    </style>
</head>
<body>

    <!-- The visual anchor for the action -->
    <div class="clown-focus">
        <div class="hand-area"></div>
    </div>

    <!-- The Juggling Balls -->
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>

</body>
</html>
