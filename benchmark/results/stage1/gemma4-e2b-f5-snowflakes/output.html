<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Falling Snowflakes</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a20; /* Deep cosmic blue/purple */
            height: 100vh;
            font-family: sans-serif;
        }

        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: white; /* Base color */
            border-radius: 50%; /* Make them look more like soft particles */
            opacity: 0.8;
            animation-name fall;
            animation-timing-function ease-in-out;
            animation-iteration-count infinite;
        }

        /* Define the gentle falling animation */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) translateX(20vw); /* Move down and slightly sideways */
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>

    <div id="snowflakeContainer">
        <!-- Snowflakes will be injected here by JavaScript -->
    </div>

    <script>
        const container = document.getElementById('snowflakeContainer');
        const numberOfSnowflakes = 150;

        /**
         * Generates a single snowflake element with random properties.
         * @param {number} index - The index of the snowflake.
         */
        function createSnowflake(index) {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');

            // Random initial horizontal position
            const startX = Math.random() * 100; 
            
            // Random animation delay for staggered effect
            const delay = Math.random() * 5; 

            // Apply initial positioning and animation properties
            flake.style.left = `${startX}vw`;
            flake.style.top = `${Math.random() * 100}vh`; /* Start them at random heights */
            flake.style.animationDelay = `${delay}s`;
            
            // Randomize color for vivid effect
            const colors = ['#ffdd44', '#44ffff', '#ff66cc', '#aaffaa', '#66ffff', '#ff9999'];
            flake.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Adjust the animation speed slightly based on index for more variation
            const animationDuration = 8 + Math.random() * 6; // Slower fall time
            flake.style.animationDuration = `${animationDuration}s`;
            
            container.appendChild(flake);
        }

        // Generate the desired number of snowflakes
        for (let i = 0; i < numberOfSnowflakes; i++) {
            createSnowflake(i);
        }
    </script>

</body>
</html>
