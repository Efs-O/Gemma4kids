<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        /* Global Setup */
        body {
            margin: 0;
            overflow: hidden;
            /* Initial background before animation starts */
            background-color: #34495e; /* Dark, stormy mood */
            font-family: sans-serif;
        }

        .scene-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* --- Rain Simulation (Midground/Background) --- */
        .rain-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .raindrop {
            position: absolute;
            width: 1px;
            height: 30px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.7), rgba(135, 206, 235, 0.5));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 0.5; }
            100% { transform: translateY(100vh); opacity: 0.1; }
        }

        /* --- Rainbow Appearance (Foreground Focus) --- */
        .rainbow-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            opacity: 0; /* Start hidden */
            transition: opacity 3s ease-in-out; /* Smooth fade in */
            background: linear-gradient(135deg, #ff0000, #ff7f50, #ff6347, #ffff00, #00fa9a, #00ced1, #4b0082);
        }

        /* --- Ground/Atmosphere (Deepest Layer) --- */
        .atmosphere-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            /* Color shifts slightly based on scene state */
            background-color: #1e2a3a;
        }

        /* Animation Trigger */
        .reveal-rainbow {
            opacity: 1 !important;
        }

    </style>
</head>
<body>

    <div class="scene-container">
        
        <!-- 1. Rain Simulation (Layered Depth) -->
        <div class="rain-layer" id="rainLayer">
            <!-- Generating many rain drops for effect -->
            <div class="raindrop" style="left: 10%; animation-delay: 0s;"></div>
            <div class="raindrop" style="left: 25%; animation-delay: 0.5s;"></div>
            <div class="raindrop" style="left: 40%; animation-delay: 1s;"></div>
            <div class="raindrop" style="left: 55%; animation-delay: 1.5s;"></div>
            <div class="raindrop" style="left: 70%; animation-delay: 2s;"></div>
            <div class="raindrop" style="left: 85%; animation-delay: 2.5s;"></div>
        </div>

        <!-- 2. Atmosphere/Ground (Deepest Layer) -->
        <div class="atmosphere-layer"></div>

        <!-- 3. Rainbow (Foreground Focus) -->
        <div class="rainbow-layer" id="rainbowLayer"></div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rainbowLayer = document.getElementById('rainbowLayer');
            const rainLayer = document.getElementById('rainLayer');
            
            // Simulate the transition: Rain falls, then the rainbow appears.
            // We will use a short delay to let the rain establish itself before the rainbow fades in.

            // Step 1: Wait a moment (or simulate the initial storm)
            // We reveal the rainbow after a delay.
            setTimeout(() => {
                // Trigger the reveal animation for the rainbow
                rainbowLayer.classList.add('reveal-rainbow');
            }, 1500); // Wait 1.5 seconds before the rainbow starts appearing

            // Optional: If you wanted the rain to stop immediately when the rainbow appears, you could add a fade-out to the rain layer here.
        });
    </script>

</body>
</html>
