<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Leaf Fall</title>
    <style>
        :root {
            /* Autumn Colors */
            --color-red: #D02020;
            --color-orange: #FF8C00;
            --color-yellow: #FFD700;
            --color-brown: #8B4513;
            --color-sky-top: #87CEEB; /* Bright Sky Blue */
            --color-sky-bottom: #ADD8E6; /* Lighter Blue near ground */
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Important to keep falling elements contained */
            background: linear-gradient(to bottom, var(--color-sky-top) 0%, var(--color-sky-bottom) 70%, #b26c2d 100%);
            height: 100vh;
            width: 100vw;
        }

        .leaf {
            position: absolute;
            width: 50px;
            height: 40px;
            opacity: 0.8;
            background-color: inherit; /* Colors set individually or via class */
            transform: rotate(0deg);
            will-change: transform, opacity;
            pointer-events: none; /* Allows clicking through elements */
            animation: fall linear infinite;
            z-index: 10;
        }

        /* Keyframes for the falling motion */
        @keyframes fall {
            0% {
                transform: translateY(-5vh) translateX(0) rotate(0deg);
                opacity: 0.8;
                animation-timing-function: ease-out;
            }
            100% {
                /* Moves far down the screen, simulating gravity */
                transform: translateY(110vh) translateX(calc(var(--drift-x) * 1px)) rotate(var(--final-rotation));
                opacity: 0;
            }
        }

        /* =================================================
           Leaf Definitions (35+ instances for density)
           ================================================= */

        /* Leaf 1 - Big Red */
        .l1 {
            background-color: var(--color-red);
            width: 60px; height: 50px;
            top: 0; left: 10vw;
            animation-duration: 8s;
            animation-delay: 0s;
            --drift-x: -5vw;
            --final-rotation: 720deg;
        }

        /* Leaf 2 - Small Yellow */
        .l2 {
            background-color: var(--color-yellow);
            width: 30px; height: 25px;
            top: 5vh; left: 20vw;
            animation-duration: 6s;
            animation-delay: 0.5s;
            --drift-x: 10vw;
            --final-rotation: 1080deg;
        }

        /* Leaf 3 - Orange, Slow */
        .l3 {
            background-color: var(--color-orange);
            width: 45px; height: 35px;
            top: 10vh; left: 35vw;
            animation-duration: 10s;
            animation-delay: 1s;
            --drift-x: -15vw;
            --final-rotation: 1440deg;
        }

        /* Leaf 4 - Red, Medium Drift */
        .l4 {
            background-color: var(--color-red);
            width: 50px; height: 40px;
            top: 15vh; left: 50vw;
            animation-duration: 7s;
            animation-delay: 1.2s;
            --drift-x: 5vw;
            --final-rotation: 900deg;
        }

        /* Leaf 5 - Yellow, Fast */
        .l5 {
            background-color: var(--color-yellow);
            width: 35px; height: 30px;
            top: 20vh; left: 70vw;
            animation-duration: 5s;
            animation-delay: 0.2s;
            --drift-x: -20vw;
            --final-rotation: 180deg;
        }

        /* Leaf 6 - Brown, Gentle */
        .l6 {
            background-color: var(--color-brown);
            width: 40px; height: 30px;
            top: 25vh; left: 5vw;
            animation-duration: 12s;
            animation-delay: 1.8s;
            --drift-x: 0vw;
            --final-rotation: 360deg;
        }

        /* Leaf 7 - Orange, Randomizing */
        .l7 {
            background-color: var(--color-orange);
            width: 45px; height: 35px;
            top: 30vh; left: 25vw;
            animation-duration: 9s;
            animation-delay: 0.8s;
            --drift-x: 12vw;
            --final-rotation: 1100deg;
        }

        /* Leaf 8 - Red, High Density */
        .l8 {
            background-color: var(--color-red);
            width: 55px; height: 45px;
            top: 35vh; left: 85vw;
            animation-duration: 6.5s;
            animation-delay: 0.4s;
            --drift-x: -10vw;
            --final-rotation: 630deg;
        }

        /* Leaf 9 - Yellow, Medium Drift */
        .l9 {
            background-color: var(--color-yellow);
            width: 30px; height: 25px;
            top: 40vh; left: 15vw;
            animation-duration: 7.5s;
            animation-delay: 1.5s;
            --drift-x: 8vw;
            --final-rotation: 1620deg;
        }
        
        /* Leaves 10-35 (Filling the required density and variation) */
        .l10 { background-color: var(--color-red); width: 40px; height: 35px; top: 0%; left: 5%; animation-duration: 10s; animation-delay: 2s; --drift-x: 15vw; --final-rotation: 900deg; }
        .l11 { background-color: var(--color-yellow); width: 30px; height: 25px; top: 3%; left: 10%; animation-duration: 5.5s; animation-delay: 0.1s; --drift-x: -25vw; --final-rotation: 1200deg; }
        .l12 { background-color: var(--color-orange); width: 50px; height: 40px; top: 5%; left: 25%; animation-duration: 8s; animation-delay: 1.5s; --drift-x: 0vw; --final-rotation: 360deg; }
        .l13 { background-color: var(--color-red); width: 45px; height: 35px; top: 8%; left: 40%; animation-duration: 7s; animation-delay: 0.9s; --drift-x: 18vw; --final-rotation: 1000deg; }
        .l14 { background-color: var(--color-yellow); width: 35px; height: 30px; top: 12%; left: 60%; animation-duration: 6s; animation-delay: 0.3s; --drift-x: -5vw; --final-rotation: 200deg; }
        .l15 { background-color: var(--color-brown); width: 30px; height: 20px; top: 15%; left: 80%; animation-duration: 11s; animation-delay: 2.5s; --drift-x: 10vw; --final-rotation: 1800deg; }
        .l16 { background-color: var(--color-orange); width: 40px; height: 30px; top: 18%; left: 15%; animation-duration: 9s; animation-delay: 1.1s; --drift-x: 2vw; --final-rotation: 1500deg; }
        .l17 { background-color: var(--color-red); width: 50px; height: 45px; top: 20%; left: 30%; animation-duration: 6.5s; animation-delay: 0.5s; --drift-x: 22vw; --final-rotation: 850deg; }
        .l18 { background-color: var(--color-yellow); width: 30px; height: 25px; top: 22%; left: 50%; animation-duration: 7.5s; animation-delay: 1.8s; --drift-x: -15vw; --final-rotation: 1700deg; }
        .l19 { background-color: var(--color-orange); width: 45px; height: 35px; top: 25%; left: 75%; animation-duration: 8.5s; animation-delay: 0.7s; --drift-x: 5vw; --final-rotation: 1300deg; }
        .l20 { background-color: var(--color-red); width: 55px; height: 50px; top: 28%; left: 5%; animation-duration: 5s; animation-delay: 0.1s; --drift-x: 30vw; --final-rotation: 700deg; }
        .l21 { background-color: var(--color-yellow); width: 30px; height: 25px; top: 30%; left: 20%; animation-duration: 10s; animation-delay: 2.2s; --drift-x: -10vw; --final-rotation: 2100deg; }
        .l22 { background-color: var(--color-brown); width: 40px; height: 30px; top: 32%; left: 45%; animation-duration: 12s; animation-delay: 0.5s; --drift-x: 10vw; --final-rotation: 200deg; }
        .l23 { background-color: var(--color-red); width: 45px; height: 35px; top: 35%; left: 70%; animation-duration: 6s; animation-delay: 1.3s; --drift-x: -8vw; --final-rotation: 900deg; }
        .l24 { background-color: var(--color-orange); width: 50px; height: 40px; top: 38%; left: 90%; animation-duration: 7s; animation-delay: 0.4s; --drift-x: 50vw; --final-rotation: 1400deg; }
        
        /* Filling remainder (L25 to L38) */
        .l25 { background-color: var(--color-yellow); width: 35px; height: 30px; top: 40%; left: 0%; animation-duration: 8s; animation-delay: 3s; --drift-x: 5vw; --final-rotation: 180deg; }
        .l26 { background-color: var(--color-red); width: 40px; height: 35px; top: 42%; left: 10%; animation-duration: 7s; animation-delay: 2.1s; --drift-x: -20vw; --final-rotation: 1100deg; }
        .l27 { background-color: var(--color-orange); width: 45px; height: 35px; top: 45%; left: 25%; animation-duration: 9s; animation-delay: 1.6s; --drift-x: 10vw; --final-rotation: 2300deg; }
        .l28 { background-color: var(--color-red); width: 50px; height: 45px; top: 48%; left: 40%; animation-duration: 6.5s; animation-delay: 0.6s; --drift-x: 0vw; --final-rotation: 1000deg; }
        .l29 { background-color: var(--color-yellow); width: 30px; height: 25px; top: 50%; left: 65%; animation-duration: 7.5s; animation-delay: 0.3s; --drift-x: -25vw; --final-rotation: 1500deg; }
        .l30 { background-color: var(--color-brown); width: 30px; height: 20px; top: 52%; left: 80%; animation-duration: 11s; animation-delay: 2.8s; --drift-x: 15vw; --final-rotation: 2100deg; }
        .l31 { background-color: var(--color-orange); width: 40px; height: 30px; top: 55%; left: 5%; animation-duration: 8s; animation-delay: 1.9s; --drift-x: 5vw; --final-rotation: 1300deg; }
        .l32 { background-color: var(--color-red); width: 45px; height: 35px; top: 58%; left: 20%; animation-duration: 6s; animation-delay: 0.8s; --drift-x: 22vw; --final-rotation: 800deg; }
        .l33 { background-color: var(--color-yellow); width: 30px; height: 25px; top: 60%; left: 45%; animation-duration: 7s; animation-delay: 1.5s; --drift-x: -15vw; --final-rotation: 1800deg; }
        .l34 { background-color: var(--color-orange); width: 50px; height: 40px; top: 63%; left: 70%; animation-duration: 9s; animation-delay: 0.5s; --drift-x: 5vw; --final-rotation: 1200deg; }
        .l35 { background-color: var(--color-red); width: 55px; height: 50px; top: 66%; left: 90%; animation-duration: 5.5s; animation-delay: 0.2s; --drift-x: 40vw; --final-rotation: 750deg; }


    </style>
</head>
<body>

    <!-- 35+ Leaf Elements -->
    <div class="leaf l1"></div>
