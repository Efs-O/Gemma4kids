<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Autumn Leaves</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --tree-brown: #8B4513;
            --leaf-red: #FF4500;
            --leaf-orange: #FFA500;
            --leaf-yellow: #FFD700;
            --leaf-brown: #A0522D;
        }

        body {
            background: linear-gradient(to bottom, hsl(120, 70%, 50%), hsl(110, 60%, 40%)); /* Sky and ground colors */
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 80vh; /* Make the scene tall enough for falling */
            border-bottom: 50px solid var(--tree-brown); /* Ground line */
        }

        /* Tree elements (simple representation) */
        .tree {
            position: absolute;
            bottom: 0;
            width: 50px;
            height: 150px;
            background-color: var(--tree-brown);
            border-radius: 25px 25px 0 0;
            z-index: 10;
        }

        /* Leaf styling */
        .leaf {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%; /* Start with a simple shape */
            opacity: 0; /* Start hidden */
            animation: fall linear infinite;
            top: -100px; /* Start above the screen */
            z-index: 5;
        }

        /* Define the falling animation */
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0.5; /* Fade slightly as it falls */
            }
        }

        /* Specific leaf styles and animations */
        .leaf:nth-child(1) { background-color: var(--leaf-red); left: 10%; animation-duration: 6s; }
        .leaf:nth-child(2) { background-color: var(--leaf-orange); left: 25%; animation-duration: 5s; }
        .leaf:nth-child(3) { background-color: var(--leaf-yellow); left: 40%; animation-duration: 7s; }
        .leaf:nth-child(4) { background-color: var(--leaf-brown); left: 55%; animation-duration: 5.5s; }
        .leaf:nth-child(5) { background-color: var(--leaf-red); left: 70%; animation-duration: 6.5s; }
        .leaf:nth-child(6) { background-color: var(--leaf-orange); left: 85%; animation-duration: 5.2s; }
        .leaf:nth-child(7) { background-color: var(--leaf-yellow); left: 100%; animation-duration: 7.5s; }
        .leaf:nth-child(8) { background-color: var(--leaf-brown); left: 5%; animation-duration: 5.8s; }

        /* Add more leaves to make the effect richer */
        .leaf:nth-child(9) { background-color: var(--leaf-red); left: 20%; animation-duration: 6.2s; }
        .leaf:nth-child(10) { background-color: var(--leaf-orange); left: 35%; animation-duration: 5.1s; }
        .leaf:nth-child(11) { background-color: var(--leaf-yellow); left: 50%; animation-duration: 7.1s; }
        .leaf:nth-child(12) { background-color: var(--leaf-brown); left: 65%; animation-duration: 5.9s; }
        .leaf:nth-child(13) { background-color: var(--leaf-red); left: 80%; animation-duration: 6.8s; }
        .leaf:nth-child(14) { background-color: var(--leaf-orange); left: 15%; animation-duration: 5.3s; }
        .leaf:nth-child(15) { background-color: var(--leaf-yellow); left: 30%; animation-duration: 7.3s; }

    </style>
</head>
<body>
    <div class="scene">
        <!-- Tree 1 -->
        <div class="tree" style="left: 10%;"></div>
        <!-- Tree 2 -->
        <div class="tree" style="left: 30%;"></div>
        <!-- Tree 3 -->
        <div class="tree" style="left: 50%;"></div>
        <!-- Tree 4 -->
        <div class="tree" style="left: 70%;"></div>

        <!-- Falling Leaves -->
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
    </div>
</body>
</html>
