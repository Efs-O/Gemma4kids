<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Fall Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a8e6cf, #f5f5dc); /* Light sky/ground colors */
            overflow: hidden; /* Hide anything falling outside the viewport */
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- Tree Elements (Static anchors) --- */
        .tree {
            position: absolute;
            width: 150px;
            height: 300px;
            background-color: #4b693d; /* Deep green trunks */
            border-radius: 10px 10px 0 0;
            top: 100px;
            z-index: 10;
            opacity: 0.7;
        }

        /* Positioning the trees across the viewport */
        .tree:nth-child(1) { left: 5%; }
        .tree:nth-child(2) { left: 25%; }
        .tree:nth-child(3) { left: 45%; }
        .tree:nth-child(4) { left: 65%; }
        .tree:nth-child(5) { left: 85%; }


        /* --- Falling Leaf Animation --- */
        .leaf {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* A more leaf-like shape */
            opacity: 0.9;
            animation: fall linear infinite;
            pointer-events: none; /* Make sure clicks pass through */
            z-index: 5;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) translateX(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) translateX(50px); /* Drift slightly to the right */
                opacity: 0.2;
            }
        }

        /* --- Specific Leaf Styling and Animation Delays --- */

        /* Leaf Group 1 (Reds/Oranges) */
        .leaf:nth-child(1) { background-color: #ff6b6b; left: 10%; top: 0; animation-duration: 8s; }
        .leaf:nth-child(2) { background-color: #ff9f4b; left: 30%; top: 0; animation-duration: 10s; animation-delay: 1s; }
        .leaf:nth-child(3) { background-color: #ffcc00; left: 50%; top: 0; animation-duration: 9s; animation-delay: 2s; }
        .leaf:nth-child(4) { background-color: #ff4d4d; left: 70%; top: 0; animation-duration: 7s; animation-delay: 3s; }

        /* Leaf Group 2 (Yellows/Oranges) */
        .leaf:nth-child(5) { background-color: #feca57; left: 5%; top: 0; animation-duration: 11s; animation-delay: 0.5s; }
        .leaf:nth-child(6) { background-color: #ffc107; left: 20%; top: 0; animation-duration: 9.5s; animation-delay: 1.5s; }
        .leaf:nth-child(7) { background-color: #ff7043; left: 40%; top: 0; animation-duration: 8.5s; animation-delay: 2.5s; }
        .leaf:nth-child(8) { background-color: #ff8a65; left: 60%; top: 0; animation-duration: 10.5s; animation-delay: 3.5s; }

        /* Leaf Group 3 (Deep Browns/Oranges) */
        .leaf:nth-child(9) { background-color: #a1887f; left: 15%; top: 0; animation-duration: 12s; animation-delay: 0.8s; }
        .leaf:nth-child(10) { background-color: #d6b65b; left: 35%; top: 0; animation-duration: 9s; animation-delay: 2.8s; }
        .leaf:nth-child(11) { background-color: #b71c1c; left: 55%; top: 0; animation-duration: 11.5s; animation-delay: 0.3s; }
        .leaf:nth-child(12) { background-color: #e65100; left: 75%; top: 0; animation-duration: 7.5s; animation-delay: 4s; }

    </style>
</head>
<body>

    <!-- Background Trees (Anchors) -->
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>

    <!-- Falling Leaves -->
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>

</body>
</html>
