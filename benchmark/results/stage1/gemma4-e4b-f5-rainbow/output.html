<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        :root {
            --rain-duration: 5s;
            --show-rain: 1;
            --show-rainbow: 1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3a4a75; /* Dark, stormy sky color */
            transition: background-color 2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- RAIN STYLES --- */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through the rain */
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .raindrop {
            position: absolute;
            width: 3px;
            height: 100px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.5), rgba(100, 149, 237, 0.2));
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) translateX(5vw); /* Moves slightly sideways for visual spread */
                opacity: 0.3;
            }
        }

        /* --- RAIN FADE CLASS --- */
        .rain-container.hidden {
            opacity: 0;
        }


        /* --- RAINBOW STYLES --- */
        .rainbow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 10;
        }

        .rainbow-container.visible {
            opacity: 1;
        }

        .rainbow-arc {
            position: absolute;
            border-radius: 50% / 100% 100% 0 0; /* Creates a smooth, curved segment */
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5); /* Subtle glow */
        }

        /* Defining the arcs using specific colors and positioning */
        #red-arc {
            width: 300px;
            height: 150px;
            background: linear-gradient(to right, transparent, rgba(255, 0, 0, 0.6), transparent);
            transform: translateY(50px) scale(1.0);
            z-index: 11;
        }
        #orange-arc {
            width: 350px;
            height: 160px;
            background: linear-gradient(to right, transparent, rgba(255, 165, 0, 0.6), transparent);
            transform: translateY(70px) scale(1.0);
            z-index: 11;
        }
        #yellow-arc {
            width: 400px;
            height: 180px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 0, 0.6), transparent);
            transform: translateY(90px) scale(1.0);
            z-index: 11;
        }
        #green-arc {
            width: 380px;
            height: 170px;
            background: linear-gradient(to right, transparent, rgba(0, 255, 0, 0.6), transparent);
            transform: translateY(110px) scale(1.0);
            z-index: 11;
        }
        #blue-arc {
            width: 320px;
            height: 140px;
            background: linear-gradient(to right, transparent, rgba(0, 0, 255, 0.6), transparent);
            transform: translateY(130px) scale(1.0);
            z-index: 11;
        }
        #indigo-arc {
            width: 280px;
            height: 120px;
            background: linear-gradient(to right, transparent, rgba(75, 0, 130, 0.6), transparent);
            transform: translateY(150px) scale(1.0);
            z-index: 11;
        }
        #violet-arc {
            width: 250px;
            height: 100px;
            background: linear-gradient(to right, transparent, rgba(147, 112, 219, 0.6), transparent);
            transform: translateY(170px) scale(1.0);
            z-index: 11;
        }

        /* Styling for the ground/cleared sky */
        body::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh; /* A bit of ground to anchor the rainbow */
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- 1. RAIN CONTAINER -->
    <div class="rain-container" id="rainContainer">
        <!-- Raindrops will be inserted here by JS -->
    </div>

    <!-- 2. RAINBOW CONTAINER -->
    <div class="rainbow-container" id="rainbowContainer">
        <div class="rainbow-arc" id="red-arc"></div>
        <div class="rainbow-arc" id="orange-arc"></div>
        <div class="rainbow-arc" id="yellow-arc"></div>
        <div class="rainbow-arc" id="green-arc"></div>
        <div class="rainbow-arc" id="blue-arc"></div>
        <div class="rainbow-arc" id="indigo-arc"></div>
        <div class="rainbow-arc" id="violet-arc"></div>
    </div>

    <script>
        const rainContainer = document.getElementById('rainContainer');
        const rainbowContainer = document.getElementById('rainbowContainer');
        const body = document.body;

        const numRaindrops = 50;
        const initialRaindropStyles = {};

        // --- PHASE 1: Generate Rain ---
        function createRain() {
            for (let i = 0; i < numRaindrops; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                
                // Random positioning across the viewport width
                const leftPosition = Math.random() * 100; 
                drop.style.left = `${leftPosition}vw`;
                
                // Randomizing animation duration/delay slightly
                drop.style.animationDelay = `${Math.random() * 0.5}s`;
                
                rainContainer.appendChild(drop);
                initialRaindropStyles[drop.id || 'dynamic'] = drop; // Store reference if needed
            }
            console.log("Rain generated.");
        }

        // --- PHASE 2: Sequence Control ---
        function startShowSequence() {
            // 1. Initial Rain phase (visible immediately)
            createRain();
            
            // Wait for rain effect to run for a while (e.g., 5 seconds)
            const rainDuration = 5000; 
            setTimeout(() => {
                console.log("Rain stopping...");
                // 2. Hide Rain
                rainContainer.classList.add('hidden');
                
                // Optional: Change background slightly to transition from grey storm to bright sky
                body.style.backgroundColor = '#87ceeb'; // Sky blue
                body.style.transition = 'background-color 3s ease-in-out';

                // Wait a moment for the visual transition
                setTimeout(() => {
                    console.log("Displaying Rainbow...");
                    // 3. Show Rainbow
                    rainbowContainer.classList.add('visible');
                }, 500); // Short pause after rain fades

            }, rainDuration);
        }

        // Start the entire animation sequence
        startShowSequence();

    </script>
</body>
</html>
