<!DOCTYPE html>
<html>
<head>
<title>Fireworks Night</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #0a0a2a 0%, #000033 100%);
    cursor: default;
}

/* Star Background Effect */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.3;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1.2);
    }
}

/* Falling Confetti */
.confetti {
    position: absolute;
    width: 8px;
    height: 12px;
    background-color: var(--confetti-color);
    opacity: 0.8;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-10vh) translateX(0);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) translateX(100vw);
        opacity: 0.5;
    }
}

/* Firework Trail (The upward launch) */
.firework {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to top, transparent, var(--firework-color));
    transform: translateX(-50%);
    animation: launch var(--launch-time) linear forwards;
}

@keyframes launch {
    0% {
        bottom: 0;
        opacity: 1;
    }
    100% {
        bottom: 60%; /* Explode around 60% up the screen */
        opacity: 0;
    }
}

/* Explosion Container (Will hold the particles) */
.explosion {
    position: absolute;
    pointer-events: none;
}

/* Particle Styling */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background-color: var(--particle-color);
    animation: explode var(--explosion-duration) ease-out forwards;
}

@keyframes explode {
    0% {
        transform: scale(1) translate(0, 0);
        opacity: 1;
    }
    100% {
        transform: scale(1.5) translate(var(--x-end), var(--y-end));
        opacity: 0;
    }
}
</style>
</head>
<body id="container">

<script>
    const body = document.body;
    const numStars = 100;

    // 1. Create stars for the night sky effect
    for (let i = 0; i < numStars; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDelay = Math.random() * 2 + 's';
        body.appendChild(star);
    }

    // Helper function to generate a random vivid color
    function getRandomColor() {
        const colors = [
            'hsl(200, 90%, 50%)', // Blueish
            'hsl(10, 90%, 60%)',  // Orange/Yellow
            'hsl(140, 90%, 60%)', // Greenish
            'hsl(300, 90%, 60%)'  // Pink/Purple
        ];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    // Function to create a single firework launch and explosion
    function createFirework() {
        const startX = Math.random() * 100; // Percentage across the screen
        const launchTime = Math.random() * 1.5 + 1.0; // 1 to 2.5 seconds launch time
        const explosionY = 50 + Math.random() * 30; // Explodes between 50vh and 80vh

        // --- 1. Create the Launch Trail ---
        const firework = document.createElement('div');
        firework.className = 'firework';
        firework.style.setProperty('--firework-color', getRandomColor());
        firework.style.setProperty('--launch-time', `${launchTime}s`);
        // Set initial position to ensure it starts correctly before animation kicks in
        firework.style.left = `${startX}vw`;
        firework.style.bottom = '0px';
        body.appendChild(firework);

        // Wait for the launch animation to *almost* finish, then create the explosion
        setTimeout(() => {
            // Remove the visible trail element immediately after launch completes
            firework.remove();

            // --- 2. Create the Explosion ---
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${startX}vw`;
            explosion.style.top = `${explosionY}vh`;
            explosion.style.width = '100%';
            explosion.style.height = '100%';
            body.appendChild(explosion);

            const numParticles = Math.floor(Math.random() * 15) + 20; // 20 to 35 particles
            
            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.setProperty('--particle-color', getRandomColor());
                particle.style.setProperty('--explosion-duration', `${Math.random() * 1.5 + 1.0}s`);
                
                // Calculate random spread vectors for the explosion
                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * 150 + 50; // Spread out between 50px and 200px
                const endX = Math.cos(angle) * distance;
                const endY = Math.sin(angle) * distance;

                particle.style.setProperty('--x-end', `${endX}px`);
                particle.style.setProperty('--y-end', `${endY}px`);
                
                // Position the particle at the center of the explosion container initially
                particle.style.left = '50%';
                particle.style.top = '50%';
                
                explosion.appendChild(particle);
            }
            
            // Clean up the explosion after its animation finishes
            setTimeout(() => {
                explosion.remove();
            }, 2000);

        }, launchTime * 1000); // Wait for the launch duration
    }
    
    // Function to create and animate a single falling piece of confetti
    function createConfetti() {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        
        // Random color for the confetti
        const confettiColor = getRandomColor();
        confetti.style.setProperty('--confetti-color', confettiColor);
        
        // Random horizontal starting position
        const startLeft = Math.random() * 100;
        confetti.style.left = `${startLeft}vw`;
        
        // Random delay and duration to make it look natural
        const delay = Math.random() * 5;
        const duration = Math.random() * 10 + 5; // Falls between 5s and 15s
        
        confetti.style.animationDuration = `${duration}s`;
        confetti.style.animationDelay = `-${delay}s`; // Start slightly offset to prevent stacking
        
        body.appendChild(confetti);

        // Clean up after animation cycle is complete (duration + buffer)
        setTimeout(() => {
            confetti.remove();
        }, duration * 1000 + 1000);
    }

    // --- Initialization ---

    // 1. Fire a new firework every 1 to 3 seconds!
    setInterval(createFirework, Math.random() * 2000 + 1000); 
    
    // 2. Add falling confetti continuously
    setInterval(createConfetti, 100); 
</script>
</body>
</html>
