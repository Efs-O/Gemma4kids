<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Falling Snowflakes</title>
    <style>
        /* Global Setup */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a2a; /* Deep, vivid night blue/purple sky */
            overflow: hidden;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Snowflake Container - The "Sky" */
        .snowflake-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Base Snowflake Styling */
        .snowflake {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ffffff; /* Base white/bright */
            border-radius: 50%;
            opacity: 0.8;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            /* Initial position randomization */
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Vivid Color Variations for variety */
        .snowflake:nth-child(1) { background-color: #ff69b4; } /* Pink */
        .snowflake:nth-child(2) { background-color: #00ffff; } /* Cyan */
        .snowflake:nth-child(3) { background-color: #ffeb3b; } /* Bright Yellow */
        .snowflake:nth-child(4) { background-color: #ff1493; } /* Deep Pink */
        .snowflake:nth-child(5) { background-color: #00ff7f; } /* Spring Green */
        .snowflake:nth-child(6) { background-color: #a020f0; } /* Purple */
        .snowflake:nth-child(7) { background-color: #ffd700; } /* Gold */
        .snowflake:nth-child(8) { background-color: #00bfff; } /* Bright Blue */
        .snowflake:nth-child(9) { background-color: #ff8c00; } /* Dark Orange */
        .snowflake:nth-child(10) { background-color: #ffffff; } /* Pure White */

        /* The Falling Animation */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(-50%);
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) translateX(-50%);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>
    <div class="snowflake-container">

        <div class="snowflake"></div>
