<!DOCTYPE html>
<html>
<head>
<title>Falling Autumn Leaves</title>
<style>
  body {
    background: linear-gradient(to bottom, #87CEEB, #a0d2ff); /* Sky blue top fading to lighter blue */
    margin: 0;
    padding: 0;
    overflow: hidden; /* Hides anything that tries to spill outside the window */
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end; /* Leaves appear to fall from the top */
    position: relative;
  }

  .leaf {
    position: absolute;
    width: 50px; /* Size of the leaf */
    height: 50px;
    opacity: 0.9;
    /* Basic leaf shape using pseudo-elements for detail */
    background-color: transparent;
    border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
    pointer-events: none; /* So the leaves don't block clicks */
    animation: fall linear infinite;
    z-index: 1;
  }

  /* Specific colors and starting positions for variety */
  .leaf:nth-child(1) {
    background-color: #D2691E; /* Orange-Brown */
    left: 10%;
    top: -10%;
    animation-duration: 10s;
    animation-delay: 0s;
    animation-timing-function: linear;
  }

  .leaf:nth-child(2) {
    background-color: #FF4500; /* Bright Orange */
    left: 25%;
    top: -5%;
    animation-duration: 12s;
    animation-delay: 1s;
    animation-timing-function: linear;
  }

  .leaf:nth-child(3) {
    background-color: #DAA52A; /* Golden Yellow */
    left: 40%;
    top: -15%;
    animation-duration: 15s;
    animation-delay: 0.5s;
    animation-timing-function: linear;
  }

  .leaf:nth-child(4) {
    background-color: #DC143C; /* Deep Red */
    left: 60%;
    top: -10%;
    animation-duration: 11s;
    animation-delay: 0.2s;
    animation-timing-function: linear;
  }

  .leaf:nth-child(5) {
    background-color: #FF8C00; /* Bright Orange */
    left: 80%;
    top: -20%;
    animation-duration: 18s;
    animation-delay: 0s;
    animation-timing-function: linear;
  }

  /* Keyframe animation for falling and drifting */
  @keyframes fall {
    0% {
      transform: translateY(-10vh) translateX(0);
      opacity: 1;
    }
    100% {
      /* Moves down the full height of the screen, and drifts randomly */
      transform: translateY(110vh) translateX(calc(100vw + 20vw)) rotate(360deg); 
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <!-- Leaves are placed here in the HTML structure to control initial placement and order -->
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>

</body>
</html>
