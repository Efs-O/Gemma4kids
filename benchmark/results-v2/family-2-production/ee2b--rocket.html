<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch</title>
    <style>
        :root {
            --space-dark: #0d0d1a;
            --rocket-color: #ff4500; /* Bright Orange/Red */
            --star-color: #f0f8ff; /* Light blue/white for stars */
        }

        body {
            background: linear-gradient(to bottom, #00001a, var(--space-dark));
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .space-scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(ellipse at bottom, #1b2f4a 0%, #09091a 100%);
        }

        /* --- Stars Effect --- */
        .star {
            position: absolute;
            background-color: var(--star-color);
            border-radius: 50%;
            width: 1px;
            height: 1px;
            opacity: 0; /* Start invisible */
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* --- Rocket Styling --- */
        .rocket {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 150px;
            background-color: var(--rocket-color);
            border-radius: 10px 10px 20px 20px;
            box-shadow: 0 0 20px var(--rocket-color), 0 0 40px var(--rocket-color);
            z-index: 10;
            animation: launch 4s ease-out forwards;
        }

        @keyframes launch {
            0% {
                bottom: -100px; /* Start below the screen */
                transform: translateX(-50%) scale(0.5);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            100% {
                bottom: 50%; /* End in the middle/top area */
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="space-scene">
        <!-- Stars will be generated by JavaScript -->
        <div id="rocket" class="rocket"></div>
    </div>

    <script>
        const rocket = document.getElementById('rocket');
        const scene = document.querySelector('.space-scene');
        const numberOfStars = 150;

        // Function to create a star
        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random position
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            
            // Random size variation for fun
            const size = Math.random() * 2;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // Stagger the animation slightly for a more natural twinkle
            star.style.animationDelay = `${Math.random() * 2}s`; 

            scene.appendChild(star);
        }

        // Create stars when the page loads
        for (let i = 0; i < numberOfStars; i++) {
            createStar();
        }
    </script>
</body>
</html>
