<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Dreamscape Animation</title>
    <style>
        :root {
            --deep-space-bg: #0d001a;
            --star-color: #ffffff;
            --shooting-color: #ffea00;
            --nebula-color: #ff00ff;
            --glow-color: #00ffff;
        }

        body {
            background-color: var(--deep-space-bg);
            margin: 0;
            padding: 0;
            overflow: hidden; /* Essential for full coverage */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            cursor: default;
        }

        /* Background Layer: Subtle Parallax/Gradient Shift */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(30, 0, 50, 0.6) 0%, rgba(13, 0, 26, 1) 80%);
            animation: spaceShift 60s linear infinite alternate;
            z-index: 1;
        }

        @keyframes spaceShift {
            0% { transform: translate(0%, 0%); }
            100% { transform: translate(-10%, 100%); }
        }

        /* Star Field Container (Background/Deep Space) */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .star {
            position: absolute;
            background-color: var(--star-color);
            border-radius: 50%;
            animation: twinkle linear infinite;
            opacity: 0; /* Start hidden for dramatic reveal */
        }

        /* Twinkling Animation */
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* Nebula/Galaxy Blobs (Midground Depth) */
        .nebula {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
            filter: blur(80px); /* Soft, ethereal look */
            z-index: 3;
            animation: drift 20s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% { transform: translate(0%, 0%) scale(1); }
            100% { transform: translate(50vw, -30vh) scale(1.1); }
        }

        /* Shooting Star (Foreground/Movement) */
        .shooting-star {
            position: absolute;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 234, 0, 0.8) 10%, rgba(255, 234, 0, 0) 100%);
            height: 1px;
            width: 0px; /* Starts at zero width */
            z-index: 4;
            pointer-events: none;
            animation: shoot linear forwards;
        }
    </style>
</head>
<body>

    <!-- Background Layer: Slow shifting gradient -->
    <div class="background-layer"></div>

    <!-- Star Field Layer -->
    <div class="star-field" id="starField">
        <!-- Stars will be injected here by JS -->
    </div>

    <!-- Nebula Elements (Midground) -->
    <div class="nebula" id="nebula1" style="width: 300px; height: 300px; background-color: var(--nebula-color); top: 10%; left: 15%;"></div>
    <div class="nebula" id="nebula2" style="width: 450px; height: 250px; background-color: var(--glow-color); top: 60%; left: 70%; animation-duration: 18s;"></div>
    <div class="nebula" id="nebula3" style="width: 200px; height: 350px; background-color: #ff66ff; top: 20%; left: 5%; animation-duration: 22s;"></div>

    <script>
        const starField = document.getElementById('starField');
        const numStars = 150;

        // --- Star Generation ---
        function generateStars() {
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random size (1px to 4px)
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Random position across the viewport
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                star.style.left = `${left}vw`;
                star.style.top = `${top}vh`;

                // Random animation delay and duration for staggered twinkle effect
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 10 + 5}s`;
                
                starField.appendChild(star);
            }
        }

        // --- Shooting Star Generation ---
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            
            // Random start point (left side)
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;

            star.style.left = `${startX}vw`;
            star.style.top = `${startY}vh`;
            
            // Define the final target area (right side)
            const endX = Math.random() * 70 + 20; // Ensure it covers a good range on the right
            const endY = Math.random() * 70 + 15;
            
            // Animation properties: duration determines speed, delay determines when it starts
            const duration = Math.random() * 1.5 + 1.5; // 1.5s to 3s flight time
            const delay = Math.random() * 3 + 0.5; // 0.5s to 3.5s wait time
            
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${delay}s`;
            
            // Define the CSS keyframe targets dynamically for the animation
            const styleSheet = document.styleSheets[0];
            styleSheet.insertRule(`
                @keyframes shoot-${Date.now()}-${Math.floor(Math.random()*1000)} {
                    from {
                        width: 0px;
                        transform: translate(${startX}vw, ${startY}vh) scaleX(0);
                    }
                    to {
                        width: 100px; /* Visible trail length */
                        transform: translate(${endX}vw, ${endY}vh) scaleX(1);
                    }
                }
            `, styleSheet.cssRules.length);

            // Update the star's animation to use the generated keyframe name
            star.style.animationName = `shoot-${Date.now()}-${Math.floor(Math.random()*1000)}`;
            star.style.animationFillMode = 'forwards';
            star.style.animationTimingFunction = 'linear';
            
            document.body.appendChild(star);

            // Clean up the star after its animation finishes (duration + small buffer)
            setTimeout(() => {
                star.remove();
                styleSheet.deleteRule(styleSheet.cssRules.length - 1);
            }, (delay + duration + 1) * 1000);
        }

        // --- Initialization ---
        window.onload = function() {
            // 1. Create initial star field
            generateStars();

            // 2. Start shooting stars periodically
            setInterval(createShootingStar, 1500); // A new star every 1.5 seconds
        };

    </script>
</body>
</html>
