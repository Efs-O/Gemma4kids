<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Ocean Crash</title>
    <style>
        :root {
            /* Define bright, vivid colors */
            --sky-blue: #87CEEB;
            --sand-yellow: #FFD700;
            --deep-ocean: #0077B6;
            --shallow-water: #48CAE4;
            --foam-white: #FFFFFF;
            --sea-foam-green: #90EE90;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            /* Wide scene quality: matching the theme */
            background: linear-gradient(to bottom, var(--sky-blue) 50%, var(--deep-ocean) 100%);
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- Beach/Sand Layer (Midground) --- */
        .beach-sand {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40vh;
            background-color: var(--sand-yellow);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* --- Ocean Layer (Background/Midground) --- */
        .ocean {
            position: absolute;
            bottom: 40vh;
            left: 0;
            width: 100%;
            height: 60%;
            background-color: var(--deep-ocean);
            z-index: 5;
        }

        /* --- Wave Animation Definitions --- */

        /* Wave 1: Slow, distant swells (Background Layer) */
        @keyframes slowRoll {
            0% { background-position: 0% 0; }
            100% { background-position: 100% 0; }
        }

        /* Wave 2: Medium rolling waves (Midground Layer) */
        @keyframes mediumRoll {
            0% { background-position: 0% 0; }
            100% { background-position: 100% 0; }
        }

        /* Wave 3: Fast, crashing foam (Foreground Layer) */
        @keyframes crash {
            0% {
                transform: translateY(0);
                background-color: var(--shallow-water);
            }
            50% {
                transform: translateY(-15vh);
                background-color: var(--foam-white);
            }
            100% {
                transform: translateY(0);
                background-color: var(--sea-foam-green);
            }
        }

        /* --- Applying Animations and Layers --- */

        /* Background Water Effect */
        .ocean-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, var(--deep-ocean) 60%, var(--shallow-water) 100%);
            z-index: 4;
        }

        /* Wave Group 1: Slow Background Swells (Layered Depth: Deep) */
        .wave-slow-1 {
            position: absolute;
            bottom: 100%; /* Start below the ocean */
            left: 0;
            width: 100%;
            height: 30vh;
            background-color: var(--deep-ocean);
            animation: slowRoll 60s linear infinite;
            animation-delay: 0s;
            z-index: 3;
        }

        /* Wave Group 2: Midground Rolling Waves (Layered Depth: Mid) */
        .wave-medium-2 {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 20vh;
            background-color: var(--sea-foam-green);
            animation: mediumRoll 30s linear infinite;
            animation-delay: 5s; /* Staggered timing */
            z-index: 2;
        }

        /* Wave Group 3: Foreground Crashing Foam (Layered Depth: Foreground) */
        .wave-crash-3 {
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            height: 10vh;
            background-color: var(--foam-white);
            animation: crash 2s ease-in-out infinite;
            animation-delay: 10s; /* Further staggered timing */
            z-index: 1;
        }

    </style>
</head>
<body>
    <div class="scene">
        <!-- 1. The Ocean Base -->
        <div class="ocean-base"></div>

        <!-- 2. The Sand Beach -->
        <div class="beach-sand"></div>

        <!-- 3. Animated Waves (Layered Depth) -->
        <div class="wave-slow-1"></div>
        <div class="wave-medium-2"></div>
        <div class="wave-crash-3"></div>
    </div>
</body>
</html>
