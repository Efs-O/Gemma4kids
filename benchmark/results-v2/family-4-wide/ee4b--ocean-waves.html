<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Ocean Waves Crash Animation</title>
    <style>
        :root {
            --sky-color: #64b5f6;
            --deep-sea-color: #0277bd;
            --foam-color: #ffffff;
            --sand-color: #ffecb3;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0277bd; /* Fallback color */
            height: 100vh;
            width: 100vw;
            font-family: sans-serif;
        }

        /* =====================================
           1. Sky Background & Sun Glow (Background Layer)
           ===================================== */
        .sky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 60vh; /* Upper portion */
            background: linear-gradient(to bottom, #81d4fa 0%, #4fc3f7 100%);
            z-index: 1;
        }

        @keyframes skyShift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        .sun-glow {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 30vw;
            height: 30vw;
            background: radial-gradient(circle, rgba(255,235,150,0.9) 0%, rgba(255,235,150,0) 60%);
            border-radius: 50%;
            animation: pulseGlow 6s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.9; }
            50% { transform: scale(1.1) translate(1vw, -1vh); opacity: 1; }
        }

        /* =====================================
           2. Ocean Waves (Midground Layer)
           ===================================== */
        .ocean {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40vh; /* Area for the main water body */
            z-index: 5;
        }

        .wave-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--deep-sea-color);
            z-index: 10;
        }

        /* Background/Distant Waves (Slower, softer movement) */
        .wave-bg {
            background: linear-gradient(to right, rgba(0, 123, 189, 0.6) 1px, transparent 1px);
            animation: waveMoveBg 15s linear infinite;
            transform: translateY(0px);
        }

        /* Midground Waves (More defined shape, varied timing) */
        .wave-mid {
            background: linear-gradient(to right, rgba(2, 119, 189, 0.8) 1px, transparent 1px);
            animation: waveMoveMid 8s linear infinite;
            transform: translateY(0px);
        }

        /* Foreground Crash/Foam (Fastest, highest impact) */
        .wave-foam {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8) 1px, transparent 1px);
            animation: waveCrash 3s linear infinite;
            transform: translateY(0px);
            z-index: 15; /* Over everything */
        }


        @keyframes waveMoveBg {
            0% { background-position: 0 0; transform: translateY(0px); }
            100% { background-position: -200vw 0; transform: translateY(10px); }
        }

        @keyframes waveMoveMid {
            0% { background-position: 0 0; transform: translateY(5px); }
            100% { background-position: -100vw 0; transform: translateY(5px); }
        }

        @keyframes waveCrash {
            0% { background-position: 0 0; transform: translateY(0); opacity: 1; }
            50% { background-position: -15vw 0; transform: translateY(-20px); opacity: 0.9; }
            100% { background-position: -100vw 0; transform: translateY(0); opacity: 0; }
        }

        /* =====================================
           3. Beach Sand (Foreground Layer)
           ===================================== */
        .sand-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20vh; /* Bottom portion */
            background-color: var(--sand-color);
            z-index: 20;
            /* Subtle ripple effect using a pseudo-element */
            box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.1);
            animation: sandRipple 15s linear infinite;
        }

        .sand-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 224, 179, 0.1) 0px,
                rgba(255, 224, 179, 0.1) 5px,
                transparent 5px,
                transparent 10px
            );
            background-size: 200% 100%;
            animation: sandMove 20s linear infinite;
        }

        @keyframes sandRipple {
             0%, 100% { transform: translateY(0); }
             50% { transform: translateY(-2px); }
        }

        @keyframes sandMove {
            0% { background-position: 0 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>

    <!-- Background Layer: Sky -->
    <div class="sky-container"></div>
    <!-- Foreground Light Source -->
    <div class="sun-glow"></div>

    <!-- Midground Layer: Ocean Waves -->
    <div class="ocean">
        <!-- Deep Background Waves (Slowest) -->
        <div class="wave-layer wave-bg" style="top: 0;"></div>
        <!-- Midground Waves (Medium Speed, Different Color/Style) -->
        <div class="wave-layer wave-mid" style="top: 0;"></div>
        <!-- Foreground Crash Foam (Fastest, Most Visible) -->
        <div class="wave-layer wave-foam" style="top: 0;"></div>
    </div>

    <!-- Foreground Layer: Sand Beach -->
    <div class="sand-container"></div>


    <script>
        // Optional: Adding subtle JavaScript interaction (e.g., slight parallax adjustment on mouse move if we wanted more complexity, 
        // but for pure CSS animation compliance, we rely solely on CSS timings).
    </script>
</body>
</html>
