<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluttering Butterflies in a Vibrant Garden</title>
    <style>
        :root {
            --sky-start: #8a2be2; /* BlueViolet */
            --sky-end: #ff69b4;   /* HotPink */
            --flower-color-1: #ff4500; /* OrangeRed */
            --flower-color-2: #32cd32; /* LimeGreen */
            --flower-color-3: #ffd700; /* Gold */
        }

        body {
            margin: 0;
            padding: 0;
            /* Vibrant background simulating a magical garden sky */
            background: linear-gradient(135deg, var(--sky-start) 0%, #ff1493 50%, var(--sky-end) 100%);
            overflow-x: hidden;
            overflow-y: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Flower Styling (Scattered Decoration) --- */
        .flower {
            position: absolute;
            bottom: -10vh; /* Anchor them slightly above the bottom */
            z-index: 1;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        /* Flower grouping */
        .flower-cluster {
            position: absolute;
            /* These are positioned manually to spread them out */
        }

        /* Individual flower styling */
        .flower-head {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s;
        }

        .flower-head::before {
            content: '';
            display: block;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, white 10%, var(--flower-color-1) 100%);
            filter: brightness(1.1);
        }

        .petal {
            position: absolute;
            background-color: currentColor;
            border-radius: 50%;
            opacity: 0.8;
            transform: scale(0.8);
        }

        /* Specific flower placements */
        #f1 { top: 10%; left: 5%; background-color: var(--flower-color-1); }
        #f2 { top: 30%; left: 90%; background-color: var(--flower-color-2); transform: scale(1.2); }
        #f3 { top: 60%; left: 20%; background-color: var(--flower-color-3); }
        #f4 { top: 80%; left: 75%; background-color: var(--flower-color-1); transform: scale(1.1); }
        #f5 { top: 45%; left: 40%; background-color: var(--flower-color-2); transform: scale(1.3); }

        /* Keyframes for Flower Animation */
        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); }
            to { transform: scale(1.05); box-shadow: 0 0 25px var(--flower-color-1); }
        }


        /* --- Butterfly Styling (The Winged Creature) --- */
        .butterfly {
            position: absolute;
            width: 120px;
            height: 80px;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
            /* Initial placement is handled by specific classes */
        }

        .wing {
            position: absolute;
            width: 50px;
            height: 35px;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.8) 0%, currentColor 100%);
            border-radius: 20% 50% 20% 50%;
            opacity: 0.95;
            transform-origin: center;
            animation: flap 0.1s linear infinite; /* Flapping animation */
        }

        .wing-left {
            width: 60px;
            height: 30px;
            top: 10px;
            left: 0;
            animation-timing-function: ease-in-out;
        }

        .wing-right {
            width: 60px;
            height: 30px;
            top: 10px;
            left: 60px;
            animation-timing-function: ease-in-out;
        }

        /* The Movement Animation (Combined translation and subtle floating) */
        @keyframes fly {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.6;
            }
            100% {
                transform: translate(calc(100vw + 50px), -100px) rotate(360deg);
                opacity: 0.1;
            }
        }
        
        /* Adjusted movement for looping effect across the screen */
        @keyframes floatAndFly {
            0% { transform: translate(0, 0); }
            50% { transform: translate(calc(100vw * 0.8 + 100px), -50px); }
            100% { transform: translate(calc(100vw + 50px), -100px); }
        }


        /* --- Keyframe Definitions --- */

        /* Wing Flap Animation */
        @keyframes flap {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }

        /* Body/Wing Flapping synchronization for different butterflies */
        .butterfly-1 .wing-left { animation-delay: -0.05s; }
        .butterfly-1 .wing-right { animation-delay: 0s; }

        .butterfly-2 .wing-left { animation-delay: -0.02s; }
        .butterfly-2 .wing-right { animation-delay: 0s; }

        .butterfly-3 .wing-left { animation-delay: -0.07s; }
        .butterfly-3 .wing-right { animation-delay: 0s; }
        
        .butterfly-4 .wing-left { animation-delay: -0.03s; }
        .butterfly-4 .wing-right { animation-delay: 0.03s; }


    </style>
</head>
<body>

    <!-- ================================== -->
    <!-- 🌸 SCENE ELEMENTS: FLOWERS 🌸 -->
    <!-- ================================== -->
    
    <div class="flower flower-cluster" id="f1">
        <div class="flower-head" style="background-color: var(--flower-color-1);">
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(-20deg) translate(-15px, -10px);"></span>
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(20deg) translate(15px, -10px);"></span>
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(0deg) translate(0px, 20px);"></span>
        </div>
    </div>

    <div class="flower flower-cluster" id="f2">
        <div class="flower-head" style="background-color: var(--flower-color-2);">
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(-15deg) translate(-10px, -15px);"></span>
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(15deg) translate(10px, -15px);"></span>
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(0deg) translate(0px, 25px);"></span>
        </div>
    </div>

    <div class="flower flower-cluster" id="f3">
        <div class="flower-head" style="background-color: var(--flower-color-3);">
            <span class="petal" style="background-color: var(--flower-color-3); transform: rotate(-25deg) translate(-20px, -15px);"></span>
            <span class="petal" style="background-color: var(--flower-color-3); transform: rotate(25deg) translate(20px, -15px);"></span>
            <span class="petal" style="background-color: var(--flower-color-3); transform: rotate(0deg) translate(0px, 25px);"></span>
        </div>
    </div>

    <div class="flower flower-cluster" id="f4">
        <div class="flower-head" style="background-color: var(--flower-color-1);">
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(-10deg) translate(-18px, -12px);"></span>
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(10deg) translate(18px, -12px);"></span>
            <span class="petal" style="background-color: var(--flower-color-1); transform: rotate(0deg) translate(0px, 22px);"></span>
        </div>
    </div>

    <div class="flower flower-cluster" id="f5">
        <div class="flower-head" style="background-color: var(--flower-color-2);">
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(-30deg) translate(-25px, -18px);"></span>
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(30deg) translate(25px, -18px);"></span>
            <span class="petal" style="background-color: var(--flower-color-2); transform: rotate(0deg) translate(0px, 28px);"></span>
        </div>
    </div>


    <!-- ================================== -->
    <!-- 🦋 BUTTERFLIES (Winging Creature) 🦋 -->
    <!-- ================================== -->

    <!-- Butterfly 1: Orange/Yellow, Starting Left -->
    <div class="butterfly butterfly-1" style="left: 0; top: 20%; animation: fly 25s linear infinite;">
        <div class="wing wing-left" style="color: #ffa500;"></div>
        <div class="wing wing-right" style="color: #ff8c00;"></div>
    </div>

    <!-- Butterfly 2: Blue/Purple, Mid-Screen Start -->
    <div class="butterfly butterfly-2" style="left: 30%; top: 50%; animation: fly 22s linear infinite;">
        <div class="wing wing-left" style="color: #6a5acd;"></div>
        <div class="wing wing-right" style="color: #483d8b;"></div>
    </div>

    <!-- Butterfly 3: Pink/Magenta, High and Right -->
    <div class="butterfly butterfly-3" style="left: 80%; top: 15%; animation: fly 28s linear infinite;">
        <div class="wing wing-left" style="color: #ff69b4;"></div>
        <div class="wing wing-right" style="color: #ff1493;"></div>
    </div>

    <!-- Butterfly 4: Cyan/Green, Low and Center -->
    <div class="butterfly butterfly-4" style="left: 50%; top: 70%; animation: fly 20s linear infinite;">
        <div class="wing wing-left" style="color: #00ced1;"></div>
        <div class="wing wing-right" style="color: #40e0d0;"></div>
    </div>


</body>
</html>
