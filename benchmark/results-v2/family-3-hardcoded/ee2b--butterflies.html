<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Butterflies and Flowers</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --grass-green: #32CD32;
            --flower-red: #FF4500;
            --flower-pink: #FF69B4;
            --butterfly-color-1: #FFD700; /* Gold */
            --butterfly-color-2: #FF69B4; /* Pink */
            --butterfly-color-3: #00FFFF; /* Cyan */
            --size-min: 80px;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-blue) 0%, var(--grass-green) 70%, #FFD700 100%);
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .flower {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--flower-red);
            box-shadow: 0 0 15px var(--flower-pink);
            animation: sway 6s ease-in-out infinite alternate;
        }

        /* Flower placement */
        .flower:nth-child(1) { top: 15%; left: 10%; transform: scale(1.2); background: var(--flower-pink); }
        .flower:nth-child(2) { top: 40%; left: 30%; transform: scale(0.9); background: var(--flower-red); }
        .flower:nth-child(3) { top: 65%; left: 50%; transform: scale(1.1); background: var(--flower-pink); }
        .flower:nth-child(4) { top: 20%; left: 75%; transform: scale(1.0); background: var(--flower-red); }
        .flower:nth-child(5) { top: 55%; left: 15%; transform: scale(1.3); background: var(--flower-pink); }

        @keyframes sway {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(10deg); }
        }

        .butterfly {
            position: absolute;
            width: 40px;
            height: 30px;
            border-radius: 50% 50% 0 0;
            animation: flyAcross 15s linear infinite;
            /* Initial rotation for wing effect */
            transform-origin: center;
        }

        /* Butterfly specific colors and shapes */
        .butterfly:nth-child(1) { background-color: var(--butterfly-color-1); border-radius: 10px; }
        .butterfly:nth-child(2) { background-color: var(--butterfly-color-2); border-radius: 15px; }
        .butterfly:nth-child(3) { background-color: var(--butterfly-color-3); border-radius: 20px; }
        .butterfly:nth-child(4) { background-color: #FF00FF; border-radius: 10px; }
        .butterfly:nth-child(5) { background-color: #00FF00; border-radius: 25px; }
        .butterfly:nth-child(6) { background-color: #FFA500; border-radius: 12px; }
        /* Repeat colors for variety */
        .butterfly:nth-child(7) { background-color: var(--butterfly-color-1); border-radius: 15px; }
        .butterfly:nth-child(8) { background-color: var(--butterfly-color-2); border-radius: 10px; }


        @keyframes flyAcross {
            0% {
                transform: translateX(-100vw) translateY(50vh) rotate(0deg);
            }
            100% {
                transform: translateX(100vw) translateY(-20vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Flowers -->
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>

        <!-- Butterflies (Staggered placement and animation) -->
        <div class="butterfly" style="left: 5%; top: 50%; animation-duration: 12s;"></div>
        <div class="butterfly" style="left: 20%; top: 70%; animation-duration: 15s;"></div>
        <div class="butterfly" style="left: 45%; top: 30%; animation-duration: 10s;"></div>
        <div class="butterfly" style="left: 65%; top: 55%; animation-duration: 18s;"></div>
        <div class="butterfly" style="left: 85%; top: 40%; animation-duration: 11s;"></div>
        <div class="butterfly" style="left: 15%; top: 80%; animation-duration: 14s;"></div>
        <div class="butterfly" style="left: 35%; top: 60%; animation-duration: 16s;"></div>
        <div class="butterfly" style="left: 55%; top: 10%; animation-duration: 13s;"></div>
        <div class="butterfly" style="left: 70%; top: 85%; animation-duration: 17s;"></div>
        <div class="butterfly" style="left: 90%; top: 50%; animation-duration: 12s;"></div>
    </div>
</body>
</html>
