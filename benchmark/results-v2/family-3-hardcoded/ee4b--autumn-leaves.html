<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Autumn Leaves</title>
    <style>
        :root {
            --fall-duration: 15s;
            --leaf-size: 25px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Essential to contain the falling elements */
            background: linear-gradient(180deg, #ff8c00 0%, #cc5500 50%, #8b0000 100%); /* Rich autumnal background */
            height: 100vh;
            width: 100vw;
            perspective: 1000px; /* For slight 3D feel */
        }

        .leaf {
            position: absolute;
            width: calc(var(--leaf-size) * 1.1);
            height: calc(var(--leaf-size) * 1.1);
            background-color: var(--leaf-color);
            opacity: 0.9;
            transform: translate(-50%, -50%) rotate(0deg);
            pointer-events: none; /* Ensure it doesn't interfere with clicking */
            animation-timing-function: ease-in;
            will-change: transform, opacity;
        }

        /* Keyframes for falling animation */
        @keyframes fall {
            0% {
                transform: translate(var(--start-x), 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Moves far down (viewport height + some extra) and slightly horizontally */
                transform: translate(var(--end-x), calc(100vh + 50px)) rotate(var(--rotation));
                opacity: 0;
            }
        }

        /* Keyframes for gentle floating wobble */
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg); }
        }

        /* Leaf-specific positioning and animation application */
        .leaf:nth-child(1) {
            --leaf-color: #ff6347; /* Tomato Red */
            --start-x: 10vw;
            --end-x: 15vw;
            --delay: 0s;
            animation: fall var(--fall-duration) linear forwards, wobble 8s infinite alternate;
            animation-delay: var(--delay);
        }
        .leaf:nth-child(2) {
            --leaf-color: #ffd700; /* Gold Yellow */
            --start-x: 30vw;
            --end-x: 40vw;
            --delay: 1s;
            animation: fall var(--fall-duration) linear forwards, wobble 8s infinite alternate;
            animation-delay: var(--delay);
        }
        .leaf:nth-child(3) {
            --leaf-color: #ff4500; /* Orange-Red */
            --start-x: 55vw;
            --end-x: 65vw;
            --delay: 2s;
            animation: fall var(--fall-duration) linear forwards, wobble 8s infinite alternate;
            animation-delay: var(--delay);
        }
        .leaf:nth-child(4) {
            --leaf-color: #daa520; /* Goldenrod Yellow */
            --start-x: 80vw;
            --end-x: 90vw;
            --delay: 0.5s;
            animation: fall var(--fall-duration) linear forwards, wobble 8s infinite alternate;
            animation-delay: var(--delay);
        }
        .leaf:nth-child(5) {
            --leaf-color: #800080; /* Purple/Deep Autumn */
            --start-x: 20vw;
            --end-x: 25vw;
            --delay: 2.5s;
            animation: fall var(--fall-duration) linear forwards, wobble 8s infinite alternate;
            animation-delay: var(--delay);
        }
        /* Adding 25 more leaves for required minimum count, staggered for continuous flow */

        /* Set up remaining leaves with staggered properties */
        .leaf:nth-child(6) { --leaf-color: #ff6347; --start-x: 10vw; --end-x: 12vw; --delay: 3s; }
        .leaf:nth-child(7) { --leaf-color: #ffd700; --start-x: 35vw; --end-x: 45vw; --delay: 1.5s; }
        .leaf:nth-child(8) { --leaf-color: #ff4500; --start-x: 60vw; --end-x: 68vw; --delay: 3.5s; }
        .leaf:nth-child(9) { --leaf-color: #daa520; --start-x: 75vw; --end-x: 85vw; --delay: 2s; }
        .leaf:nth-child(10) { --leaf-color: #8b0000; --start-x: 5vw; --end-x: 8vw; --delay: 4s; }

        .leaf:nth-child(11) { --leaf-color: #ff6347; --start-x: 25vw; --end-x: 28vw; --delay: 0.2s; }
        .leaf:nth-child(12) { --leaf-color: #ffd700; --start-x: 40vw; --end-x: 42vw; --delay: 1.8s; }
        .leaf:nth-child(13) { --leaf-color: #ff4500; --start-x: 70vw; --end-x: 72vw; --delay: 3.1s; }
        .leaf:nth-child(14) { --leaf-color: #daa520; --start-x: 20vw; --end-x: 22vw; --delay: 1.0s; }
        .leaf:nth-child(15) { --leaf-color: #800080; --start-x: 85vw; --end-x: 88vw; --delay: 4.5s; }

        .leaf:nth-child(16) { --leaf-color: #ff6347; --start-x: 15vw; --end-x: 18vw; --delay: 0.8s; }
        .leaf:nth-child(17) { --leaf-color: #ffd700; --start-x: 45vw; --end-x: 50vw; --delay: 2.3s; }
        .leaf:nth-child(18) { --leaf-color: #ff4500; --start-x: 30vw; --end-x: 32vw; --delay: 3.8s; }
        .leaf:nth-child(19) { --leaf-color: #daa520; --start-x: 80vw; --end-x: 82vw; --delay: 0.5s; }
        .leaf:nth-child(20) { --leaf-color: #8b0000; --start-x: 50vw; --end-x: 52vw; --delay: 2.7s; }

        /* Adding remaining 10 leaves with high stagger to ensure density */
        .leaf:nth-child(21) { --leaf-color: #ff6347; --start-x: 10vw; --end-x: 11vw; --delay: 5.5s; }
        .leaf:nth-child(22) { --leaf-color: #ffd700; --start-x: 30vw; --end-x: 31vw; --delay: 4.0s; }
        .leaf:nth-child(23) { --leaf-color: #ff4500; --start-x: 50vw; --end-x: 51vw; --delay: 3.0s; }
        .leaf:nth-child(24) { --leaf-color: #daa520; --start-x: 70vw; --end-x: 71vw; --delay: 2.5s; }
        .leaf:nth-child(25) { --leaf-color: #800080; --start-x: 20vw; --end-x: 21vw; --delay: 0.1s; }
        
        .leaf:nth-child(26) { --leaf-color: #ff6347; --start-x: 90vw; --end-x: 91vw; --delay: 6.0s; }
        .leaf:nth-child(27) { --leaf-color: #ffd700; --start-x: 5vw; --end-x: 6vw; --delay: 4.8s; }
        .leaf:nth-child(28) { --leaf-color: #ff4500; --start-x: 35vw; --end-x: 36vw; --delay: 3.5s; }
        .leaf:nth-child(29) { --leaf-color: #daa520; --start-x: 75vw; --end-x: 76vw; --delay: 1.2s; }
        .leaf:nth-child(30) { --leaf-color: #8b0000; --start-x: 45vw; --end-x: 46vw; --delay: 0.0s; }

    </style>
</head>

    </script>
