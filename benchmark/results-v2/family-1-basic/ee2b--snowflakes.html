<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Falling Snowflakes</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Hide scrollbars */
            background: linear-gradient(to bottom, #000033, #001144); /* Deep night sky background */
            font-family: sans-serif;
        }

        /* Container for the falling effect */
        .snowflake-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Keep snowflakes inside */
        }

        /* Style for individual snowflakes */
        .snowflake {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--color);
            border-radius: 50%; /* Make them soft dots/shapes */
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Define the gentle falling animation */
        @keyframes fall {
            0% {
                transform: translateY(-100vh) translateX(var(--x-offset));
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh) translateX(var(--x-offset));
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>
    <div class="snowflake-container">
        <!-- Snowflakes will be generated here by JavaScript -->
    </div>

    <script>
        const container = document.querySelector('.snowflake-container');
        const numSnowflakes = 150;

        // Define a palette of vivid colors
        const colors = [
            '#FFD700', /* Gold */
            '#FF69B4', /* Hot Pink */
            '#00FFFF', /* Cyan */
            '#ADFF2F', /* Green Yellow */
            '#FF1493', /* Deep Pink */
            '#00CED1', /* Dark Turquoise */
            '#FFFFFF'  /* Bright White */
        ];

        function createSnowflakes() {
            for (let i = 0; i < numSnowflakes; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');

                // Randomly select a color from the palette
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                flake.style.setProperty('--color', randomColor);

                // Random starting position (X-axis)
                const startX = Math.random() * 100;
                flake.style.left = `${startX}vw`;
                flake.style.top = `${Math.random() * -100}px`; // Start above the screen

                // Random animation timing for staggered effect
                const duration = 5 + Math.random() * 7; // Slower fall time for gentleness
                const delay = Math.random() * 5; // Stagger the start time

                // Apply animation properties
                flake.style.animationDuration = `${duration}s`;
                flake.style.animationDelay = `${delay}s`;
                flake.style.setProperty('--x-offset', `${startX - 50}px`); // Use X-offset for horizontal drift

                container.appendChild(flake);
            }
        }

        // Initialize the animation when the page loads
        createSnowflakes();
    </script>
</body>
</html>
