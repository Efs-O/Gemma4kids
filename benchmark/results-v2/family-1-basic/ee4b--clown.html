<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clown Juggling Spectacular</title>
    <style>
        /* Global Styling & Background */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Keep everything contained */
            background: linear-gradient(135deg, #ff6b81 0%, #ffda79 100%); /* Vivid gradient background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* For a slight 3D feel */
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        /* Juggler/Character Container (The main focus area) */
        #juggler-area {
            position: relative;
            width: 60%;
            max-width: 800px;
            height: 600px;
            background: rgba(255, 255, 255, 0.1); /* Subtle area marker */
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Abstract Clown Element (The base) */
        #clown {
            position: absolute;
            bottom: 50px;
            width: 100px;
            height: 150px;
            background: linear-gradient(to bottom, #ffd166, #ff8c00); /* Yellow/Orange body */
            border-radius: 50% / 30% 30% 60% 60%;
            z-index: 10;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.5);
            /* Simple "face" detail */
            border-top: 30px solid #ff0000;
        }

        /* Styling for the balls */
        .ball {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--color);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
            animation-name: juggleBounce;
            animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            animation-fill-mode: forwards;
        }

        /* Keyframe Animation for Bouncing/Juggling Trajectory */
        @keyframes juggleBounce {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            20% {
                transform: translate(calc(var(--x-offset)), -calc(var(--y-offset))) scale(1.1);
                opacity: 1;
            }
            40% {
                transform: translate(calc(var(--x-offset)*1.5), -calc(var(--y-offset)*1.5)) scale(0.9);
                opacity: 1;
            }
            60% {
                transform: translate(calc(var(--x-offset)*1.2), -calc(var(--y-offset)*1.8)) scale(1.1);
                opacity: 1;
            }
            80% {
                transform: translate(calc(var(--x-offset)*1.8), -calc(var(--y-offset)*2.2)) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translate(calc(var(--x-offset)*2.1), -calc(var(--y-offset)*2.5)) scale(0.5);
                opacity: 0;
            }
        }

        /* Defining specific ball animations (adjusting timing/offsets) */

        /* Ball 1 (Red) - Starting slightly left/high */
        .ball-1 {
            --color: #ff4136;
            --x-offset: -150px;
            --y-offset: 100px;
            animation: juggleBounce 1.8s ease-out 0s forwards;
            animation-delay: 0s;
        }

        /* Ball 2 (Green) - Starting center/medium */
        .ball-2 {
            --color: #2ecc40;
            --x-offset: 0px;
            --y-offset: 80px;
            animation: juggleBounce 2.0s ease-out 0.3s forwards;
            animation-delay: 0.3s;
        }

        /* Ball 3 (Blue) - Starting right/high */
        .ball-3 {
            --color: #3498db;
            --x-offset: 150px;
            --y-offset: 120px;
            animation: juggleBounce 1.9s ease-out 0.6s forwards;
            animation-delay: 0.6s;
        }

        /* Ball 4 (Yellow) - Filling the space */
        .ball-4 {
            --color: #f1c700;
            --x-offset: -50px;
            --y-offset: 150px;
            animation: juggleBounce 2.2s ease-out 0.9s forwards;
            animation-delay: 0.9s;
        }
        
        /* Ball 5 (Pink/Purple) - Extra flair */
        .ball-5 {
            --color: #e94e77;
            --x-offset: 100px;
            --y-offset: 110px;
            animation: juggleBounce 2.1s ease-out 1.2s forwards;
            animation-delay: 1.2s;
        }

        /* Responsive adjustment for visibility */
        @media (max-width: 768px) {
            #juggler-area {
                width: 90%;
                height: 70vh;
                border-radius: 30px;
            }
            #clown {
                width: 80px;
                height: 130px;
            }
            .ball {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <div id="juggler-area">
        <div id="clown"></div>
        <!-- The juggling balls -->
        <div class="ball ball-1"></div>
        <div class="ball ball-2"></div>
        <div class="ball ball-3"></div>
        <div class="ball ball-4"></div>
        <div class="ball ball-5"></div>
    </div>

</body>
</html>
