<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3a3a4d; /* Dark, stormy background */
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        /* --- Rain Styling --- */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.5), rgba(173, 216, 230, 0.1));
            animation: fall linear infinite;
            opacity: 0.7;
        }

        /* Keyframes for the falling rain animation */
        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) translateX(50px);
                opacity: 0.3;
            }
        }

        /* --- Rainbow Styling --- */
        .rainbow-container {
            position: absolute;
            top: 10%;
            width: 100%;
            height: 40vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 20;
            opacity: 0; /* Start hidden */
            animation: fadeIn 3s forwards 10s; /* Visible after rain has mostly faded */
            filter: blur(1px); /* Subtle glow effect */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Individual rainbow stripes */
        .stripe {
            position: absolute;
            height: 100%;
            width: 10%; /* Adjust width to cover the spectrum */
            border-radius: 50% / 10% 10% 0 0; /* Curving base */
            opacity: 0.9;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: pulse 4s infinite alternate ease-in-out;
        }

        /* Defining the colors */
        .r { background: linear-gradient(to top, #ff0000, #ff6600); left: 0%; }
        .o { background: linear-gradient(to top, #ff9900, #ffff00); left: 10%; }
        .y { background: linear-gradient(to top, #ffff00, #00ff00); left: 20%; }
        .g { background: linear-gradient(to top, #00ff00, #0099ff); left: 30%; }
        .b { background: linear-gradient(to top, #0099ff, #6600ff); left: 40%; }
        .i { background: linear-gradient(to top, #6600ff, #9933ff); left: 50%; }
        .v { background: linear-gradient(to top, #9933ff, #cc00ff); left: 60%; }
        
        /* Keyframes for rainbow glow pulse */
        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }

        /* Optional: Text message */
        #message {
            position: absolute;
            top: 20vh;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 3em;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.8);
            opacity: 0;
            animation: messageAppear 2s forwards 12s;
            z-index: 30;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Rain Container -->
    <div class="rain-container" id="rainContainer">
        <!-- Raindrops will be added by JavaScript -->
    </div>

    <!-- Rainbow Container -->
    <div class="rainbow-container" id="rainbowContainer">
        <div class="stripe r"></div>
        <div class="stripe o"></div>
        <div class="stripe y"></div>
        <div class="stripe g"></div>
        <div class="stripe b"></div>
        <div class="stripe i"></div>
        <div class="stripe v"></div>
    </div>
    
    <!-- Message -->
    <div id="message">🌈 Rainbow After The Storm 🌈</div>

    <script>
        const rainContainer = document.getElementById('rainContainer');
        const messageElement = document.getElementById('message');
        let raindropCount = 0;

        // 1. Rain Generation
        function createRaindrop() {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            
            // Random horizontal start position
            const leftPos = Math.random() * 100;
            drop.style.left = `${leftPos}vw`;
            
            // Random initial animation delay and duration for visual spread
            drop.style.animationDuration = `${(Math.random() * 1 + 0.5)}s`;
            drop.style.animationDelay = `${Math.random() * 0.5}s`;

            // Set specific initial Y position to start off-screen high enough
            drop.style.top = `${-20px}px`;
            
            rainContainer.appendChild(drop);
            raindropCount++;

            // Self-destruct mechanism: remove the element after it completes its fall animation cycle
            setTimeout(() => {
                drop.remove();
            }, 10000); // A generous timeout
        }

        // Keep rain falling constantly for the first 10 seconds
        function startRain() {
            setInterval(createRaindrop, 100); // Create a raindrop every 100 milliseconds
        }

        // 2. Transition Effect (Stopping Rain and Revealing Rainbow)
        function endRainAndShowRainbow() {
            // Stop creating new raindrops after 10 seconds
            clearInterval(rainInterval);
            
            // Fade out the rain container gradually to emphasize the transition
            const rainFade = setInterval(() => {
                const opacity = parseFloat(rainContainer.style.opacity) || 1;
                if (opacity > 0) {
                    rainContainer.style.opacity = `${opacity - 0.02} opacity`;
                } else {
                    clearInterval(rainFade);
                }
            }, 50);

            // The CSS animation for the rainbowFadeIn handles the visibility boost.
        }

        // Start the sequence
        startRain();
        
        // Wait 10 seconds (matching the 'forwards' delay on the rainbow CSS animation)
        setTimeout(() => {
            endRainAndShowRainbow();
        }, 10000); 

    </script>
</body>
</html>
