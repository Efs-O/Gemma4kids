<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Fun!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .ball {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #FF0000, #B30000);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: bounce 2s infinite ease-in-out;
        }

        /* Adding a little shine to the ball */
        .ball::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20%;
            background: #2ECC71;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0);
                animation-timing-function: ease-out;
            }
            50% {
                transform: translate(-50%, -50%) translateY(-300px);
                animation-timing-function: ease-in;
            }
        }

        /* Some extra decorations like clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
        }

        .cloud-1 { width: 120px; height: 40px; top: 10%; left: 10%; }
        .cloud-2 { width: 150px; height: 50px; top: 20%; right: 15%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        
        <div class="ball"></div>
        
        <div class="floor"></div>
    </div>

</body>
</html>
