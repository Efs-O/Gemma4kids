<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twinkling Night Sky</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a001a 0%, #2d004d 30%, #002d4d 60%, #004d40 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Star Container */
        .sky {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Star styling */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Shooting Star styling */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(to right, #ff00ff, #00ffff, transparent);
            border-radius: 50%;
            opacity: 0;
            z-index: 10;
            animation: shoot 3s infinite ease-in;
        }

        /* The tail of the shooting star */
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 80px;
            height: 2px;
            background: linear-gradient(to left, #ff00ff, #00ffff, transparent);
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            20% {
                transform: translateX(-500px) translateY(500px) rotate(-45deg);
                opacity: 0;
            }
            100% {
                transform: translateX(-500px) translateY(500px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* Adding some extra glow to the sky */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.15) 0%, rgba(0, 255, 255, 0.1) 30%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="sky" id="sky">
        <div class="glow"></div>
        <!-- Stars will be added here by JavaScript -->
        
        <!-- A few shooting stars at different positions -->
        <div class="shooting-star" style="top: 10%; left: 80%; animation-delay: 0s;"></div>
        <div class="shooting-star" style="top: 30%; left: 60%; animation-delay: 4s;"></div>
        <div class="shooting-star" style="top: 50%; left: 90%; animation-delay: 7s;"></div>
    </div>

    <script>
        const sky = document.getElementById('sky');
        const starCount = 100;

        // Function to create stars
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random position
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Random size
            const size = Math.random() * 3 + 1;
            
            // Random animation duration for twinkling
            const duration = (Math.random() * 3 + 2) + 's';
            const delay = Math.random() * 5 + 's';

            star.style.left = x + 'vw';
            star.style.top = y + 'vh';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.setProperty('--duration', duration);
            star.style.animationDelay = delay;

            sky.appendChild(star);
        }
    </script>
</body>
</html>
