<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            user-select: none;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0vh) translateX(0px) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(25vh) translateX(20px) rotate(90deg);
            }
            50% {
                transform: translateY(50vh) translateX(-20px) rotate(180deg);
                opacity: 0.8;
            }
            75% {
                transform: translateY(75vh) translateX(20px) rotate(270deg);
            }
            100% {
                transform: translateY(110vh) translateX(0px) rotate(360deg);
                opacity: 0;
            }
        }

        .title {
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="title">Winter Wonderland ❄️</div>

    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Use different snowflake symbols
            const symbols = ['❅', '❆', '•', '❄'];
            snowflake.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            // Random position at the top
            snowflake.style.left = Math.random() * 100 + 'vw';
            
            // Random size
            const size = Math.random() * 1.5 + 0.5;
            snowflake.style.fontSize = size + 'em';
            
            // Random duration for falling speed
            const duration = Math.random() * 3 + 4; 
            snowflake.style.animationDuration = duration + 's';
            
            // Random opacity
            snowflake.style.opacity = Math.random();

            document.body.appendChild(snowflake);

            // Remove snowflake after animation ends to keep things tidy
            setTimeout(() => {
                snowflake.remove();
            }, duration * 1000);
        }

        // Create a new snowflake every 200 milliseconds
        setInterval(createSnowflake, 200);
    </script>
</body>
</html>
