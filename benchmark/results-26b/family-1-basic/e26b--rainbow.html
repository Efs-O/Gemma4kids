<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After the Rain</title>
    <style>
        :root {
            --sky-storm: #2c3e50;
            --sky-clear: #87CEEB;
            --sun-color: #ffdb13;
            --transition-speed: 8s;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sky-storm);
        }

        /* The Sky Transition */
        .sky {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a2a3a, #2c3e50);
            animation: skyChange var(--transition-speed) forwards ease-in-out;
            z-index: 1;
        }

        @keyframes skyChange {
            0% { background: #1a2a3a; }
            40% { background: #2c3e50; }
            70% { background: #87CEEB; }
            100% { background: #87CEEB; }
        }

        /* The Sun */
        .sun {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: var(--sun-color);
            border-radius: 50%;
            box-shadow: 0 0 50px #ffdb13, 0 0 100px #ffae00;
            opacity: 0;
            transform: scale(0);
            z-index: 2;
            animation: sunAppear var(--transition-speed) forwards ease-in-out;
        }

        @keyframes sunAppear {
            0%, 40% { opacity: 0; transform: scale(0); }
            70%, 100% { opacity: 1; transform: scale(1); }
        }

        /* The Clouds */
        .cloud-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .cloud {
            position: absolute;
            background: #7f8c8d;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.8;
            animation: cloudMove var(--transition-speed) forwards ease-in-out;
        }

        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        @keyframes cloudMove {
            0% { transform: translateX(0) translateY(0); opacity: 0.8; }
            40% { transform: translateX(100px) translateY(20px); opacity: 0.8; }
            70% { transform: translateX(500px) translateY(-50px); opacity: 0.3; }
            100% { transform: translateX(1200px) translateY(-100px); opacity: 0; }
        }

        /* The Rainbow */
        .rainbow-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            z-index: 4;
            display: flex;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            animation: rainbowFade var(--transition-speed) forwards ease-in-out;
        }

        @keyframes rainbowFade {
            0%, 50% { opacity: 0; transform: translateX(-50%) translateY(50px); }
            80%, 100% { opacity: 0.7; transform: translateX(-50%) translateY(0); }
        }

        .rainbow-arc {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            border: 8px solid transparent;
        }

        .red    { width: 500px; height: 250px; border-top-color: #ff0000; }
        .orange { width: 470px; height: 235px; border-top-color: #ff7f00; }
        .yellow { width: 440px; height: 220px; border-top-color: #ffff00; }
        .green  { width: 410px; height: 205px; border-top-color: #00ff00; }
        .blue   { width: 380px; height: 190px; border-top-color: #0000ff; }
        .indigo { width: 350px; height: 175px; border-top-color: #4b0082; }
        .violet { width: 320px; height: 160px; border-top-color: #9400d3; }

        /* Rain Canvas */
        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: #27ae60;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="sky"></div>
    <div class="sun"></div>
    
    <div class="cloud-container">
        <!-- Clouds generated by JS -->
    </div>

    <div class="rainbow-container">
        <div class="rainbow-arc red"></div>
        <div class="rainbow-arc orange"></div>
        <div class="rainbow-arc yellow"></div>
        <div class="rainbow-arc green"></div>
        <div class="rainbow-arc blue"></div>
        <div class="rainbow-arc indigo"></div>
        <div class="rainbow-arc violet"></div>
    </div>

    <canvas id="rainCanvas"></canvas>
    <div class="ground"></div>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let rainIntensity = 1.0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class RainDrop {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.speed = Math.random() * 10 + 10;
                this.len = Math.random() * 20 + 10;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.init();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(174, 194, 224, ${this.opacity * rainIntensity})`;
                ctx.lineWidth = 2;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.len);
                ctx.stroke();
            }
        }

        // Initialize particles
        for (let i = 0; i < 300; i++) {
            particles.push(new RainDrop());
        }

        // Create Clouds
        const cloudContainer = document.querySelector('.cloud-container');
        for (let i = 0; i < 6; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            const size = Math.random() * 200 + 150;
            cloud.style.width = size + 'px';
            cloud.style.height = (size * 0.6) + 'px';
            cloud.style.top = Math.random() * 40 + '%';
            cloud.style.left = (Math.random() * 80) + '%';
            cloud.style.animationDelay = (Math.random() * 4) + 's';
            cloudContainer.appendChild(cloud);
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Gradually reduce rain intensity over 8 seconds
            if (rainIntensity > 0) {
                rainIntensity -= 0.0015; 
            } else {
                rainIntensity = 0;
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
