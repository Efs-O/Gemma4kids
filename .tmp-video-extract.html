  const out = document.getElementById('out');
  function fail(msg){ out.textContent = JSON.stringify({error: msg}); }
  try {
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => resolve();
      video.onerror = () => reject(new Error('metadata'));
    });
    const seek = (t) => new Promise((resolve, reject) => {
      video.onseeked = () => resolve();
      video.onerror = () => reject(new Error('seek'));
      video.currentTime = t;
    });
    const grab = () => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, video.videoWidth);
      canvas.height = Math.max(1, video.videoHeight);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL('image/jpeg', 0.86);
      return data.slice(data.indexOf(',') + 1);
    };
    const duration = video.duration;
    const times = [0, duration/2, Math.max(0, duration-0.2)];
    const frames = [];
    for (const t of times) {
      await seek(t);
      frames.push(grab());
    }
    out.textContent = JSON.stringify({ duration, width: video.videoWidth, height: video.videoHeight, frames }, null, 2);
  } catch (e) {
    fail(e.message || String(e));
  }
