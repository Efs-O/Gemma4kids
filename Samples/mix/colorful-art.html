<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Art</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ff69b4; /* Bright Pink Background */
            font-family: 'Comic Sans MS', cursive;
        }
        .art-container {
            width: 80vw;
            height: 70vh;
            background-color: #4169e1; /* Bright Blue main area */
            border: 10px solid #ff4500; /* Orange border */
            border-radius: 20px;
            position: relative;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
        .shape {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 15px;
        }
        .circle {
            background-color: #32cd32; /* Lime Green Circle */
            width: 40%;
            height: 40%;
            top: 10%;
            left: 5%;
            border-radius: 50%;
        }
        .square {
            background-color: #ffa500; /* Orange Square */
            width: 30%;
            height: 30%;
            bottom: 10%;
            right: 5%;
            border-radius: 10px;
        }
        .triangle {
            background-color: #ff1493; /* Deep Pink Triangle */
            width: 100px;
            height: 100px;
            top: 20%;
            left: 25%;
            transform: rotate(45deg);
            border-radius: 10px;
        }
        .text {
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="art-container">
        <div class="shape circle"></div>
        <div class="shape square"></div>
        <div class="shape triangle"></div>
        <div class="text">Art Time! 🎉</div>
    </div>
</body>
</html>
