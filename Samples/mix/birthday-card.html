<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ff69b4; /* Bright Pink Background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden; /* Keep everything contained */
        }

        .card-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            min-height: 70vh;
            background-color: #ffffff; /* Will override with a bright color or use pseudo-elements */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* --- Cake Section --- */
        .cake {
            position: relative;
            margin-bottom: 30px;
            text-align: center;
        }

        .cake-base {
            width: 300px;
            height: 100px;
            background: linear-gradient(to bottom, #ff8c00, #ff6347); /* Orange to Red-Orange */
            border-radius: 0 0 50px 50px;
            position: relative;
            z-index: 1;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .cake-frosting {
            width: 280px;
            height: 120px;
            background-color: #ffa07a; /* Light Salmon */
            border-radius: 50px 50px 0 0;
            position: absolute;
            top: -20px;
            left: 10px;
            z-index: 2;
            border: 3px solid #ff4500; /* Red-Orange border for definition */
        }

        .cake-candles {
            position: absolute;
            top: -10px;
            left: 10px;
            z-index: 3;
        }

        .candle {
            width: 10px;
            height: 30px;
            background-color: #ff1493; /* Deep Pink */
            border-radius: 5px;
            position: absolute;
        }

        .candle:nth-child(1) { left: 15px; transform: scale(1.2); }
        .candle:nth-child(2) { left: 50px; }
        .candle:nth-child(3) { left: 85px; transform: scale(1.1); }
        .candle:nth-child(4) { left: 120px; }
        .candle:nth-child(5) { left: 155px; transform: scale(0.9); }
        
        .flame {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 15px;
            background-color: #ffd700; /* Gold/Yellow */
            border-radius: 50% 50% 0 0;
            z-index: 4;
        }

        /* --- Balloons Section --- */
        .balloons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* So they don't interfere with clicking */
            z-index: 10;
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 5;
            bottom: 0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .balloon:nth-child(1) { 
            background-color: #ff4500; /* Orange Red */
            left: 10%; 
            bottom: 10%; 
        }
        .balloon:nth-child(2) { 
            background-color: #40e0d0; /* Turquoise */
            left: 25%; 
            bottom: 15%; 
            transform: scale(0.8);
        }
        .balloon:nth-child(3) { 
            background-color: #9370db; /* Medium Purple */
            left: 45%; 
            bottom: 5%; 
            transform: scale(1.2);
        }
        .balloon:nth-child(4) { 
            background-color: #ff69b4; /* Hot Pink */
            left: 70%; 
            bottom: 20%; 
        }
        .balloon:nth-child(5) { 
            background-color: #32cd32; /* Lime Green */
            left: 90%; 
            bottom: 12%; 
        }

        /* --- Greeting Text --- */
        .greeting {
            font-size: 3em;
            color: #ff1493;
            text-shadow: 3px 3px 0 #ff4500;
            margin-bottom: 10px;
            animation: bounceIn 1s ease-out;
        }

        .message {
            font-size: 1.5em;
            color: #ff4500;
            text-shadow: 2px 2px 0 #ffd700;
        }

        /* Simple animation for entrance flair */
        @keyframes bounceIn {
            0% { transform: scale(0.5) translateY(-50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

    </style>
</head>
<body style="background-color: #ff69b4;">

    <div class="balloons-container">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>

    <div class="card-container">
        <div class="greeting">Happy Birthday!</div>
        <div class="message">Wishing you the best day ever! ✨</div>

        <!-- Cake Area -->
        <div class="cake">
            <div class="cake-candles">
                <div class="candle"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
            <div class="cake-frosting"></div>
            <div class="cake-base"></div>
        </div>
    </div>

</body>
</html>
