<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Starfield</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, stars, shootingStars;

    // Configuration
    const STAR_COUNT = 400;
    const SHOOTING_STAR_CHANCE = 0.02; // Chance per frame

    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5;
            this.opacity = Math.random();
            this.twinkleSpeed = Math.random() * 0.05;
            // Vivid colors: White, Cyan, Light Blue, Pale Yellow
            const colors = ['#ffffff', '#a0e9ff', '#fff9c4', '#e0f7fa'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
            this.y += this.speed;
            if (this.y > height) {
                this.y = 0;
                this.x = Math.random() * width;
            }

            // Twinkle effect
            this.opacity += this.twinkleSpeed;
            if (this.opacity > 1 || this.opacity < 0.2) {
                this.twinkleSpeed *= -1;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.opacity;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    class ShootingStar {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = 0;
            this.length = Math.random() * 100 + 50;
            this.speed = Math.random() * 10 + 15;
            this.opacity = 1;
            this.angle = Math.PI / 4; // Diagonal downward
        }

        update() {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.opacity -= 0.02;

            if (this.opacity <= 0) {
                this.reset(); // Though we usually control when they spawn
            }
        }

        draw() {
            ctx.beginPath();
            const gradient = ctx.createLinearGradient(
                this.x, this.y, 
                this.x - Math.cos(this.angle) * this.length, 
                this.y - Math.sin(this.angle) * this.length
            );
            gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(
                this.x - Math.cos(this.angle) * this.length, 
                this.y - Math.sin(this.angle) * this.length
            );
            ctx.stroke();
        }
    }

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        shootingStars = [];
    }

    function animate() {
        // Draw background (clear frame)
        ctx.clearRect(0, 0, width, height);
        
        // Create a subtle nebula effect with radial gradients
        const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
        gradient.addColorStop(0, '#1b2735');
        gradient.addColorStop(1, '#090a0f');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Update and draw stars
        stars.forEach(star => {
            star.update();
            star.draw();
        });

        // Randomly spawn shooting stars
        if (Math.random() < SHOOTING_STAR_CHANCE) {
            shootingStars.push(new ShootingStar());
        }

        // Update and draw shooting stars
        for (let i = shootingStars.length - 1; i >= 0; i--) {
            shootingStars[i].update();
            shootingStars[i].draw();
            if (shootingStars[i].opacity <= 0) {
                shootingStars.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);

    init();
    animate();
</script>

</body>
</html>
