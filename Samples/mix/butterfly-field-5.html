<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly Field</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 60%, #4CAF50 60%, #2E7D32 100%);
            width: 100vw;
            height: 100vh;
        }

        .field {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: #4CAF50;
        }

        /* Improved Flower Design - Made Bigger */
        .flower-container {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
        }

        .flower-head {
            position: relative;
            width: 50px; /* Increased from 30px */
            height: 50px; /* Increased from 30px */
            z-index: 2;
        }

        /* Petals - Made Bigger */
        .petal {
            position: absolute;
            width: 25px; /* Increased from 15px */
            height: 40px; /* Increased from 25px */
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform-origin: center;
        }

        /* The center of the flower - Made Bigger */
        .flower-center {
            position: absolute;
            width: 20px; /* Increased from 12px */
            height: 20px; /* Increased from 12px */
            background: #FFD700;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.2);
        }

        .stem {
            width: 6px; /* Increased from 4px */
            height: 60px; /* Increased from 40px */
            background: #2E7D32;
            margin-top: -5px;
        }

        /* Butterfly - Made Bigger */
        .butterfly-container {
            position: absolute;
            width: 60px; /* Increased from 40px */
            height: 60px; /* Increased from 40px */
            z-index: 10;
            animation: fly 12s infinite linear;
        }

        .butterfly {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .wing {
            position: absolute;
            width: 30px; /* Increased from 20px */
            height: 45px; /* Increased from 30px */
            border-radius: 50% 50% 0 50%;
            top: 0;
            left: 30px; /* Adjusted for larger size */
            transform-origin: left center;
            animation: flap 0.2s infinite alternate;
            opacity: 0.9;
        }

        .wing.left {
            transform-origin: right center;
            border-radius: 50% 50% 50% 0;
            left: 0;
        }

        .wing.right {
            transform-origin: left center;
        }

        @keyframes flap {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(70deg); }
        }

        @keyframes fly {
            0% { transform: translate(-10vw, 10vh) rotate(0deg); }
            25% { transform: translate(30vw, -20vh) rotate(20deg); }
            50% { transform: translate(50vw, 10vh) rotate(-20deg); }
            75% { transform: translate(70vw, -20vh) rotate(10deg); }
            100% { transform: translate(110vw, 10vh) rotate(0deg); }
        }

    </style>
</head>
<body>
    <div class="field" id="flower-field"></div>
    <div id="butterfly-layer"></div>

    <script>
        const field = document.getElementById('flower-field');
        const butterflyLayer = document.getElementById('butterfly-layer');
        const colors = ['#FF69B4', '#FFD700', '#FF4500', '#9370DB', '#00CED1', '#FFFFFF'];
        const petalColors = ['#FF1493', '#FF69B4', '#FFD700', '#FF4500', '#FFFFFF', '#FFB6C1'];

        // Create Improved Flowers
        for (let i = 0; i < 30; i++) { // Reduced count slightly since they are larger
            const flowerContainer = document.createElement('div');
            flowerContainer.className = 'flower-container';
            flowerContainer.style.left = Math.random() * 100 + '%';
            flowerContainer.style.bottom = Math.random() * 40 + 'px';

            const flowerHead = document.createElement('div');
            flowerHead.className = 'flower-head';

            const petalColor = petalColors[Math.floor(Math.random() * petalColors.length)];
            
            const petalCount = 5 + Math.floor(Math.random() * 2);
            for (let p = 0; p < petalCount; p++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.backgroundColor = petalColor;
                const rotation = (p * (360 / petalCount));
                petal.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
                flowerHead.appendChild(petal);
            }

            const center = document.createElement('div');
            center.className = 'flower-center';
            flowerHead.appendChild(center);

            const stem = document.createElement('div');
            stem.className = 'stem';
            
            flowerContainer.appendChild(flowerHead);
            flowerContainer.appendChild(stem);
            field.appendChild(flowerContainer);
        }

        function createButterfly() {
            const container = document.createElement('div');
            container.className = 'butterfly-container';
            
            container.style.top = Math.random() * 60 + '%';
            container.style.left = '-60';
            container.style.animationDuration = (Math.random() * 8 + 10) + 's';
            container.style.animationDelay = (Math.random() * -15) + 's';

            const butterfly = document.createElement('div');
            butterfly.className = 'butterfly';

            const color = colors[Math.floor(Math.random() * colors.length)];

            const leftWing = document.createElement('div');
            leftWing.className = 'wing left';
            leftWing.style.backgroundColor = color;

            const rightWing = document.createElement('div');
            rightWing.className = 'wing right';
            rightWing.style.backgroundColor = color;

            butterfly.appendChild(leftWing);
            butterfly.appendChild(rightWing);
            container.appendChild(butterfly);
            butterflyLayer.appendChild(container);
        }

        for(let i = 0; i < 8; i++) {
            createButterfly();
        }
    </script>
</body>
</html>
