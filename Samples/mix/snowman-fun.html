<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowman Fun</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #87CEEB; /* Bright Sky Blue background */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .snowman-container {
        position: relative;
        width: 300px;
        height: 450px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Snowman Body (Bottom Sphere) */
    .body {
        width: 150px;
        height: 150px;
        background-color: #F0F8FF; /* Light Blue/White Snow */
        border-radius: 50%;
        position: relative;
        z-index: 10;
    }

    /* Snowman Head */
    .head {
        width: 100px;
        height: 100px;
        background-color: #F0F8FF; /* Light Blue/White Snow */
        border-radius: 50%;
        position: absolute;
        top: 20px;
        z-index: 11;
    }

    /* Snowman Hat (Triangle) */
    .hat {
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 50px solid #A52A2A; /* Brown Hat */
        position: absolute;
        top: 10px;
        z-index: 5;
    }

    /* Coal (Detail on the Head) */
    .coal {
        width: 30px;
        height: 30px;
        background-color: #36454F; /* Dark Coal */
        border-radius: 50%;
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
    }

    /* Arms (Simple Sticks) */
    .arm-left {
        width: 10px;
        height: 100px;
        background-color: #8B4513; /* Brown Stick */
        position: absolute;
        top: 60px;
        left: 30px;
        transform: rotate(-15deg);
    }

    .arm-right {
        width: 10px;
        height: 100px;
        background-color: #8B4513; /* Brown Stick */
        position: absolute;
        top: 60px;
        right: 30px;
        transform: rotate(15deg);
    }

    /* Scarf (Optional detail) */
    .scarf {
        width: 100px;
        height: 20px;
        background-color: #FF4500; /* Orange Scarf */
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 5px;
    }
</style>
</head>
<body>
    <div class="snowman-container">
        <div class="body"></div>
        <div class="head">
            <div class="coal"></div>
        </div>
        <div class="hat"></div>
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="scarf"></div>
    </div>
</body>
</html>
