<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Badge</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff69b4, #40e0d0); /* Vibrant gradient background */
            font-family: 'Arial', sans-serif;
        }

        .badge-container {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background-color: #ffeb3b; /* Bright yellow main color */
            border: 10px solid #e91e63; /* Pink border */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 30px #ff9800; /* Strong shadow and glow */
            position: relative;
        }

        .shield {
            width: 250px;
            height: 250px;
            background-color: #2196f3; /* Bright blue shield base */
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: 25px;
            border: 5px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .letter {
            font-size: 150px;
            font-weight: 900;
            color: #ff0000; /* Bold red letter */
            text-shadow: 
                4px 4px 0 #000000, 
                -4px -4px 0 #000000,
                4px 0 0 #000000,
                -4px 0 0 #000000;
            line-height: 1;
            position: relative;
            z-index: 10;
        }

        .sparkle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background-color: #ffd700; /* Gold sparkle */
            border-radius: 50%;
            animation: sparkle-blink 1s infinite alternate;
        }

        @keyframes sparkle-blink {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1.0; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="badge-container">
        <div class="shield"></div>
        <div class="letter">S</div>
        <div class="sparkle"></div>
    </div>
</body>
</html>
