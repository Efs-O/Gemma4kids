<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Smiley Face</title>
    <style>
        body {
            /* Bright, vivid background color */
            background-color: #FFD700; /* Gold Yellow background for general cheer */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .smiley-face {
            position: relative;
            width: 70vw; /* Increased size */
            height: 70vw; /* Increased size */
            max-width: 800px; /* Prevent it from getting too big on huge screens */
            max-height: 800px;
            background-color: #FFEB3B; /* Bright Sunny Yellow */
            border-radius: 50%;
            border: 15px solid #FFC107; /* Slightly darker yellow border for definition */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Eyes */
        .eye {
            position: absolute;
            width: 150px; /* Increased size */
            height: 150px; /* Increased size */
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .eye.left {
            top: 120px; /* Adjusted position */
            left: 15%; /* Adjusted position */
        }

        .eye.right {
            top: 120px; /* Adjusted position */
            right: 15%; /* Adjusted position */
        }

        /* Pupil/Highlight in the eyes */
        .eye::before {
            content: '';
            position: absolute;
            width: 50px; /* Increased size */
            height: 50px; /* Increased size */
            background-color: #000000;
            border-radius: 50%;
        }
        
        .eye.left::before {
            top: 20px;
            left: 20px;
        }
        
        .eye.right::before {
            top: 20px;
            right: 20px;
        }


        /* Mouth */
        .mouth {
            position: absolute;
            bottom: 80px;
            width: 350px; /* Increased size */
            height: 150px; /* Increased size */
            border: 30px solid #FF5722; /* Increased thickness */
            border-radius: 0 0 50% 50%;
            border-top: none;
            z-index: 2;
            box-sizing: border-box;
            /* Using a gradient fill for a fun, thick smile look */
            background: linear-gradient(to bottom, #FF5722 0%, #FF9800 100%); 
        }

    </style>
</head>
<body>
    <div class="smiley-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
</body>
</html>
