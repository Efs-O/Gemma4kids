<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #0077be 0%, #003366 100%);
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="overlay">Deep Sea Discovery</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let bubbles = [];
        let fish = [];
        const fishColors = ['#FF4500', '#FFD700', '#00FF7F', '#FF69B4', '#00BFFF'];

        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.radius = Math.random() * 6 + 2;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                if (this.y + this.radius < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
                // Light reflection on bubble
                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/4, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`;
                ctx.fill();
            }
        }

        class Fish {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * (canvas.height * 0.7) + 50;
                this.size = Math.random() * 30 + 20;
                this.speedX = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = fishColors[Math.floor(Math.random() * fishColors.length)];
                this.wiggle = 0;
                this.wiggleSpeed = Math.random() * 0.1 + 0.05;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY + Math.sin(this.wiggle) * 0.5;
                this.wiggle += this.wiggleSpeed;

                // Wrap around screen
                if (this.x > canvas.width + 100) {
                    this.x = -100;
                } else if (this.x < -100) {
                    this.x = canvas.width + 100;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Flip fish based on direction
                if (this.speedX < 0) {
                    ctx.scale(-1, 1);
                }

                // Tail
                ctx.beginPath();
                ctx.moveTo(-this.size, 0);
                ctx.lineTo(-this.size - 15, -15);
                ctx.lineTo(-this.size - 15, 15);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();

                // Body
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size/1.8, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Eye
                ctx.beginPath();
                ctx.arc(this.size * 0.6, -this.size * 0.2, this.size * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.size * 0.65, -this.size * 0.2, this.size * 0.07, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();

                // Fin
                ctx.beginPath();
                ctx.ellipse(0, -this.size * 0.3, this.size * 0.4, this.size * 0.1, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();

                ctx.restore();
            }
        }

        function init() {
            // Create Bubbles
            for (let i = 0; i < 60; i++) {
                bubbles.push(new Bubble());
            }
            // Create Fish
            for (let i = 0; i < 6; i++) {
                fish.push(new Fish());
            }
        }

        function animate() {
            // Draw ocean gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0077be');
            gradient.addColorStop(1, '#003366');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add some "light rays" effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width * (0.2 * i), 0);
                ctx.lineTo(canvas.width * (0.2 * i + 0.1), 0);
                ctx.lineTo(canvas.width * (0.2 * i - 0.1), canvas.height);
                ctx.fill();
            }

            bubbles.forEach(b => {
                b.update();
                b.draw();
            });

            fish.forEach(f => {
                f.update();
                f.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        init();
        animate();
    </script>
</body>
</html>
