<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Drawing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ff9933; /* Bright orange background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .man-container {
            width: 80vw;
            height: 80vh;
            background-color: #33cc66; /* Bright green shirt/background */
            border-radius: 20px;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Head/Face Area - Skin tone */
        .head {
            width: 70%;
            height: 70%;
            background-color: #ffdbb3; /* Light skin tone */
            border-radius: 50%;
            position: absolute;
            top: 10%;
            left: 15%;
            border: 4px solid #5a3d1a; /* Outline for definition */
            z-index: 2;
        }

        /* Beard Area - Grey/White */
        .beard {
            width: 75%;
            height: 25%;
            background-color: #aaaaaa; /* Grey beard */
            position: absolute;
            bottom: 10%;
            left: 12.5%;
            border-radius: 50% 50% 0 0;
            z-index: 1;
        }

        /* Glasses - Black frames */
        .glasses {
            position: absolute;
            top: 30%;
            left: 25%;
            width: 50%;
            height: 15%;
            background-color: #333333;
            border: 5px solid #000000;
            border-radius: 10px;
            z-index: 3;
        }
        .glasses::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 10%;
            width: 25%;
            height: 10px;
            background-color: #333333;
            border-radius: 5px;
        }

        /* Hair/Forehead Area (for separation) */
        .forehead {
            width: 30%;
            height: 20%;
            background-color: #ffdbb3;
            position: absolute;
            top: 15%;
            left: 35%;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }

        /* Body/Shirt Area (Representing the shirt from the video) */
        .shirt {
            width: 100%;
            height: 80%;
            background-color: #ff66cc; /* Bright pink/purple shirt */
            position: absolute;
            bottom: 0;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="man-container">
        <div class="head">
            <div class="forehead"></div>
        </div>
        <div class="beard"></div>
        <div class="glasses"></div>
        <div class="shirt"></div>
    </div>
</body>
</html>
