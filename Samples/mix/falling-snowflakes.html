<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentle Falling Snowflakes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); /* A sunset winter sky */
            background: radial-gradient(circle at top, #2c3e50, #000000);
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const snowflakes = [];
        const snowflakeCount = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Snowflake {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height; // Start above the screen
                this.radius = Math.random() * 3 + 1;
                this.speed = Math.random() * 1 + 0.5;
                this.wind = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = Math.random() * 0.02 - 0.01;
            }

            update() {
                this.y += this.speed;
                this.x += this.wind;
                this.rotation += this.rotationSpeed;

                // If it falls off the bottom, reset to top
                if (this.y > height + 10) {
                    this.init();
                    this.y = -10;
                }

                // If it drifts too far left or right, wrap it
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                
                // Draw a simple snowflake shape (star-like)
                for (let i = 0; i < 6; i++) {
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, this.radius * 2);
                    ctx.rotate(Math.PI / 3);
                }
                
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Add a center dot
                ctx.beginPath();
                ctx.arc(0, 0, this.radius / 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        function createSnowflakes() {
            for (let i = 0; i < snowflakeCount; i++) {
                snowflakes.push(new Snowflake());
            }
        }

        function animate() {
            // Clear canvas with a slight trail effect if desired, 
            // but for snow, a clean clear is better.
            ctx.clearRect(0, 0, width, height);

            snowflakes.forEach(flake => {
                flake.update();
                flake.draw();
            });

            requestAnimationFrame(animate);
        }

        createSnowflakes();
        animate();
    </script>
</body>
</html>
