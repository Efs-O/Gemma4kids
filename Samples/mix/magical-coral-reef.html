<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Underwater Coral Reef</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #4ecdc4, #45b7d1, #1a5e6e);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="reefCanvas"></canvas>

<script>
    const canvas = document.getElementById('reefCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, bubbles, fish, corals, lightBeams;

    const COLORS = {
        waterTop: '#4ecdc4',
        waterBottom: '#1a5e6e',
        fish: ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#F473B0'],
        coral: ['#FF85A1', '#FFB7B2', '#9B5DE5', '#00F5D4', '#FEE440'],
        bubbles: 'rgba(255, 255, 255, 0.4)'
    };

    class Bubble {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.size = Math.random() * 5 + 2;
            this.speed = Math.random() * 1 + 0.5;
            this.drift = Math.random() * 1 - 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
        }

        update() {
            this.y -= this.speed;
            this.x += this.drift;
            if (this.y < -20) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.bubbles;
            ctx.fill();
            // Shine on bubble
            ctx.beginPath();
            ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }
    }

    class Fish {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * (height * 0.7) + (height * 0.1);
            this.size = Math.random() * 15 + 10;
            this.color = COLORS.fish[Math.floor(Math.random() * COLORS.fish.length)];
            this.speed = Math.random() * 1.5 + 0.5;
            this.direction = Math.random() > 0.5 ? 1 : -1;
            this.oscillation = Math.random() * Math.PI * 2;
            this.oscillationSpeed = Math.random() * 0.05 + 0.02;
        }

        update() {
            this.x += this.speed * this.direction;
            this.oscillation += this.oscillationSpeed;
            this.y += Math.sin(this.oscillation) * 0.5;

            if (this.direction === 1 && this.x > width + 50) {
                this.x = -50;
            } else if (this.direction === -1 && this.x < -50) {
                this.x = width + 50;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.direction === -1) ctx.scale(-1, 1);

            // Tail
            ctx.beginPath();
            ctx.moveTo(-this.size, 0);
            ctx.lineTo(-this.size * 1.5, -this.size * 0.6);
            ctx.lineTo(-this.size * 1.5, this.size * 0.6);
            ctx.closePath();
            ctx.fillStyle = this.color;
            ctx.fill();

            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();

            // Eye
            ctx.beginPath();
            ctx.arc(this.size * 0.6, -this.size * 0.2, this.size * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.size * 0.7, -this.size * 0.2, this.size * 0.07, 0, Math.PI * 2);
            ctx.fillStyle = 'black';
            ctx.fill();

            // Fin
            ctx.beginPath();
            ctx.moveTo(0, -this.size * 0.4);
            ctx.quadraticCurveTo(0, 0, 0, this.size * 0.4);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();

            ctx.restore();
        }
    }

    class Coral {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.color = COLORS.coral[Math.floor(Math.random() * COLORS.coral.length)];
            this.height = Math.random() * 60 + 40;
            this.width = Math.random() * 30 + 20;
            this.sway = 0;
            this.swaySpeed = Math.random() * 0.02 + 0.01;
        }

        draw() {
            this.sway += this.swaySpeed;
            let swayOffset = Math.sin(this.sway) * 10;

            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Draw coral as organic blobs
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(swayOffset - this.width/2, -this.height/2, swayOffset, -this.height);
            ctx.quadraticCurveTo(swayOffset + this.width/2, -this.height/2, 0, 0);
            ctx.fillStyle = this.color;
            ctx.fill();
            
            // Texture/dots
            ctx.beginPath();
            ctx.arc(swayOffset, -this.height * 0.6, this.width * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fill();

            ctx.restore();
        }
    }

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        bubbles = Array.from({ length: 60 }, () => new Bubble());
        fish = Array.from({ length: 12 }, () => new Fish());
        
        corals = [];
        for (let i = 0; i < width; i += 40) {
            corals.push(new Coral(i + Math.random() * 20, height));
        }
    }

    function drawSunlight() {
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Light rays
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        for(let i = 0; i < 5; i++) {
            ctx.beginPath();
            let xOffset = (width / 5) * i + Math.sin(Date.now() * 0.001 + i) * 50;
            ctx.moveTo(xOffset, 0);
            ctx.lineTo(xOffset + 100, height);
            ctx.lineTo(xOffset - 200, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();
        }
        ctx.restore();
    }

    function animate() {
        // Background gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
        bgGrad.addColorStop(0, COLORS.waterTop);
        bgGrad.addColorStop(1, COLORS.waterBottom);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        drawSunlight();

        // Draw Corals (Bottom layer)
        corals.forEach(c => c.draw());

        // Draw Bubbles
        bubbles.forEach(b => {
            b.update();
            b.draw();
        });

        // Draw Fish
        fish.forEach(f => {
            f.update();
            f.draw();
        });

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

</body>
</html>
