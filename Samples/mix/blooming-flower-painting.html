<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming Flower Painting</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Flower Container */
        .flower {
            position: relative;
            width: 200px;
            height: 200px;
            animation: sway 4s ease-in-out infinite;
        }

        /* Petals */
        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 150px;
            background: linear-gradient(to top, #ff0080, #ff66b2);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            transform-origin: center bottom;
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
        }

        /* Center of the flower */
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 20px #fff700;
        }

        /* Stem */
        .stem {
            position: absolute;
            bottom: -200px;
            left: 50%;
            width: 20px;
            height: 300px;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            transform: translateX(-50%);
            border-radius: 10px;
            z-index: -1;
        }

        /* Floating Petals/Pollens in the background */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* Decorative elements */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff700, #ffaa00);
            border-radius: 50%;
            box-shadow: 0 0 50px #ffcc00;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="sun"></div>
        <div class="flower" id="flower">
            <div class="stem"></div>
            <div class="center"></div>
            <!-- Petals will be generated by JS -->
        </div>
    </div>

    <script>
        const flower = document.getElementById('flower');
        const particleCount = 40;

        // Create Petals
        const petalCount = 12;
        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            const rotation = (i * (360 / petalCount));
            petal.style.transform = `translate(-50%, -100%) rotate(${rotation}deg)`;
            // Add some variety to petal color
            const hue = 330 + (Math.random() * 30);
            petal.style.background = `linear-gradient(to top, hsl(${hue}, 100%, 40%), hsl(${hue}, 100%, 70%))`;
            flower.appendChild(petal);
        }

        // Create floating particles (pollen/petals)
        const container = document.getElementById('canvas-container');
        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            
            const size = Math.random() * 10 + 5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            
            // Random color for particles
            const colors = ['#ffb6c1', '#ffffff', '#ffd700', '#ff69b4'];
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Animation
            p.style.animation = `float ${Math.random() * 5 + 5}s linear infinite`;
            p.style.animationDelay = Math.random() * 5 + 's';
            
            container.appendChild(p);
        }
    </script>
</body>
</html>
