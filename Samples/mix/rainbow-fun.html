<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow Fun</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #FFD700; /* Bright Gold background */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .art-canvas {
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 30%, #4D96FF 60%, #FFD166 100%); /* Rainbow gradient */
        position: relative;
    }

    /* Big Circle Element */
    .big-circle {
        width: 60vw;
        height: 60vh;
        background-color: #FFFFFF;
        border-radius: 50%;
        position: absolute;
        top: 10%;
        left: 10%;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    /* Colorful Shapes inside */
    .shape-1 {
        width: 30%;
        height: 30%;
        background-color: #FF007F; /* Pink */
        position: absolute;
        top: 20%;
        left: 20%;
        border-radius: 50%;
        transform: rotate(30deg);
    }

    .shape-2 {
        width: 25%;
        height: 25%;
        background-color: #00FFFF; /* Cyan */
        position: absolute;
        bottom: 15%;
        right: 15%;
        border-radius: 50%;
    }

    .shape-3 {
        width: 15%;
        height: 15%;
        background-color: #00FF00; /* Lime Green */
        position: absolute;
        top: 40%;
        right: 10%;
        border-radius: 20px;
    }

    .shape-4 {
        width: 20%;
        height: 20%;
        background-color: #FFD166; /* Yellow */
        position: absolute;
        bottom: 10%;
        left: 10%;
        border-radius: 10px;
    }

    /* Adding some abstract lines/details */
    .detail-line {
        position: absolute;
        width: 100%;
        height: 10px;
        background-color: rgba(255, 255, 255, 0.7);
        top: 50%;
    }

    .detail-line.h1 {
        transform: translateY(-50%);
        left: 5%;
        height: 15px;
    }
</style>
</head>
<body>
    <div class="art-canvas">
        <div class="big-circle"></div>
        <div class="shape-1"></div>
        <div class="shape-2"></div>
        <div class="shape-3"></div>
        <div class="shape-4"></div>
        <div class="detail-line h1"></div>
    </div>
</body>
</html>
