<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smiling Emoji Face</title>
    <style>
        /* Set the body background to a vivid color and ensure full coverage */
        body {
            margin: 0;
            padding: 0;
            background-color: #ff99cc; /* Bright pink/magenta background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .emoji-container {
            position: relative;
            width: 80vw;
            height: 80vh;
            max-width: 600px;
            max-height: 600px;
            /* The face itself */
        }

        .emoji-face {
            background-color: #ffeb3b; /* Vivid yellow */
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Eyes */
        .eye {
            position: absolute;
            background-color: #333;
            border-radius: 50%;
            width: 15%;
            height: 15%;
            top: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye.left {
            left: 20%;
        }

        .eye.right {
            right: 20%;
        }

        /* Pupils (optional but adds detail) */
        .pupil {
            width: 40%;
            height: 40%;
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Mouth */
        .mouth {
            position: absolute;
            bottom: 25%;
            left: 15%;
            width: 70%;
            height: 30%;
            border: 3px solid #d32f2f; /* Bright red border */
            border-radius: 0 0 50% 50%; /* Curved bottom shape */
            background-color: transparent;
            transform: translateY(5px); /* Minor adjustment */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="emoji-container">
        <div class="emoji-face">
            <!-- Eyes -->
            <div class="eye left">
                <div class="pupil"></div>
            </div>
            <div class="eye right">
                <div class="pupil"></div>
            </div>

            <!-- Mouth -->
            <div class="mouth"></div>
        </div>
    </div>
</body>
</html>
