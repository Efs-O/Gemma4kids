<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree and Dog</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #87CEEB; /* Bright Sky Blue background */
        display: flex;
        justify-content: center;
        align-items: flex-end; /* Position everything towards the bottom */
        height: 100vh;
        overflow: hidden;
    }

    /* Ground Area */
    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 15%;
        background: linear-gradient(to bottom, #3CB371, #228B22); /* Bright Green gradient */
        z-index: 1;
    }

    /* --- The Tree --- */
    .tree {
        position: absolute;
        bottom: 15%; /* Sits on the ground */
        left: 10%;
        z-index: 10;
    }

    /* Tree Trunk (Brown) */
    .trunk {
        width: 50px;
        height: 200px;
        background-color: #8B4513; /* Earthy Brown */
        position: relative;
        z-index: 1;
    }

    /* Tree Foliage/Canopy (Bright, overlapping circles/shapes) */
    .canopy {
        position: absolute;
        top: -100px;
        left: -20px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #32CD32 0%, #2E8B5C 70%, #008000 100%); /* Bright Green gradient */
        z-index: 2;
        box-shadow: 0 0 30px rgba(50, 205, 50, 0.8);
    }
    
    /* Extra pop of colour in the canopy */
    .canopy::after {
        content: '';
        position: absolute;
        top: 20px;
        left: 40%;
        width: 80px;
        height: 100px;
        background-color: #ADFF2F; /* Bright Yellow-Green */
        border-radius: 50%;
        opacity: 0.7;
        z-index: 3;
    }


    /* --- The Dog --- */
    .dog-container {
        position: absolute;
        bottom: 10%; /* Sits on the ground */
        left: 35%;
        z-index: 10;
    }

    /* Dog Body (Large Orange Shape) */
    .dog-body {
        width: 120px;
        height: 80px;
        background-color: #FF8C00; /* Bright Orange */
        border-radius: 50% 50% 40% 40%;
        position: relative;
    }

    /* Dog Head (Yellow Shape) */
    .dog-head {
        width: 80px;
        height: 70px;
        background-color: #FFD700; /* Bright Gold/Yellow */
        border-radius: 50% 50% 40% 40%;
        position: absolute;
        top: 10px;
        right: 20px;
        z-index: 2;
    }

    /* Dog Ears (Brown Triangles) */
    .ear {
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-top-color: #A0522D; /* Sienna Brown */
        position: absolute;
        top: -10px;
        z-index: 3;
    }
    .ear.left {
        left: 10px;
        border-radius: 10px 10px 0 0;
        transform: rotate(-20deg);
    }
    .ear.right {
        right: 10px;
        border-radius: 10px 10px 0 0;
        transform: rotate(20deg);
    }
</style>
</head>
<body>
    <div class="ground"></div>

    <div class="tree">
        <div class="trunk"></div>
        <div class="canopy"></div>
    </div>

    <div class="dog-container">
        <div class="dog-body"></div>
        <div class="dog-head">
            <div class="ear left"></div>
            <div class="ear right"></div>
        </div>
    </div>
</body>
</html>
