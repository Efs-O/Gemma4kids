<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Landscape</title>
    <style>
        /* Global Styling: Ensure full coverage and bright background */
        body {
            background-color: #87CEEB; /* Light Sky Blue background */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* The Rainbow Arc Container */
        .rainbow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 350px;
            z-index: 10;
        }
        
        /* Individual Rainbow Bands (Using gradients/divs for color) */
        .band {
            position: absolute;
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        /* Assigning specific colors and positions for the rainbow effect */
        .band.red {
            background-color: #FF0000;
            bottom: 250px;
            transform: scale(1);
        }
        .band.orange {
            background-color: #FFA500;
            bottom: 150px;
            transform: scale(1);
        }
        .band.yellow {
            background-color: #FFFF00;
            bottom: 50px;
            transform: scale(1);
        }
        .band.green {
            background-color: #32CD32;
            bottom: 0;
            transform: scale(1);
        }

        /* Cute Clouds (Floating on the rainbow/sky) */
        .cloud {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 15;
        }
        
        /* Cloud 1 (Big) */
        .cloud-1 {
            width: 180px;
            height: 100px;
            bottom: 100px;
            left: 15%;
        }
        /* Cloud 1 segment 1 */
        .cloud-1::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 70px;
            top: 20px;
            left: 10px;
            border-radius: 50%;
        }
        /* Cloud 1 segment 2 */
        .cloud-1::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 80px;
            top: 10px;
            right: 20px;
            border-radius: 50%;
        }

        /* Cloud 2 (Small) */
        .cloud-2 {
            width: 80px;
            height: 50px;
            bottom: 180px;
            right: 30%;
        }
        /* Cloud 2 segment 1 */
        .cloud-2::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 40px;
            top: 5px;
            left: 5px;
            border-radius: 50%;
        }
        /* Cloud 2 segment 2 */
        .cloud-2::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 60px;
            top: 0px;
            right: 0px;
            border-radius: 50%;
        }
        
    </style>
</head>
<body>
    <div class="rainbow">
        <div class="band red"></div>
        <div class="band orange"></div>
        <div class="band yellow"></div>
        <div class="band green"></div>
    </div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
</body>
</html>
