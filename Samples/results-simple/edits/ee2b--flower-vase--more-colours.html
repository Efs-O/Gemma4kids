<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Flower Vase</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ff6b6b; /* Bright Red/Coral background */
            margin: 0;
            font-family: sans-serif;
        }

        .scene-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Increased gap */
        }

        /* The Vase - Brighter Gradient */
        .vase {
            width: 160px;
            height: 280px;
            background: linear-gradient(to bottom, #ffc107, #ff5722); /* Bright Gold/Orange vase colors */
            border: 10px solid #333;
            border-radius: 15px 15px 60px 60px;
            position: relative;
            z-index: 10;
        }

        /* The Stem/Neck - Brighter Green */
        .stem {
            width: 25px;
            height: 60px;
            background-color: #4CAF50; /* Vibrant Green stem */
            position: absolute;
            top: 220px;
            z-index: 5;
        }

        /* Petals Container */
        .petals {
            position: absolute;
            top: 150px;
            width: 220px;
            height: 220px;
            z-index: 20;
        }

        /* Individual Petals (Base Color: Bright & Vivid) */
        .petal {
            position: absolute;
            width: 70px;
            height: 90px;
            background-color: hsl(130, 60%, 220); /* Bright Sky Blue base */
            border-radius: 50% 50% 50% 50%;
            transform-origin: center bottom;
        }

        /* Creating the Flower arrangement - More Saturated Colors */
        .petal:nth-child(1) {
            background-color: #ff3d00; /* Bright Orange Red */
            left: 50px;
            top: 30px;
            transform: rotate(0deg);
        }

        .petal:nth-child(2) {
            background-color: #00bcd4; /* Bright Cyan */
            right: 50px;
            top: 50px;
            transform: rotate(120deg);
        }

        .petal:nth-child(3) {
            background-color: #fbc02d; /* Bright Yellow */
            left: 100px;
            top: 100px;
            transform: rotate(240deg);
        }

        .petal:nth-child(4) {
            background-color: #ffffff; /* Bright White center accent */
            right: 100px;
            top: 100px;
            transform: rotate(360deg);
        }

        .petal:nth-child(5) {
            background-color: #9c27b0; /* Vivid Purple */
            left: 30px;
            top: 80px;
            transform: rotate(150deg);
        }

        .petal:nth-child(6) {
            background-color: #ff8a65; /* Bright Salmon */
            right: 30px;
            top: 80px;
            transform: rotate(210deg);
        }

        /* Vase placement adjustment to make the flower emerge */
        .vase {
            margin-top: 30px;
        }

    </style>
</head>
<body>
    <div class="scene-container">
        <div class="vase">
            <div class="stem"></div>
        </div>
        <div class="petals">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
        </div>
    </div>
</body>
</html>
