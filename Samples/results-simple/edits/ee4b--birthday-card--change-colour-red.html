<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Celebration Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #D00000; /* Vivid, deep primary red background */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .card-container {
            background-color: #FFF3B0; /* Light yellow/creamish card base, kept light for contrast */
            border: 15px solid #FFD93D; /* Bright gold border */
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 90%;
            max-width: 1000px;
            position: relative;
            background-color: #FFEBCD; /* Slightly warmer base for the card itself */
        }

        /* --- Title Banner --- */
        .banner {
            background-color: #E74C3C; /* Vibrant Red banner matching the theme */
            color: #FFD93D; /* Bright Gold/Yellow text for contrast */
            padding: 10px 0;
            margin-bottom: 20px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .banner h1 {
            margin: 0;
            font-family: sans-serif;
            font-size: 3em;
            text-shadow: 3px 3px #C0392B; /* Deeper red shadow */
        }

        /* --- Cake Styling --- */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .cake {
            background-color: #F5E6C5; /* Cake sponge color */
            border-radius: 10px;
            padding-top: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .layer {
            width: 80%;
            height: 70px;
            margin-bottom: -10px;
            background-color: #D32F2F; /* Red frosting base - kept strong red */
            border-radius: 5px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .layer:nth-child(1) { background-color: #C0392B; height: 80px; } /* Top Layer - slightly darker red */
        .layer:nth-child(2) { background-color: #E74C3C; height: 70px; } /* Middle Layer - primary red */
        .layer:nth-child(3) { background-color: #C0392B; height: 60px; } /* Bottom Layer */

        /* Frosting drip/border effect */
        .layer::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -5px;
            right: -5px;
            height: 20px;
            background: linear-gradient(to right, transparent 50%, rgba(255, 255, 255, 0.3) 100%);
            border-radius: 5px;
        }

        .candles {
            display: flex;
            gap: 20px;
            margin-top: -15px;
            padding: 0 10px;
        }

        .candle-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle-stick {
            width: 8px;
            height: 30px;
            background-color: #FFD700; /* Gold/Yellow stick */
            border-radius: 4px;
            position: relative;
            z-index: 5;
        }

        .flame {
            width: 12px;
            height: 12px;
            background-color: #FFEB3B; /* Bright Yellow flame */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -20px;
            left: -2px;
            animation: flicker 0.5s infinite alternate;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.8);
        }

        /* --- Balloons Styling --- */
        .balloon-cluster {
            display: flex;
            gap: 20px;
            position: absolute;
            top: 50px;
            right: 30px;
            z-index: 1;
        }

        .balloon {
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .balloon-1 { background-color: #E74C3C; } /* Primary Red */
        .balloon-2 { background-color: #2ECC71; } /* Vivid Green */
        .balloon-3 { background-color: #F1C40F; } /* Bright Yellow */
        .balloon-4 { background-color: #C0392B; } /* Deep Red */
        .balloon-5 { background-color: #3498DB; } /* Bright Blue */

        .string {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 30px;
            background-color: #333;
            border-radius: 5px;
        }

        /* --- Text Message --- */
        .message {
            margin-top: 30px;
            padding: 15px;
            background-color: #F9E79F; /* Lighter contrast yellow */
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        }

        .message p {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.8em;
            color: #C0392B; /* Darker red text */
            margin: 0;
        }

        /* Keyframe Animations (Visual Flare) */
        @keyframes flicker {
            0% { transform: translate(-2px, 0); opacity: 0.9; }
            100% { transform: translate(-1px, -1px); opacity: 1; }
        }

    </style>
</head>
<body>
    <div class="card-container">
        <div class="banner">
            <h1>HAPPY BIRTHDAY!</h1>
        </div >

        <!-- Balloon Cluster -->
        <div class="balloon-cluster">
            <div class="balloon balloon-1">
                <div class="string"></div >
            </div>
            <div class="balloon balloon-2" style="transform: scale(0.9);">
                <div class="string"></div >
            </div>
            <div class="balloon balloon-3" style="transform: scale(1.1);">
                <div class="string"></div >
            </div>
            <div class="balloon balloon-4" style="transform: scale(0.8);">
                <div class="string"></div >
            </div>
            <div class="balloon balloon-5">
                <div class="string"></div >
            </div>
        </div>


        <!-- Cake Section -->
        <div class="cake-section">
            <div class="cake">
                <div class="layer"></div >
                <div class="layer"></div >
                <div class="layer"></div >
            </div >
            <div class="candles">
                <div class="candle-holder">
                    <div class="candle-stick"></div >
                    <div class="flame"></div >
                </div >
                <div class="candle-holder">
                    <div class="candle-stick"></div >
                    <div class="flame"></div >
                </div >
                <div class="candle-holder">
                    <div class="candle-stick"></div >
                    <div class="flame"></div >
                </div >
                <div class="candle-holder">
                    <div class="candle-stick"></div >
                    <div class="flame"></div >
                </div >
            </div >
        </div>

        <!-- Message Area -->
        <div class="message">
            <p>Wishing you the happiest day!</p>
        </div >

    </div>
</body>
</html>
