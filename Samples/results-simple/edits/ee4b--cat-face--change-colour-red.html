<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #FF3333; /* Vivid Red Background */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .cat-face {
            background-color: #F0E68C; /* Light Yellow/Cream Cat Fur */
            border-radius: 50% / 60% 60% 30% 30%;
            width: 80vmin;
            height: 85vmin;
            position: relative;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding-top: 20px;
        }

        /* Ears */
        .ear {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 60px 20px;
            border-color: transparent transparent #D2691E transparent; /* Brownish color for ears */
            position: absolute;
            top: -30px;
            transform: translateY(-50%);
            z-index: 10;
        }

        .left-ear {
            left: 15%;
            border-right-color: transparent;
            border-bottom-color: transparent;
        }

        .right-ear {
            right: 15%;
            border-left-color: transparent;
            border-bottom-color: transparent;
        }

        /* Nose and Mouth Area */
        .nose {
            background-color: #CD5C5C; /* Reddish Nose */
            width: 40px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .mouth {
            width: 30px;
            height: 10px;
            border-radius: 0 0 15px 15px;
            background-color: #D2691E;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        }

        /* Eyes */
        .eye {
            width: 120px;
            height: 60px;
            background-color: #ADD8E6; /* Light Blue Iris */
            border-radius: 50%;
            position: absolute;
            top: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .left-eye {
            left: 20%;
        }

        .right-eye {
            right: 20%;
        }

        .pupil {
            width: 30px;
            height: 30px;
            background-color: #191970; /* Dark Blue Pupil */
            border-radius: 50%;
            position: absolute;
            z-index: 11;
        }

        .left-pupil {
            left: 35px;
            top: 15px;
        }

        .right-pupil {
            right: 35px;
            top: 15px;
        }

        /* Whiskers Container */
        .whiskers-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .whisker-group {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Individual Whisker Style */
        .whisker {
            width: 100px;
            height: 1px;
            background-color: #333;
            position: relative;
        }

        /* Creating whisker segments using multiple positioned lines/pseudo-elements for better structure */
        .whisker-end {
            position: absolute;
            width: 15px;
            height: 1px;
            background-color: #333;
            transform: translateX(100%);
            right: -15px;
        }
        
        /* Overriding structure for symmetry and simplicity using direct divs */
        .whisker-l1 { width: 70px; }
        .whisker-l2 { width: 100px; }
        .whisker-r1 { width: 70px; }
        .whisker-r2 { width: 100px; }


    </style>
</head>
<body>

    <div class="cat-face">
        <!-- Ears -->
        <div class="ear left-ear"></div>
        <div class="ear right-ear"></div>

        <!-- Eyes -->
        <div class="eye left-eye">
            <div class="pupil left-pupil"></div>
        </div>
        <div class="eye right-eye">
            <div class="pupil right-pupil"></div>
        </div>

        <!-- Whiskers (Structured for 4 whiskers on each side) -->
        <div class="whiskers-container">
            <!-- Left Side Whiskers -->
            <div class="whisker-group">
                <div class="whisker whisker-l1"></div>
                <div class="whisker whisker-l2"></div>
            </div>
            <!-- Right Side Whiskers -->
            <div class="whisker-group" style="flex-direction: row-reverse;">
                <div class="whisker whisker-r1"></div>
                <div class="whisker whisker-r2"></div>
            </div>
        </div>

        <!-- Nose and Mouth -->
        <div class="nose">
            <div style="width: 10px; height: 5px; background-color: #CD5C5C; border-radius: 50%; position: relative; top: 5px;"></div>
        </div>
        <div class="mouth"></div>

    </div>

</body>
</html>
