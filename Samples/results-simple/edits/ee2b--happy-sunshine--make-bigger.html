<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Happy Sunshine</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFD700; /* Bright Yellow Background for more impact */
            font-family: 'Comic Sans MS', cursive;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* The Sun - Happy and Big */
        .sun {
            width: 600px; /* Increased size */
            height: 600px; /* Increased size */
            background-color: #FFD700; /* Bright Yellow */
            border-radius: 50%;
            position: relative;
            border: 15px solid #FFA500; /* Orange glow - bigger border */
            box-shadow: 0 0 40px #FFEB3B; /* Brighter glow effect */
        }

        /* Sun's Happy Face (Symmetry) - Center face expanded */
        .sun::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; /* Increased size */
            height: 300px; /* Increased size */
            background-color: #FFEB3B; /* Lighter center for happiness */
            border-radius: 50%;
            border: 8px solid #FFC107;
        }

        /* Sun's Happy Eyes (Symmetric) - Adjusted placement and size */
        .sun::after {
            content: '';
            position: absolute;
            top: 40%;
            left: 30%;
            width: 60px; /* Increased size */
            height: 60px; /* Increased size */
            background-color: #333;
            border-radius: 50%;
            border: 5px solid #FF4500; /* Orange outline for eyes */
        }

        .sun .eye-left {
            left: 35%; /* Adjusted position for larger object */
            top: 35%;
        }

        .sun .eye-right {
            right: 35%; /* Adjusted position for larger object */
            top: 35%;
        }

        /* Sun's Happy Smile (Symmetric) - Expanded smile */
        .sun .smile {
            width: 150px; /* Increased width */
            height: 40px; /* Increased height */
            border: 8px solid #FF6347; /* Red/Coral smile - thicker border */
            border-radius: 0 0 60px 60px;
            margin: 30px auto; /* Increased margin */
            /* Creating a happy arc/smile shape */
            border-bottom: none;
        }

        /* Optional: Add some simple sun rays (Expanded) */
        .sun::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 30px solid transparent; /* Thicker rays */
            border-right: 30px solid transparent;
            border-bottom: 60px solid #FFEB3B;
            border-bottom-color: #FFEB3B;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Title/Caption area if needed (keeping it focused on the sun/sky) */
        .sky-text {
            color: #333;
            font-size: 3em; /* Bigger text */
            margin-top: 30px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            border: 5px solid #FF6347;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun">
            <!-- Eyes -->
            <div class="eye-left"></div>
            <div class="eye-right"></div>
            <!-- Smile -->
            <div class="smile"></div>
        </div>
        <div class="sky-text">Giant Happy Sunshine!</div>
    </div>
</body>
</html>
