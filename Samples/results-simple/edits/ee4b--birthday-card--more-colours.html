<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bright Birthday Blast!</title>
    <style>
        body {
            /* Super vivid background: Electric Purple/Teal gradient feel */
            background: linear-gradient(135deg, #FF3860 0%, #FF8900 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: sans-serif;
        }

        .card-container {
            /* Bright, saturated yellow/gold base */
            background-color: #FFF3B0;
            border: 20px solid #FFC300; /* Vibrant Gold */
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 18px 35px rgba(255, 100, 0, 0.4); /* Orange glow shadow */
            text-align: center;
            width: 90%;
            max-width: 1000px;
            position: relative;
            background-color: #FFFDE7; /* Very light, cheerful base */
        }

        /* --- Title Banner --- */
        .banner {
            background-color: #FF6B6B; /* Vivid Coral Red */
            color: #FFD700; /* Bright Gold Text */
            padding: 15px 0;
            margin-bottom: 25px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .banner h1 {
            margin: 0;
            font-size: 3.5em;
            text-shadow: 3px 3px #D9003D; /* Deep, strong shadow */
        }

        /* --- Cake Styling --- */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .cake {
            background-color: #FFECB3; /* Lighter sponge */
            border-radius: 15px;
            padding-top: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .layer {
            width: 85%;
            height: 75px;
            margin-bottom: -12px;
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        /* Highly saturated cake colors */
        .layer:nth-child(1) { background-color: #FF4081; height: 90px; } /* Hot Pink/Magenta */
        .layer:nth-child(2) { background-color: #69F0AE; height: 70px; } /* Bright Mint Green */
        .layer:nth-child(3) { background-color: #42A5F5; height: 65px; } /* Electric Blue */

        /* Frosting drip/border effect */
        .layer::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -7px;
            right: -7px;
            height: 25px;
            background: linear-gradient(to right, transparent 40%, rgba(255, 255, 255, 0.4) 100%);
            border-radius: 8px;
        }

        .candles {
            display: flex;
            gap: 25px;
            margin-top: -20px;
            padding: 0 15px;
        }

        .candle-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle-stick {
            width: 10px;
            height: 35px;
            background-color: #FFD700; /* Gold stick */
            border-radius: 6px;
            position: relative;
            z-index: 5;
        }

        .flame {
            width: 14px;
            height: 14px;
            background-color: #FFEB3B; /* Bright Yellow flame */
            border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%;
            position: absolute;
            top: -25px;
            left: -3px;
            /* Animation kept as it was not the explicit request trigger */
            animation: flicker 0.5s infinite alternate;
            box-shadow: 0 0 10px rgba(255, 165, 0, 1);
        }

        /* --- Balloons Styling --- */
        .balloon-cluster {
            display: flex;
            gap: 25px;
            position: absolute;
            top: 30px; /* Adjusted for better placement */
            right: 40px;
            z-index: 1;
        }

        .balloon {
            width: 70px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 65% 65% 45% 45%;
            position: relative;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            /* Adding slight rotation variance for visual interest */
            transform: rotate(3deg) scale(1);
        }

        /* Super Vivid Balloon Colors */
        .balloon-1 { background-color: #FF5722; } /* Bright Orange-Red */
        .balloon-2 { background-color: #00BCD4; } /* Bright Cyan */
        .balloon-3 { background-color: #8BC34A; } /* Vivid Lime Green */
        .balloon-4 { background-color: #E91E63; } /* Hot Magenta Pink */
        .balloon-5 { background-color: #FF9800; } /* Intense Amber */

        .string {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 35px;
            background-color: #613689; /* Dark contrasting string color */
            border-radius: 5px;
            z-index: 0;
        }

        /* --- Text Message --- */
        .message {
            margin-top: 30px;
            padding: 20px;
            background-color: #FFC107; /* Vibrant Yellow/Amber */
            border: 4px solid #FF9800;
            border-radius: 15px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
        }

        .message p {
            font-size: 2.2em;
            color: #C2185B; /* Deep Magenta text */
            margin: 0;
        }

        /* Keyframe Animations (Retained) */
        @keyframes flicker {
            0% { transform: translate(-2px, 0); opacity: 0.9; }
            100% { transform: translate(-1px, -1px); opacity: 1; }
        }

    </style>
</head>
<body>
    <div class="card-container">
        <div class="banner">
            <h1>HAPPY BIRTHDAY!</h1>
        </div>

        <!-- Balloon Cluster -->
        <div class="balloon-cluster">
            <div class="balloon balloon-1">
                <div class="string"></div>
            </div>
            <div class="balloon balloon-2" style="transform: rotate(-5deg) scale(0.95);">
                <div class="string"></div>
            </div>
            <div class="balloon balloon-3" style="transform: rotate(10deg) scale(1.05);">
                <div class="string"></div>
            </div>
            <div class="balloon balloon-4" style="transform: rotate(-2deg) scale(0.85);">
                <div class="string"></div>
            </div>
            <div class="balloon balloon-5" style="transform: rotate(5deg);">
                <div class="string"></div>
            </div>
        </div>


        <!-- Cake Section -->
        <div class="cake-section">
            <div class="cake">
                <div class="layer"></div>
                <div class="layer"></div>
                <div class="layer"></div>
            </div>
            <div class="candles">
                <div class="candle-holder">
                    <div class="candle-stick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle-holder">
                    <div class="candle-stick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle-holder">
                    <div class="candle-stick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle-holder">
                    <div class="candle-stick"></div>
                    <div class="flame"></div>
                </div>
            </div>
        </div>

        <!-- Message Area -->
        <div class="message">
            <p>Wishing you the happiest day!</p>
        </div>

    </div>
</body>
</html>
