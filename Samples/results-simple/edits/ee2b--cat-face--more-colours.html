<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #aaffff; /* Light bright cyan background */
        }

        .cat-face {
            width: 300px;
            height: 300px;
            background-color: #ffff99; /* Bright yellow fur color */
            border-radius: 50%;
            position: relative;
            border: 10px solid #ff66b2; /* Vibrant pink border */
            box-shadow: 0 15px 30px rgba(255, 100, 180, 0.6); /* Brighter shadow */
        }

        /* --- Eyes --- */
        .eye {
            width: 65px;
            height: 65px;
            background-color: #6699ff; /* Bright sky blue/purple eyes */
            border-radius: 50%;
            position: absolute;
            top: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 6px solid #ff3366; /* Bright pink outline */
        }

        .eye.left {
            left: 60px;
            background-color: #ff66b2; /* Vibrant pink eye */
        }

        .eye.right {
            right: 60px;
            background-color: #ffcc33; /* Bright gold/orange eye */
        }

        /* --- Whiskers (Symmetric) --- */
        .whiskers {
            position: absolute;
            top: 125px;
            width: 240px;
            height: 60px;
            display: flex;
            justify-content: space-between;
        }

        .whisker {
            width: 50px; /* Longer, brighter whiskers */
            height: 4px;
            background-color: #ff3366; /* Bright pink whiskers */
            border-radius: 2px;
        }

        .whisker.left {
            margin-left: 60px;
        }

        .whisker.right {
            margin-right: 60px;
        }
    </style>
</head>
<body>
    <div class="cat-face">
        <!-- Eyes -->
        <div class="eye left"></div>
        <div class="eye right"></div>

        <!-- Whiskers -->
        <div class="whiskers">
            <div class="whisker left"></div>
            <div class="whisker right"></div>
        </div>
    </div>
</body>
</html>
