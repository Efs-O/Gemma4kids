<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Air Balloon</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: linear-gradient(to bottom, #6b90ff, #98c1ff); /* Bright Sky Gradient */
            overflow: hidden;
        }

        .balloon-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transform: scale(1.1); /* Make it prominent */
        }

        .balloon-envelope {
            background: linear-gradient(145deg, #ff4136, #ff851b); /* Vivid Red/Orange Mix */
            width: 200px;
            height: 350px;
            border-radius: 50% / 10% 10% 50% 50%; /* Fun, rounded shape */
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* Adding colorful panels/sections to the balloon for more vibrancy */
        .panel-top {
            width: 100%;
            height: 15%;
            background-color: #ffc300; /* Bright Yellow */
            position: absolute;
            top: 0;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }

        .panel-bottom {
            width: 100%;
            height: 15%;
            background-color: #1abc9c; /* Turquoise/Aqua */
            position: absolute;
            bottom: 0;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .balloon-basket {
            background-color: #8b4513; /* Saddle Brown */
            width: 220px;
            height: 80px;
            border-radius: 15px;
            margin-top: -20px; /* Overlapping the envelope slightly */
            position: relative;
            z-index: 11;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .basket-details {
            width: 90%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #5d4037,
                #5d4037 10px,
                #795548 10px,
                #795548 20px
            );
            border-radius: 10px;
        }

        /* Burner/Flame Effect */
        .flame-area {
            width: 40px;
            height: 80px;
            background: radial-gradient(circle, #ff6b00 0%, #ffc107 70%, transparent 100%);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            border-radius: 0 0 50%;
        }

        /* Support Ropes */
        .support-ropes {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
            z-index: 12;
        }

        .rope {
            width: 2px;
            height: 40px;
            background-color: #555;
            /* Simple stylized connection point */
            position: relative;
        }

        .rope::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 10px;
            height: 5px;
            background-color: #777;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="balloon-container">
        
        <!-- Support Ropes -->
        <div class="support-ropes">
            <div class="rope"></div>
            <div class="rope"></div>
            <div class="rope"></div>
        </div>

        <!-- The Balloon Envelope -->
        <div class="balloon-envelope">
            <div class="panel-top"></div>
            <div class="panel-bottom"></div>
            
            <!-- Flame/Heat Source -->
            <div class="flame-area"></div>
        </div>
        
        <!-- Basket -->
        <div class="balloon-basket">
            <div class="basket-details"></div>
        </div>
    </div>

</body>
</html>
