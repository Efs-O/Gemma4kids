<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colourful Pizza Slice</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffcc00; /* Bright background */
        }

        .pizza-container {
            width: 300px;
            height: 300px;
            position: relative;
            background-color: #ff6600; /* Pizza base/sauce color */
            border-radius: 50%; /* Base circle effect */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Creating the triangular slice shape */
        .slice {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff9933; /* Cheese color */
            /* Using CSS to create a triangular slice shape within the circle approximation */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform-origin: center;
        }

        /* Crust effect (optional, helps define the edge) */
        .crust {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 320px;
            height: 320px;
            background-color: #e8a342; /* Crust edge */
            border-radius: 50%;
            z-index: -1;
        }

        /* Toppings (Symmetry applied) */
        .topping {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #cc0000; /* Pepperoni Red */
            border: 3px solid #ffcc00;
        }

        /* Placing toppings symmetrically */
        .topping:nth-child(1) {
            top: 50px;
            left: 50px;
        }
        .topping:nth-child(2) {
            top: 50px;
            left: 150px;
        }
        .topping:nth-child(3) {
            top: 150px;
            left: 50px;
        }
        .topping:nth-child(4) {
            top: 150px;
            left: 150px;
        }

        /* Extra topping for visual appeal */
        .topping:nth-child(5) {
            top: 100px;
            left: 100px;
            background-color: #44aa44; /* Green pepper/mushroom */
            border-color: #ffcc00;
        }

    </style>
</head>
<body>
    <div class="pizza-container">
        <div class="crust"></div>
        <div class="slice"></div>
        <!-- Toppings -->
        <div class="topping"></div>
        <div class="topping"></div>
        <div class="topping"></div>
        <div class="topping"></div>
        <div class="topping"></div>
    </div>
</body>
</html>
