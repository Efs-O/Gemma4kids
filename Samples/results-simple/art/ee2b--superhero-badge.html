<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Badge</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #ff99cc; /* Bright background color */
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .badge-container {
            width: 300px;
            height: 300px;
            background-color: #44ccff; /* Bright blue background */
            border-radius: 50%; /* Circular badge shape */
            position: relative;
            border: 10px solid #ff66b2; /* Pink border */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.8); /* Gold glow */
        }

        .letter {
            font-size: 150px;
            font-weight: 900; /* Bold */
            color: #ff0066; /* Bright pink/red letter */
            text-shadow: 5px 5px 0px #00ffff; /* Cyan shadow for pop */
            line-height: 1;
        }

        /* Adding a simple shield/star element for extra flair */
        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: #ffff00; /* Yellow star */
            border-radius: 50%;
            border: 5px solid #ff66b2;
            z-index: -1; /* Place behind text if needed, or adjust positioning */
        }
    </style>
</head>
<body>

    <div class="badge-container">
        <div class="star"></div>
        <div class="letter">S</div>
    </div>

</body>
</html>
