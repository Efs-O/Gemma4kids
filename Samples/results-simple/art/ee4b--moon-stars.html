<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Sky Scene</title>
    <style>
        body {
            background-color: #0a042d; /* Deep Indigo/Night Sky */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden; /* Keeps stars contained */
        }

        .sky-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Moon */
        .moon {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #fffbe0; /* Pale Yellow/Creamy White */
            border-radius: 50%;
            box-shadow: 0 0 50px 10px rgba(255, 255, 150, 0.7); /* Soft glow */
            z-index: 1;
        }

        /* Stars container for absolute positioning */
        .stars-field {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Helper class for stars (using different colors and sizes) */
        .star {
            position: absolute;
            background-color: currentColor; /* Use defined color */
            border-radius: 50%;
            opacity: 0.8;
        }

        /* Positioning specific stars for vivid effect */
        .star-1 { width: 3px; height: 3px; top: 5%; left: 10%; background-color: #ffea00; }
        .star-2 { width: 2px; height: 2px; top: 15%; left: 70%; background-color: #a0c4ff; }
        .star-3 { width: 4px; height: 4px; top: 25%; left: 45%; background-color: #ff69b4; }
        .star-4 { width: 2px; height: 2px; top: 35%; left: 90%; background-color: #ffff00; }
        .star-5 { width: 3px; height: 3px; top: 50%; left: 5%; background-color: #00ffff; }
        .star-6 { width: 1px; height: 1px; top: 60%; left: 25%; background-color: #ffffff; }
        .star-7 { width: 2px; height: 2px; top: 75%; left: 80%; background-color: #ffaa00; }
        .star-8 { width: 3px; height: 3px; top: 85%; left: 50%; background-color: #ff00ff; }
        .star-9 { width: 2px; height: 2px; top: 10%; left: 30%; background-color: #aaffff; }
        .star-10 { width: 1px; height: 2px; top: 40%; left: 15%; background-color: #ffffff; }
        .star-11 { width: 3px; height: 2px; top: 90%; left: 65%; background-color: #ffea00; }
        .star-12 { width: 2px; height: 3px; top: 20%; left: 5%; background-color: #a0c4ff; }
        
    </style>
</head>
<body>
    <div class="sky-container">
        <div class="moon"></div>
        <div class="stars-field">
            <!-- Scattered stars for a vibrant night feel -->
            <div class="star star-1"></div>
            <div class="star star-2"></div>
            <div class="star star-3"></div>
            <div class="star star-4"></div>
            <div class="star star-5"></div>
            <div class="star star-6"></div>
            <div class="star star-7"></div>
            <div class="star star-8"></div>
            <div class="star star-9"></div>
            <div class="star star-10"></div>
            <div class="star star-11"></div>
            <div class="star star-12"></div>
        </div>
    </div>
</body>
</html>
