<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colourful Pizza Slice</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #ff7e50; /* Vivid background color (Orange/Coral) */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .pizza-container {
            width: 90vmin;
            height: 90vmin;
            position: relative;
            transform: rotate(-20deg); /* Give it a nice angle */
        }

        .pizza-slice {
            width: 100%;
            height: 100%;
            background: #ffcc00; /* Crust color base */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
            transform-origin: center center;
            border-radius: 15% 15% 0 0;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            /* Creating the wedge shape using clipping path approximation */
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            /* Adjusting the size and position to look like a slice */
            width: 60vmin;
            height: 90vmin;
            border-radius: 50% 0 0 50%;
            /* Adjusting perspective for a more triangular look */
            transform: scaleY(0.9) rotate(-15deg);
            background-color: #ffdf8c; /* Lighter dough color */
            border-top: 10px solid #ff9800; /* Defining the top edge/crust separation */
            border-right: 10px solid #ff9800;
            border-bottom: 10px solid #ff9800;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0) rotate(-15deg);
        }

        .cheese {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            background: radial-gradient(circle at 50% 50%, #fff176, #ffb74d); /* Gradient for cheesy look */
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(255, 255, 0, 0.5);
            z-index: 1;
        }

        /* Toppings */
        .topping-group {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            z-index: 2;
        }

        /* Pepperoni */
        .pepperoni {
            width: 40px;
            height: 30px;
            background-color: #d32f2f; /* Deep red */
            border-radius: 50% 50% 10px 10px;
            position: absolute;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
        }
        .pep1 { top: 15%; left: 20%; transform: rotate(10deg); }
        .pep2 { top: 30%; left: 65%; transform: rotate(-5deg); }
        .pep3 { top: 50%; left: 15%; transform: rotate(0deg); }

        /* Mushroom */
        .mushroom {
            width: 25px;
            height: 25px;
            background-color: #8d6e63; /* Brown */
            border-radius: 50%;
            position: absolute;
            top: 25%;
            left: 45%;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
        }
        .mushroom::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background-color: #bcaaa4;
            border-radius: 0 0 50% 50%;
        }

        /* Bell Pepper Slices (Red/Yellow) */
        .pepper {
            width: 18px;
            height: 18px;
            background-color: #f44336; /* Bright Red */
            border-radius: 50%;
            position: absolute;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .pepper-yellow {
            background-color: #ffeb3b; /* Bright Yellow */
        }
        .p1 { top: 15%; left: 60%; }
        .p2 { top: 40%; left: 10%; }
        .p3 { top: 70%; left: 40%; }
    </style>
</head>
<body>
    <div class="pizza-container">
        <div class="pizza-slice">
            <div class="cheese"></div>
            <div class="topping-group">
                <!-- Pepperoni -->
                <div class="pepperoni pep1"></div>
                <div class="pepperoni pep2"></div>
                <div class="pepperoni pep3"></div>

                <!-- Mushroom -->
                <div class="mushroom"></div>

                <!-- Peppers -->
                <div class="pepper p1"></div>
                <div class="pepper-yellow p2"></div>
                <div class="pepper p3"></div>
            </div>
        </div>
    </div>
</body>
</html>
