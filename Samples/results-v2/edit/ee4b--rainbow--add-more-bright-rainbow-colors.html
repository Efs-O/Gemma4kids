<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        body {
            background: linear-gradient(to bottom, #87ceeb, #a0c4ff); /* Light sky blue gradient */
            overflow: hidden;
            margin: 0;
            height: 100vh;
            position: relative;
        }

        /* ------------------ RAIN EFFECT ------------------ */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.8), rgba(173, 216, 230, 0));
            animation: fall linear infinite;
            opacity: 0.7;
        }

        /* Staggering drops for a natural look */
        .raindrop:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 1s; }
        .raindrop:nth-child(2) { left: 30%; animation-delay: 0.5s; animation-duration: 1.2s; }
        .raindrop:nth-child(3) { left: 50%; animation-delay: 0.2s; animation-duration: 0.9s; }
        .raindrop:nth-child(4) { left: 70%; animation-delay: 0.8s; animation-duration: 1.1s; }
        .raindrop:nth-child(5) { left: 90%; animation-delay: 0s; animation-duration: 1.5s; }

        @keyframes fall {
            to {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        /* ------------------ RAINBOW EFFECT ------------------ */
        .rainbow {
            position: absolute;
            bottom: 10%; /* Positioned above the "ground" level */
            width: 100%;
            height: 300px;
            background: linear-gradient(to top, 
                #ff0000, /* Red */
                #ff7f00, /* Orange */
                #ffff00, /* Yellow */
                #00ff00, /* Green */
                #00ffff, /* Cyan */
                #0000ff, /* Blue */
                #ff00ff  /* Magenta */
            );
            /* Initial state: invisible and low */
            opacity: 0;
            transform: scaleY(0.1) translateY(100px);
            animation: revealRainbow 8s ease-out forwards;
            z-index: 10;
        }

        @keyframes revealRainbow {
            0% {
                opacity: 0;
                transform: scaleY(0.1) translateY(100px);
            }
            20% {
                /* Fades in quickly */
                opacity: 0.6;
                transform: scaleY(1.1) translateY(0px);
            }
            100% {
                opacity: 1;
                transform: scaleY(1) translateY(0px);
            }
        }

    </style>
</head>
<body>

    <div class="rain-container">
        <div class="raindrop"></div>
        <div class="raindrop"></div>
        <div class="raindrop"></div>
        <div class="raindrop"></div>
        <div class="raindrop"></div>
    </div>

    <div class="rainbow"></div>

</body>
</html>
