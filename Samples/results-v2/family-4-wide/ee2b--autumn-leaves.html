<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Autumn Fall</title>
    <style>
        :root {
            /* Define vivid autumn colors */
            --color-red: #ff4d4d;
            --color-orange: #ffaa33;
            --color-gold: #ffcc00;
            --color-deep-red: #990000;
            --color-brown: #8b4513;
            --color-yellow: #ffff66;
            --fall-duration-slow: 10s;
            --fall-duration-medium: 6s;
            --fall-duration-fast: 3s;
        }

        body {
            margin: 0;
            height: 100vh;
            /* Background matching the scene */
            background: linear-gradient(to bottom, #a8d5ff, #ffeedd);
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Tree/Background Layer Simulation */
        .tree-layer {
            position: absolute;
            width: 100%;
            height: 60vh;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }

        /* --- Leaf Animation Definitions --- */

        /* Slow, large, deep fall (Background layer) */
        @keyframes fallSlow {
            0% {
                transform: translateY(-100vh) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(50vw);
                opacity: 0.8;
            }
        }

        /* Medium, medium speed fall (Midground layer) */
        @keyframes fallMedium {
            0% {
                transform: translateY(-100vh) translateX(-50vw);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(100vw);
                opacity: 0.9;
            }
        }

        /* Fast, small, bright fall (Foreground layer) */
        @keyframes fallFast {
            0% {
                transform: translateY(-100vh) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(-100vw);
                opacity: 0.7;
            }
        }

        /* --- Leaf Styling and Animation Application --- */
        .leaf {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            animation-name: fallSlow; /* Default fallback */
            animation-timing-function: linear;
            animation-duration: var(--fall-duration-slow);
            z-index: 5;
        }

        /* Specific Color and Timing Definitions */

        /* Layer 1: Slow, deep orange/red (Background depth) */
        .leaf.layer1 {
            background-color: var(--color-orange);
            animation-name: fallSlow;
            animation-duration: var(--fall-duration-slow);
            animation-delay: 0s;
            left: 10%;
            top: 10%;
        }

        /* Layer 2: Medium, bright gold (Midground depth) */
        .leaf.layer2 {
            background-color: var(--color-gold);
            animation-name: fallMedium;
            animation-duration: var(--fall-duration-medium);
            animation-delay: 2s; /* Stagger start */
            left: 50%;
            top: 15%;
        }

        /* Layer 3: Fast, vivid red (Foreground depth) */
        .leaf.layer3 {
            background-color: var(--color-red);
            animation-name: fallFast;
            animation-duration: var(--fall-duration-fast);
            animation-delay: 4s; /* Stagger start */
            left: 80%;
            top: 5%;
        }

        /* Applying the generic fall animation to all specific leaves */
        .leaf {
            /* Ensure all leaves use the definition for their specific layer */
            animation-duration: var(--fall-duration-slow); /* Reset for clarity, but specific classes override */
        }

        /* Ensure leaves start off-screen above the view */
        .leaf[style*="animation-name: fallSlow"] {
            top: -50px;
        }
        .leaf[style*="animation-name: fallMedium"] {
            top: -50px;
        }
        .leaf[style*="animation-name: fallFast"] {
            top: -50px;
        }

    </style>
</head>
<body>

    <!-- Background Scene Setup (Simulating Trees/Ground) -->
    <div class="tree-layer" style="background-color: #5e4c3e;"></div>
    <div class="tree-layer" style="background-color: #7c5e3d;"></div>


    <!-- Animated Leaves (Layered Depth Simulation) -->

    <!-- Layer 1: Slow Falling Orange/Red (Background Depth) -->
    <div class="leaf layer1" style="left: 5%; top: 20%; animation-delay: 0.5s;"></div>
    <div class="leaf layer1" style="left: 40%; top: 30%; animation-delay: 1.5s;"></div>
    <div class="leaf layer1" style="left: 70%; top: 40%; animation-delay: 2.5s;"></div>
    <div class="leaf layer1" style="left: 15%; top: 50%; animation-delay: 3.5s;"></div>

    <!-- Layer 2: Medium Falling Gold (Midground Depth) -->
    <div class="leaf layer2" style="left: 25%; top: 10%; animation-delay: 1s;"></div>
    <div class="leaf layer2" style="left: 65%; top: 25%; animation-delay: 3s;"></div>
    <div class="leaf layer2" style="left: 35%; top: 45%; animation-delay: 4s;"></div>
    <div class="leaf layer2" style="left: 85%; top: 15%; animation-delay: 5s;"></div>

    <!-- Layer 3: Fast Falling Vivid Red (Foreground Depth) -->
    <div class="leaf layer3" style="left: 10%; top: 30%; animation-delay: 2s;"></div>
    <div class="leaf layer3" style="left: 55%; top: 5%; animation-delay: 4s;"></div>
    <div class="leaf layer3" style="left: 90%; top: 20%; animation-delay: 6s;"></div>
    <div class="leaf layer3" style="left: 30%; top: 40%; animation-delay: 7s;"></div>

</body>
</html>
