<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        :root {
            --color-dark-storm: #1a237e; /* Deep Indigo/Storm base */
            --color-rain-start: rgba(173, 216, 230, 0.5); /* Light blue/cyan for rain */
            --color-sky-clear: #ffeb3b; /* Bright yellow glow for sun */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-dark-storm);
            perspective: 1000px; /* For depth */
            font-family: sans-serif;
        }

        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2c3e50 0%, #4a69bd 50%, #7f9fb1 100%);
            animation: skyTransition 10s ease-in-out forwards;
        }

        /* 1. Background Sky/Atmosphere Transition (Deep to Bright) */
        @keyframes skyTransition {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 100%; }
        }
        
        /* Adding a subtle pulsing glow in the background */
        .glow-source {
            position: absolute;
            width: 200vw;
            height: 200vw;
            background: radial-gradient(circle, rgba(255, 255, 0, 0.5) 0%, transparent 70%);
            top: -100vw;
            left: -100vw;
            animation: glowPulse 15s linear infinite;
            z-index: 1;
        }
        
        @keyframes glowPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(50%, 50%) scale(1.5); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
        }


        /* 2. Rain Effect (Foreground/Midground) */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0) 0%, rgba(173, 216, 230, 0.8) 50%, rgba(173, 216, 230, 0) 100%);
            opacity: 0.6;
            animation: fall linear infinite;
        }

        /* Defines the rain falling animation */
        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 0.5; }
            100% { transform: translateY(100vh); opacity: 0.2; }
        }
        
        /* --- RAIN STYLING --- */
        /* We will inject many raindrops via JS to ensure varied timing */


        /* 3. Rainbow Arcs (Foreground Focus) */
        .rainbow-arc {
            position: absolute;
            z-index: 20;
            border-radius: 50%;
            opacity: 0;
            animation: appearAndSettle 8s ease-out forwards;
            box-shadow: 0 0 50px 10px rgba(255, 255, 0, 0.8); /* Subtle glow */
            transform: scale(0.5);
            box-sizing: border-box;
        }

        /* Keyframes for the rainbow appearance */
        @keyframes appearAndSettle {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(100px);
            }
            10% {
                 opacity: 1;
                 transform: scale(1.1) translateY(50px);
            }
            100% {
                opacity: 0.9;
                transform: scale(1) translateY(0);
            }
        }

        /* Specific colors and delays for distinct visual separation */
        .r-arc {
            background: linear-gradient(to right, #ff0000, #ff6600, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            width: 120vw;
            height: 120vw;
            top: 30%;
            left: -40vw;
            animation-delay: 1s; /* Starts a bit later */
        }
        
        .r-arc-2 {
            background: linear-gradient(to right, #ff0000, #ff6600, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            width: 100vw;
            height: 100vw;
            top: 55%;
            left: 0;
            animation-delay: 2.5s; /* Appears later */
        }

    </style>
</head>
<body>

    <div class="scene-wrapper">
        <!-- Background Glow Source (Midground) -->
        <div class="glow-source"></div>
        
        <!-- Rain Container (Foreground/Midground) -->
        <div class="rain-container" id="rainContainer">
            <!-- Raindrops will be injected here by JavaScript -->
        </div>

        <!-- Rainbow Elements (Foreground) -->
        <div class="rainbow-arc r-arc"></div>
        <div class="rainbow-arc r-arc-2"></div>

    </div>

    <script>
        const rainContainer = document.getElementById('rainContainer');
        const numDrops = 80; // Increased number for density

        // --- RAIN GENERATION ---
        function generateRain() {
            for (let i = 0; i < numDrops; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                
                // Random starting horizontal position
                let startX = Math.random() * window.innerWidth;
                // Random vertical starting position (high up)
                let startY = Math.random() * -200; 
                
                drop.style.left = `${startX}px`;
                drop.style.top = `${startY}px`;
                
                // Random animation timing to break synchronization
                const delay = Math.random() * 0.5; // Small initial stagger
                const duration = 0.5 + Math.random() * 1.5; // Vary speed slightly
                
                drop.style.animationDuration = `${duration}s`;
                drop.style.animationDelay = `${delay}s`;
                
                rainContainer.appendChild(drop);
            }
        }

        // --- ANIMATION PHASE CONTROL (Simulating the transition) ---
        
        function handleRainFade() {
            // Reduce opacity and speed of rain after 8 seconds
            const raindrops = document.querySelectorAll('.raindrop');
            raindrops.forEach(drop => {
                drop.style.transition = 'opacity 4s ease-out, transform 4s ease-out';
                // By changing animation properties, we simulate the rain stopping/fading
                drop.style.opacity = '0'; 
                // We don't actually stop the CSS animation, but we make it invisible/slow visually
            });
        }

        // Execute setup
        generateRain();

        // Sequence Timing:
        // 0s - 8s: Stormy rain falling.
        // 8s - 12s: Rain fades, glow appears, Rainbow fully visible.

        window.onload = () => {
            // Set the rain to start immediately
            console.log("Rain started.");
            
            // Schedule the rain fading effect after 8 seconds
            setTimeout(handleRainFade, 8000); 
        };

    </script>
</body>
</html>
