<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch to Space</title>
    <style>
        /* 1. Global Setup & Space Background */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000011; /* Deep space navy */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Start rocket near the bottom */
            height: 100vh;
            position: relative;
        }

        /* 2. Star Field Animation */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.8) 1px, transparent 1px),
                              radial-gradient(circle, rgba(255, 255, 255, 0.8) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px;
            animation: twinkleStars 120s linear infinite;
        }

        @keyframes twinkleStars {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 10000px 10000px; /* Massive shift for slow parallax */
            }
        }

        /* 3. Rocket Styling */
        .rocket {
            position: absolute;
            bottom: 50px; /* Start above the ground/launch pad area */
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 150px;
            background: linear-gradient(to top, #cc0000 0%, #ffaa00 50%, #ffff00 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Simple triangular shape for body */
            box-shadow: 0 0 20px 5px rgba(255, 165, 0, 0.8);
            z-index: 10;
            animation: launch 5s ease-out forwards; /* Key animation applied here */
        }

        /* 4. Exhaust Flame Styling */
        .flame {
            position: absolute;
            bottom: 100%; /* Positioned right at the bottom of the rocket base */
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 150px;
            background: radial-gradient(ellipse at 50% 100%, #ff9900, #ff4500, transparent);
            filter: blur(10px);
            z-index: 11;
            animation: flare 0.3s linear infinite alternate;
            opacity: 1;
        }

        /* 5. Keyframe Animations */

        /* Rocket Ascent Animation */
        @keyframes launch {
            0% {
                bottom: 50px;
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            /* Mid-flight adjustments (optional lift flare) */
            50% {
                bottom: 60vh;
                transform: translateX(-50%) scale(1.05);
            }
            /* Final ascent */
            100% {
                bottom: 95vh; /* Moves high up the screen */
                transform: translateX(-50%) scale(1);
                opacity: 0.8; /* Fades slightly as it reaches apogee */
            }
        }

        /* Flame Pulsing Animation */
        @keyframes flare {
            from {
                height: 100px;
                opacity: 0.8;
                transform: translateX(-50%) scaleY(0.9);
            }
            to {
                height: 180px;
                opacity: 1;
                transform: translateX(-50%) scaleY(1.1);
            }
        }

        /* Ground Marker (For reference) */
        .launch-pad {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, #113311, #000022);
            z-index: 5;
        }

    </style>
</head>
<body>

    <!-- Background Star Field -->
    <div class="star-field"></div>

    <!-- Launch Pad Marker -->
    <div class="launch-pad"></div>

    <!-- The Rocket Element -->
    <div class="rocket">
        <!-- The flame element follows the rocket -->
        <div class="flame"></div>
    </div>

    <script>
        // Optional: Add a subtle glow/tail effect to the rocket slightly off-camera for realism
        const rocket = document.querySelector('.rocket');
        const tail = document.createElement('div');
        tail.style.position = 'absolute';
        tail.style.bottom = '100%';
        tail.style.left = '50%';
        tail.style.transform = 'translateX(-50%)';
        tail.style.width = '15px';
        tail.style.height = '10px';
        tail.style.backgroundColor = 'rgba(255, 100, 0, 0.7)';
        tail.style.borderRadius = '50%';
        tail.style.boxShadow = '0 0 10px 3px orange';
        tail.style.animation = 'tailTrail 0.1s linear infinite alternate';
        
        // Add tail to the rocket container
        rocket.appendChild(tail);

        // Adjusting the launch animation slightly after the initial load to ensure it starts right
        window.onload = function() {
            // We rely on the CSS keyframe 'launch' to handle the timing, 
            // but we can ensure the flame animation starts immediately.
            console.log("Rocket launch sequence initiated.");
        };
    </script>

</body>
</html>
