<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Sea Animation</title>
    <style>
        /* Global Setup and Background */
        :root {
            --sea-color-dark: #005f82;
            --sea-color-medium: #008cba;
            --sea-color-light: #90e0ef;
            --fish-length: 150px;
            --animation-duration: 25s;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sea-color-dark);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Keep action near the bottom */
            position: relative;
        }

        /* The Sea Container - Gives the main atmosphere */
        #sea {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--sea-color-light) 0%, var(--sea-color-medium) 50%, var(--sea-color-dark) 100%);
            box-shadow: inset 0 -100px 50px rgba(0, 0, 0, 0.2);
        }

        /* --- FISH STYLING & ANIMATION --- */

        .fish {
            position: absolute;
            height: 50px;
            background-color: transparent;
            border-radius: 50% / 50% 50% 0 0; /* Curved body shape */
            animation: swim linear infinite;
            transform-origin: center;
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
        }

        /* Styling for individual fish elements */
        .fish-1 {
            width: var(--fish-length);
            background: linear-gradient(to right, #ff6b6b, #ee5252); /* Red/Coral */
            top: 20%;
            left: -100px;
            animation-duration: 20s;
            animation-delay: 0s;
        }

        .fish-2 {
            width: var(--fish-length) * 1.2;
            background: linear-gradient(to right, #ffe66d, #ffc300); /* Yellow/Gold */
            top: 50%;
            left: -100px;
            animation-duration: 28s;
            animation-delay: 5s;
            transform: scaleX(1.1);
        }

        .fish-3 {
            width: var(--fish-length);
            background: linear-gradient(to right, #4d96ff, #2962ff); /* Blue */
            top: 70%;
            left: -100px;
            animation-duration: 18s;
            animation-delay: 10s;
        }

        .fish-4 {
            width: var(--fish-length) * 0.9;
            background: linear-gradient(to right, #ff8cba, #ff5793); /* Pink/Magenta */
            top: 35%;
            left: -100px;
            animation-duration: 22s;
            animation-delay: 8s;
            transform: scaleX(0.9);
        }

        /* Keyframes for swimming motion */
        @keyframes swim {
            0% {
                transform: translateX(-100%) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateX(110vw) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* --- BUBBLE STYLING & ANIMATION --- */

        .bubble-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ensures clicks pass through */
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0; /* Start invisible */
            z-index: 10;
        }

        /* Bubble 1 (Large, slow) */
        .bubble-1 {
            width: 40px;
            height: 40px;
            left: 10vw;
            bottom: 5%;
            animation: floatUp 10s linear infinite;
            animation-delay: 0s;
            opacity: 1;
        }

        /* Bubble 2 (Medium, medium speed) */
        .bubble-2 {
            width: 25px;
            height: 25px;
            left: 35vw;
            bottom: 10%;
            animation: floatUp 8s linear infinite;
            animation-delay: 2s;
            opacity: 1;
        }

        /* Bubble 3 (Small, fast) */
        .bubble-3 {
            width: 15px;
            height: 15px;
            left: 60vw;
            bottom: 2%;
            animation: floatUp 5s linear infinite;
            animation-delay: 4s;
            opacity: 1;
        }

        /* Bubble 4 (Large, staggered) */
        .bubble-4 {
            width: 35px;
            height: 35px;
            left: 85vw;
            bottom: 8%;
            animation: floatUp 11s linear infinite;
            animation-delay: 1s;
            opacity: 1;
        }

        /* Keyframes for rising motion (bubbles) */
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(0.5); /* Rises past the screen and shrinks */
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="sea">
        <!-- Fish Elements -->
        <div class="fish fish-1"></div>
        <div class="fish fish-2"></div>
        <div class="fish fish-3"></div>
        <div class="fish fish-4"></div>

        <!-- Bubble Container -->
        <div class="bubble-container">
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            <div class="bubble bubble-4"></div>
        </div>
    </div>

    <script>
        // JavaScript is only used here to potentially tweak or confirm element setup, 
        // but the core animation logic relies purely on CSS keyframes for immediate effect.
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Sea animation loaded. Enjoy the colorful swim!");
        });
    </script>
</body>
</html>
