<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes</title>
    <style>
        /* Define colors and variables for a night sky feel */
        :root {
            --sky-dark: #16213e; /* Dark Navy */
            --snow-color: #ffffff;
            --num-snowflakes: 50;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-dark), #0f1a38);
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Hide scrollbars */
            font-family: sans-serif;
        }

        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--snow-color);
            border-radius: 50%;
            opacity: 0.8;
            animation-name fall;
            animation-duration: 10s; /* Slow and gentle fall */
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Define the falling animation */
        @keyframes fall {
            0% {
                transform: translateY(-10vh); /* Start above the screen */
                opacity: 0.7;
            }
            100% {
                transform: translateY(105vh); /* Fall off the bottom */
                opacity: 0.3;
            }
        }

        /* Stagger the start times and initial positions for a nicer effect */
        .snowflake:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            animation-duration: 12s;
        }
        .snowflake:nth-child(2) {
            left: 30%;
            animation-delay: 1s;
            animation-duration: 9s;
        }
        .snowflake:nth-child(3) {
            left: 50%;
            animation-delay: 2s;
            animation-duration: 11s;
        }
        .snowflake:nth-child(4) {
            left: 70%;
            animation-delay: 3s;
            animation-duration: 10.5s;
        }
        .snowflake:nth-child(5) {
            left: 90%;
            animation-delay: 4s;
            animation-duration: 13s;
        }

        /* Creating more unique snowflake styles */
        .snowflake:nth-child(6) {
            width: 8px;
            height: 8px;
            background-color: #a0c4ff; /* Light Blue */
            animation-duration: 8s;
        }
        .snowflake:nth-child(7) {
            width: 12px;
            height: 12px;
            background-color: #ffddaa; /* Soft Yellow */
            animation-duration: 10s;
        }

    </style>
</head>
<body>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <!-- Add more snowflakes to fill the screen -->
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
</body>
</html>
