<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Fish in the Sea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Deep ocean gradient background */
            background: linear-gradient(to bottom, #005f73, #023047);
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* --- Bubble Animation --- */
        .bubble {
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: absolute;
            opacity: 0;
            animation: rise 10s linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-150vh); /* Moves far up */
                opacity: 0;
            }
        }

        /* --- Fish Styling (Using CSS shapes) --- */
        .fish {
            position: absolute;
            bottom: 10%;
            animation: swim linear infinite;
            z-index: 5;
        }

        /* Fish 1: Bright Coral Fish */
        .fish:nth-child(1) {
            left: 5%;
            width: 150px;
            height: 60px;
            background: linear-gradient(90deg, #FF6347, #FFA07A);
            transform: scaleX(1);
            animation-duration: 15s;
            animation-timing-function: ease-in-out;
        }
        .fish:nth-child(1) .body-main {
            width: 100px;
            height: 50px;
            border-radius: 50% 70% 50% 50%;
            background: linear-gradient(90deg, #FF6347, #FFA07A);
            position: absolute;
            top: 5px;
            left: 0;
        }
        .fish:nth-child(1) .tail {
            width: 50px;
            height: 40px;
            background: linear-gradient(90deg, #FF8C00, #FFA07A);
            clip-path: polygon(0 0, 100% 50%, 0% 100%);
            position: absolute;
            top: 10px;
            left: 100px;
        }
        .fish:nth-child(1) .eye {
            background-color: black;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            left: 15px;
        }

        /* Fish 2: Tropical Blue Fish */
        .fish:nth-child(2) {
            left: 80%;
            width: 180px;
            height: 70px;
            background: linear-gradient(90deg, #4682B4, #6A5ACD);
            transform: scaleX(1);
            animation-duration: 22s;
            animation-timing-function: ease-in-out;
        }
        .fish:nth-child(2) .body-main {
            width: 120px;
            height: 60px;
            border-radius: 50% 70% 50% 50%;
            background: linear-gradient(90deg, #4682B4, #6A5ACD);
            position: absolute;
            top: 5px;
            left: 0;
        }
        .fish:nth-child(2) .tail {
            width: 60px;
            height: 50px;
            background: linear-gradient(90deg, #6A5ACD, #4682B4);
            clip-path: polygon(0 0, 100% 50%, 0% 100%);
            position: absolute;
            top: 10px;
            left: 110px;
        }
        .fish:nth-child(2) .eye {
            background-color: black;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            left: 20px;
        }

        /* Fish 3: Orange Yellow Fish */
        .fish:nth-child(3) {
            left: 20%;
            width: 140px;
            height: 55px;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            transform: scaleX(1);
            animation-duration: 18s;
            animation-timing-function: ease-in-out;
        }
        .fish:nth-child(3) .body-main {
            width: 90px;
            height: 45px;
            border-radius: 50% 65% 50% 50%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            position: absolute;
            top: 5px;
            left: 0;
        }
        .fish:nth-child(3) .tail {
            width: 50px;
            height: 40px;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            clip-path: polygon(0 0, 100% 50%, 0% 100%);
            position: absolute;
            top: 10px;
            left: 100px;
        }
        .fish:nth-child(3) .eye {
            background-color: black;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            position: absolute;
            top: 13px;
            left: 12px;
        }


        /* Keyframe for swimming animation */
        @keyframes swim {
            0% { transform: translateX(-100vw) scaleX(1); }
            100% { transform: translateX(100vw) scaleX(1); }
        }

        /* Adjusting swim direction for Fish 1 (swims right) */
        .fish:nth-child(1) {
            animation-name: swim-right;
            animation-timing-function: ease-in-out;
        }
        @keyframes swim-right {
            0% { transform: translateX(-100vw) scaleX(1); }
            100% { transform: translateX(100vw) scaleX(1); }
        }

        /* Adjusting swim direction for Fish 2 (swims left) */
        .fish:nth-child(2) {
            animation-name: swim-left;
            animation-timing-function: ease-in-out;
        }
        @keyframes swim-left {
            0% { transform: translateX(100vw) scaleX(1); }
            100% { transform: translateX(-100vw) scaleX(1); }
        }
        /* Note: Because we want fish 2 to swim left, we actually need to flip its initial scale and the animation keyframes, but for simplicity and visual effect, I've slightly adjusted the base swim animation to just move across the screen, which often looks better for random swimmers when directional logic gets too complex. I've kept the swim direction simple for all, moving across the screen and letting the initial placement define which way it 'starts' to move relative to the view. */

        /* Fixing swim direction for a better effect: Let's reverse the transform for fish 2 and 3 for a better flow. */
        .fish:nth-child(2) {
            transform: scaleX(-1); /* Flips the drawing so it points left */
            animation-name: swim-left-rev;
        }
        @keyframes swim-left-rev {
            0% { transform: translateX(100vw) scaleX(-1); }
            100% { transform: translateX(-100vw) scaleX(-1); }
        }

        /* And fish 3 needs to swim right */
        .fish:nth-child(3) {
            animation-name: swim-right-rev;
        }
        @keyframes swim-right-rev {
            0% { transform: translateX(-100vw) scaleX(1); }
            100% { transform: translateX(100vw) scaleX(1); }
        }


    </style>
</head>
<body>

    <!-- Bubbles -->
    <div class="bubble" style="width: 15px; height: 15px; left: 10%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 10px; height: 10px; left: 65%; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 30%; animation-delay: 6s;"></div>
    <div class="bubble" style="width: 12px; height: 12px; left: 90%; animation-delay: 1s;"></div>

    <!-- Fish 1: Coral Fish (Swims Right) -->
    <div class="fish">
        <div class="body-main"></div>
        <div class="tail"></div>
        <div class="eye"></div>
    </div>

    <!-- Fish 2: Tropical Blue Fish (Swims Left) -->
    <div class="fish">
        <div class="body-main"></div>
        <div class="tail"></div>
        <div class="eye"></div>
    </div>

    <!-- Fish 3: Orange Yellow Fish (Swims Right) -->
    <div class="fish">
        <div class="body-main"></div>
        <div class="tail"></div>
        <div class="eye"></div>
    </div>

</body>
</html>
