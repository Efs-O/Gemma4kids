<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Burst Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a002a; /* Deep indigo night sky */
            cursor: default;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const gravity = 0.03;
        const friction = 0.99;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle class definition
        class Particle {
            constructor(x, y, hue, velocity, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.color = `hsl(${hue}, 100%, 80%)`;
                this.radius = Math.random() * 2 + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.01 + 0.015;
                this.lifetime = 100 + Math.random() * 100;
            }

            update() {
                this.vy += gravity * 0.5; // Simulate gravity pull on fading particles
                this.vx *= friction;
                this.vy *= friction;

                this.x += this.vx;
                this.y += this.vy;

                this.alpha -= this.decay * 0.05;
                this.radius *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color.replace('80%', `${Math.max(0, this.alpha * 100)}%`);
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Firework structure to manage the initial launch and burst
        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = Math.random() * 360;
                this.distance = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.speed = Math.random() * 2 + 3;
                this.isExploded = false;
                this.particles = [];
            }

            update() {
                if (this.isExploded) return;

                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const currentDistance = Math.hypot(dx, dy);

                if (currentDistance < this.speed || this.y > canvas.height) {
                    this.explode();
                } else {
                    const moveX = (dx / currentDistance) * this.speed;
                    const moveY = (dy / currentDistance) * this.speed;
                    
                    this.x += moveX;
                    this.y += moveY;
                    this.distanceTraveled += Math.hypot(moveX, moveY);
                }
            }

            draw() {
                if (this.isExploded) return;
                ctx.fillStyle = `hsl(${this.color}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            explode() {
                this.isExploded = true;
                const particleCount = 80 + Math.floor(Math.random() * 50);
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const velocity = Math.random() * 5 + 1;
                    particles.push(new Particle(this.x, this.y, this.color, velocity, angle));
                }
            }
        }

        // --- Animation Loop Functions ---

        function createBurst(x, y) {
            const numFireworks = Math.floor(Math.random() * 2) + 1; // Launch 1 or 2 rockets
            const fireworks = [];
            
            for (let i = 0; i < numFireworks; i++) {
                // Stagger targets slightly for a richer visual
                const targetX = x + (Math.random() - 0.5) * 100;
                const targetY = y - (Math.random() * 150 + 50); // Explode higher up
                fireworks.push(new Firework(canvas.width / 2, canvas.height, targetX, targetY));
            }
            return fireworks;
        }
        
        let activeFireworks = [];
        let animationFrameId;

        function animate() {
            // Fade the background slightly instead of clearing completely for trails
            ctx.fillStyle = 'rgba(10, 0, 42, 0.1)'; // Matches background color but faded
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Update and Draw Fireworks (Rockets in flight)
            for (let i = activeFireworks.length - 1; i >= 0; i--) {
                const fw = activeFireworks[i];
                fw.update();
                fw.draw();

                if (fw.isExploded) {
                    activeFireworks.splice(i, 1);
                }
            }

            // 2. Update and Draw Particles (The explosion itself)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.alpha <= 0.01 || p.radius < 0.5) {
                    particles.splice(i, 1);
                }
            }

            // 3. Randomly launch new fireworks over time
            if (Math.random() < 0.05) { // ~5% chance per frame to launch something
                const x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                const y = canvas.height; // Launch from bottom
                
                let newFireworks = createBurst(x, y);
                activeFireworks.push(...newFireworks);
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // --- Initialization and Resize ---
        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', handleResize);

        // Initial setup and start loop
        handleResize();
        animate();

    </script>
</body>
</html>
