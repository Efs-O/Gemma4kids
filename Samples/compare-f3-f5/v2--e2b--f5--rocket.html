<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Rocket Launch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #00001a; /* Deep space blue/black */
            overflow: hidden; /* Hide scrollbars caused by stars */
            height: 100vh;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* --- Star Field Background --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                /* Creating a dense field of randomly placed stars using CSS gradients/shapes */
                radial-gradient(circle at 10% 20%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 50% 30%, #ffcc00 1px, transparent 1px),
                radial-gradient(circle at 80% 50%, #00ffff 1px, transparent 1px),
                radial-gradient(circle at 25% 70%, #ff00ff 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0;
            animation: twinkle 30s linear infinite;
        }

        @keyframes twinkle {
            0% { background-position: 0 0; }
            100% { background-position: 10000px 10000px; }
        }

        /* --- Rocket Styling --- */
        .rocket {
            position: absolute;
            bottom: 50px; /* Start position near the bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 150px;
            background: linear-gradient(to top, #ff4500, #ff8c00); /* Vivid orange/red gradient */
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8), 0 0 60px rgba(255, 140, 0, 0.5);
            z-index: 10;
            
            /* Animation Definition */
            animation: launchSequence 4s ease-out forwards;
        }

        @keyframes launchSequence {
            0% {
                bottom: 50px;
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            5% {
                bottom: 100px;
                transform: translateX(-50%) scale(1.05);
                box-shadow: 0 0 50px rgba(255, 255, 255, 1);
            }
            95% {
                bottom: 10%; /* Reaches near the top */
                transform: translateX(-50%) scale(1.1);
                opacity: 1;
            }
            100% {
                bottom: 5%;
                transform: translateX(-50%) scale(1.2);
                opacity: 0; /* Fades slightly as it reaches peak velocity */
            }
        }

        /* --- Smoke/Trail Effect (Optional visual flair) --- */
        .smoke {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100px;
            background: rgba(255, 165, 0, 0.7); /* Orange smoke */
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.9);
            opacity: 0;
            animation: smokeRise 4s ease-out forwards;
            z-index: 5;
        }

        @keyframes smokeRise {
            0% {
                bottom: 5%;
                opacity: 0.5;
            }
            100% {
                bottom: 15%;
                opacity: 0.1;
            }
        }

    </style>
</head>
<body>

    <!-- Background Stars Layer -->
    <div class="stars"></div>

    <!-- Rocket Body -->
    <div class="rocket"></div>

    <!-- Smoke Trail (Appears simultaneously) -->
    <div class="smoke"></div>

</body>
</html>
