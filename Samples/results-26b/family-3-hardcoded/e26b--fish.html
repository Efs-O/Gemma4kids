<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-UTF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Underwater World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #001f3f, #0074D9, #001f3        f);
            background-attachment: fixed;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="seaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('seaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let fishes = [];
        let bubbles = [];

        function init() {
            resize();
            createScene();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Fish {
            constructor(color, size, speed, yRange) {
                this.color = color;
                this.size = size;
                this.speed = speed;
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.yRange = yRange;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.tailWag = 0;
                this.eyeSize = size * 0.15;
            }

            update() {
                this.x += this.speed * this.direction;
                
                // Gentle vertical swimming motion
                this.y += Math.sin(this.x * 0.02) * 0.5;

                // Tail wagging logic
                this.tailWag = Math.sin(Date.now() * 0.01) * 0.5;

                // Wrap around screen
                if (this.direction === 1 && this.x > width + 100) {
                    this.x = -100;
                } else if (this.direction === -1 && this.x < -100) {
                    this.x = width + 100;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.direction === -1) {
                    ctx.scale(-1, 1);
                }

                // Tail
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.moveTo(-this.size * 0.8, 0);
                ctx.lineTo(-this.size * 1.5, -this.size * 0.6 + this.tailWag * 10);
                ctx.lineTo(-this.size * 1.5, this.size * 0.6 + this.tailWag * 10);
                ctx.fill();

                // Body (Oval)
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.ellipse(0, 0, this.size, this.size * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Detail/Highlight
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.ellipse(-this.size * 0.3, -this.size * 0.2, this.size * 0.4, this.size * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.beginPath();
                ctx.fillStyle = 'white';
                ctx.arc(this.size * 0.5, -this.size * 0.1, this.eyeSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.fillStyle = 'black';
                ctx.arc(this.size * 0.55, -this.size * 0.1, this.eyeSize * 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 50;
                this.radius = Math.random() * 15 + 5;
                this.speed = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.drift = Math.random() * 2 - 1;
            }

            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.y * 0.01) * 0.5 + this.drift;

                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Shine highlight inside bubble
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`;
                ctx.fill();
            }
        }

        function createScene() {
            fishes = [];
            bubbles = [];

            // Fish 1: Vibrant Orange
            fishes.push(new Fish('#FF851B', 60, 2, 100));
            // Fish 2: Neon Pink
            fishes.push(new Fish('#FF4136', 45, 3, 150));
            // Fish 3: Electric Cyan
            fishes.push(new Fish('#7FDBFF', 75, 1.5, 200));
            // Fish 4: Bright Yellow
            fishes.push(new Fish('#FFDC00', 40, 4, 120));

            for (let i = 0; i < 40; i++) {
                bubbles.push(new Bubble());
            }
        }

        function animate() {
            // Create a slight motion blur effect by not clearing fully
            ctx.fillStyle = 'rgba(0, 31, 63, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update and Draw Bubbles
            bubbles.forEach(bubble => {
                bubble.update();
                bubble.draw();
            });

            // Update and Draw Fish
            fishes.forEach(fish => {
                fish.update();
                fish.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createScene();
        });

        init();
    </script>
</body>
</html>
