<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clown Juggling Show</title>
    <style>
        :root {
            /* Vivid Clown Palette */
            --color-background: #ff69b4; /* Hot Pink */
            --color-primary-accent: #ffd700; /* Gold/Yellow */
            --color-secondary-accent: #00ffff; /* Cyan */
            --color-red: #ff4500; /* Vivid Orange-Red */
            --color-green: #32cd32; /* Lime Green */
            --color-blue: #1e90ff; /* Dodger Blue */
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--color-background);
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Funky font feel */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* Stage Area - Defines where the clown is 'performing' */
        .stage-container {
            width: 90%;
            height: 90%;
            max-width: 1000px;
            max-height: 800px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.1) 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Ground level for balls to appear */
            padding-bottom: 50px;
            border: 8px dashed rgba(255, 255, 255, 0.5);
        }

        .clown-emoji {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            animation: bounceBobbing 1.5s infinite alternate;
            z-index: 10;
            text-shadow: 0 0 15px var(--color-primary-accent);
        }

        /* Keyframe for the clown 'bobbing' */
        @keyframes bounceBobbing {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-10px); }
        }

        /* Ball Styling */
        .juggling-ball {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--initial-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s linear; /* Smooth visual updates */
            z-index: 5;
            /* Initial position to ensure visibility */
            opacity: 0; 
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <div class="clown-emoji">🤡</div>
        <!-- Balls will be dynamically inserted here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stageContainer = document.querySelector('.stage-container');
            const numBalls = 6;
            let balls = [];

            // Vivid color definitions for the balls
            const colors = [
                '#ff0000', // Bright Red
                '#ffff00', // Vivid Yellow
                '#00cc00', // Bright Green
                '#0000ff', // Bright Blue
                '#ff69b4', // Pink
                '#ffa500'  // Orange
            ];

            // --- Ball Object Structure ---
            class JugglingBall {
                constructor(index) {
                    this.element = document.createElement('div');
                    this.element.className = 'juggling-ball';
                    this.element.style.setProperty('--initial-color', colors[index % colors.length]);
                    this.element.style.backgroundColor = colors[index % colors.length];
                    this.element.style.left = '50%';
                    this.element.style.top = '100px'; // Starting height from the bottom
                    stageContainer.appendChild(this.element);

                    // Physics tracking variables
                    this.x = stageContainer.clientWidth / 2;
                    this.y = stageContainer.clientHeight - 100; // Near the bottom of the container
                    this.vx = (Math.random() - 0.5) * 5; // Initial horizontal velocity
                    this.vy = 0; // Initial vertical velocity
                    this.gravity = 0.8;
                    this.isAirborne = true;
                    this.timeOffset = Math.random() * Math.PI * 2;
                }

                // Updates the ball's position based on physics simulation
                updatePosition(deltaTime) {
                    // 1. Apply Gravity (affects vertical velocity)
                    this.vy += this.gravity * (deltaTime / 16); // Normalize gravity by typical frame rate
                    
                    // 2. Update Position (Basic kinematics: P_new = P_old + V * t)
                    this.x += this.vx * (deltaTime / 16);
                    this.y += this.vy * (deltaTime / 16);

                    // 3. Collision Detection (Ground Bounce)
                    const groundLevel = stageContainer.clientHeight - 40; // Ball radius offset
                    if (this.y + 40 > groundLevel) {
                        this.y = groundLevel - 40; // Clamp to ground
                        this.vy *= -0.8; // Bounce: Reverse velocity and lose 20% energy
                        this.vx *= 0.98; // Slight air resistance on horizontal bounce
                        this.gravity = 0.8 * 0.99; // Slow down gravity effect slightly after bounce
                        this.isAirborne = false;
                    }
                    
                    // 4. Boundary Checks (Keep them somewhat contained)
                    if (this.x < 10 || this.x > stageContainer.clientWidth - 10) {
                        this.vx *= -0.9; // Bounce off side walls
                        this.x = Math.max(10, Math.min(stageContainer.clientWidth - 10, this.x));
                    }


                    // Apply the calculated position to the DOM element
                    this.element.style.transform = `translate(${this.x}px, ${this.y}px) translate(-50%, -50%)`;
                    this.element.style.opacity = 1;
                }

                draw() {
                    // Re-set the initial velocity slightly to keep the juggling look active
                    // Simulate a repeating, patterned trajectory rather than just pure gravity simulation
                    this.vx = Math.cos(this.timeOffset) * 15 + (Math.sin(this.timeOffset * 0.5) * 5);
                    this.vy = Math.sin(this.timeOffset * 0.3) * 15;
                    
                    // Update time offset for the next cycle
                    this.timeOffset += 0.1;
                }
            }

            // --- Initialization ---
            function initializeBalls() {
                for (let i = 0; i < numBalls; i++) {
                    balls.push(new JugglingBall(i));
                }
            }

            // --- Animation Loop ---
            let lastTime = 0;
            const GRAVITY_CONSTANT = 0.8; // Global gravity factor for visual consistency

            function animate(currentTime) {
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                // 1. Update and Draw all balls
                balls.forEach((ball, index) => {
                    // A simple way to make them look like they are "juggling" is to override
                    // pure physics with a wave pattern that resets periodically.
                    
                    ball.draw(); 
                    ball.updatePosition(deltaTime);
                });

                // 2. Loop
                requestAnimationFrame(animate);
            }

            // Start the Show
            initializeBalls();
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
