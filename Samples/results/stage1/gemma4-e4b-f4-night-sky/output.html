<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Night Sky Animation</title>
    <style>
        /* Global Setup & Background */
        :root {
            --deep-space-blue: #03001a;
            --nebula-pink: #ff0077;
            --star-color: #ffffff;
            --shooting-star-color: #00ffff;
        }

        body {
            background-color: var(--deep-space-blue);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            font-family: sans-serif;
        }

        /* --- Background Swirling Nebula Effect (Background Layer) --- */
        .nebula {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 0, 119, 0.1) 0%, transparent 30%),
                        radial-gradient(circle at 10% 100%, rgba(0, 255, 255, 0.1) 0%, transparent 40%);
            animation: rotateNebula 60s linear infinite;
            z-index: 1;
        }

        @keyframes rotateNebula {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Twinkling Stars (Midground Layer) --- */
        .star {
            position: absolute;
            background-color: var(--star-color);
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            z-index: 5;
            opacity: 0.8;
            box-shadow: 0 0 2px 1px var(--star-color);
        }

        @keyframes twinkle {
            0% { opacity: 0.4; transform: scale(0.9); box-shadow: 0 0 1px 0 rgba(255, 255, 255, 0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.9); }
            100% { opacity: 0.5; transform: scale(1); box-shadow: 0 0 2px 1px rgba(255, 255, 255, 0.7); }
        }

        /* --- Shooting Stars (Foreground Layer) --- */
        .shooting-star {
            position: absolute;
            width: 0px; /* Will be animated by setting width in keyframes */
            height: 2px;
            background: linear-gradient(to right, var(--shooting-star-color), #ffcc00);
            box-shadow: 0 0 5px 1px var(--shooting-star-color);
            z-index: 10;
            animation-timing-function: linear;
        }

        /* Keyframe for the trail effect */
        @keyframes shoot {
            0% {
                transform: translate(-50%, -50%) scaleX(0);
                opacity: 1;
                width: 0px;
            }
            10% {
                transform: translate(-50%, -50%) scaleX(20px);
                width: 3px;
            }
            100% {
                transform: translate(110vw, -20vh) scaleX(100px); /* Moves far off screen right and slightly down */
                opacity: 0;
                width: 10px;
            }
        }

        /* Container styling to ensure stars and effects are correctly positioned */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

    </style>
</head>
<body>

    <div class="scene-container">
        <!-- Background Swirl -->
        <div class="nebula"></div>

        <!-- Stars will be dynamically inserted here or hardcoded -->
        <div id="star-container">
            <!-- Example Stars (varying initial styles for depth/timing) -->
            <div class="star" style="top: 10%; left: 20%; --duration: 4s; animation-delay: 0s;"></div>
            <div class="star" style="top: 50%; left: 70%; --duration: 3.5s; animation-delay: 1s;"></div>
            <div class="star" style="top: 80%; left: 40%; --duration: 5s; animation-delay: 2.5s;"></div>
            <div class="star" style="top: 25%; left: 90%; --duration: 3s; animation-delay: 0.5s;"></div>
            <div class="star" style="top: 65%; left: 15%; --duration: 4.5s; animation-delay: 1.5s;"></div>
        </div>

        <!-- Shooting Stars will be dynamically inserted/animated via JS -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const starContainer = document.getElementById('star-container');
            const sceneContainer = document.querySelector('.scene-container');
            const numStars = 50;

            // 1. Generate many randomly positioned twinkling stars
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random size (1px to 3px)
                const size = Math.random() * 2 + 1; 
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random position across the viewport
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;

                // Random animation timing variation
                const duration = Math.random() * 3 + 2; // 2s to 5s
                const delay = Math.random() * 3;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.animationDelay = `${delay}s`;

                starContainer.appendChild(star);
            }

            // 2. Simulate Shooting Stars (Foreground Action)
            const numShootingStars = 7;

            function createShootingStar() {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                
                // Random starting position (Ensuring it starts far left and high up)
                const startX = Math.random() * 10 + 1; // 1% to 11% across viewport
                const startY = Math.random() * 10 + 1; // 1% to 11% down viewport

                star.style.left = `${startX}vw`;
                star.style.top = `${startY}vh`;

                // Apply the animation with random timing/duration variations
                const duration = Math.random() * 7 + 5; // 5s to 12s travel time
                const delay = Math.random() * 2;
                
                star.style.animation = `shoot linear ${duration}s forwards`;
                star.style.animationDelay = `${delay}s`;
                star.style.transform = `translate(-50%, -50%) scaleX(0)`; // Ensure start state matches keyframe start

                sceneContainer.appendChild(star);

                // Clean up the element after its animation cycle completes
                setTimeout(() => {
                    star.remove();
                }, (delay + duration) * 1000 + 100); 
            }

            // Launch stars at staggered intervals
            let starLaunchInterval = setInterval(() => {
                createShootingStar();
            }, 1200); // Launch a new star every 1.2 seconds

            // Stop launching stars after a while to prevent memory build up, or just let it run.
            // For a continuous simulation, we leave it running.
            
        });
    </script>

</body>
</html>
