<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flying Butterflies and Flowers</title>
    <style>
        /* Define some nice colors and variables */
        :root {
            --sky-blue: #87CEEB;
            --grass-green: #3CB371;
            --flower-red: #FF6347;
            --flower-yellow: #FFD700;
            --butterfly-color1: #7C3AED; /* Purple */
            --butterfly-color2: #10B981; /* Emerald Green */
            --butterfly-color3: #FFD700; /* Gold */
            --speed: 5s;
        }

        body {
            background: linear-gradient(to bottom, #1a1a2e, #16213e); /* Night sky/deep blue gradient */
            color: white;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Hide anything that flies off-screen */
            font-family: 'Comic Sans MS', cursive;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- Flower Styling --- */
        .flower {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--flower-yellow);
            border: 3px solid #333;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.7);
        }

        .flower::before {
            content: '🌸'; /* Adding a cute flower symbol */
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
        }

        /* Create a few specific flower placements */
        .flower:nth-child(1) {
            top: 60%;
            left: 10%;
            background-color: var(--flower-red);
        }
        .flower:nth-child(2) {
            top: 30%;
            left: 70%;
            background-color: var(--flower-yellow);
        }
        .flower:nth-child(3) {
            top: 85%;
            left: 40%;
            background-color: var(--flower-red);
        }

        /* --- Butterfly Styling --- */
        .butterfly {
            position: absolute;
            width: 40px;
            height: 30px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* Basic butterfly shape */
            animation: fly --speed infinite linear;
            top: 10%;
            left: 10%;
        }

        .butterfly::before {
            content: '🦋'; /* Adding a cute butterfly symbol */
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 25px;
        }

        /* Apply unique colors and starting positions for each butterfly */
        .butterfly:nth-child(1) {
            background-color: var(--butterfly-color1);
            animation-duration: 6s;
            animation-delay: 0s;
            top: 20%; left: 5%;
        }
        .butterfly:nth-child(2) {
            background-color: var(--butterfly-color2);
            animation-duration: 4s;
            animation-delay: 1s;
            top: 50%; left: 30%;
        }
        .butterfly:nth-child(3) {
            background-color: var(--butterfly-color3);
            animation-duration: 7s;
            animation-delay: 2s;
            top: 75%; left: 60%;
        }
        .butterfly:nth-child(4) {
            background-color: var(--butterfly-color1);
            animation-duration: 3.5s;
            animation-delay: 3s;
            top: 15%; left: 80%;
        }
        .butterfly:nth-child(5) {
            background-color: var(--butterfly-color2);
            animation-duration: 5.5s;
            animation-delay: 4s;
            top: 40%; left: 15%;
        }


        /* Keyframes for Flying Motion */
        @keyframes fly {
            0% {
                transform: translate(0, 0);
                left: 0;
                top: 0;
            }
            25% {
                transform: translate(10vw, -10vh);
            }
            50% {
                transform: translate(-5vw, 0);
            }
            75% {
                transform: translate(15vw, 10vh);
            }
            100% {
                transform: translate(0, 0);
                left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Flowers -->
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>

        <!-- Butterflies -->
        <div class="butterfly"></div>
        <div class="butterfly"></div>
        <div class="butterfly"></div>
        <div class="butterfly"></div>
        <div class="butterfly"></div>
    </div>

    <script>
        // JavaScript to dynamically create more butterflies for extra fun!
        const scene = document.querySelector('.scene');
        const butterflyColors = [
            '#FF6347', // Tomato
            '#46B450', // Green
            '#4169E1', // Royal Blue
            '#FFC0CB', // Pink
            '#FFD700'  // Gold
        ];

        function createButterfly(index) {
            const butterfly = document.createElement('div');
            butterfly.classList.add('butterfly');

            // Assign a random color
            const randomColor = butterflyColors[Math.floor(Math.random() * butterflyColors.length)];
            butterfly.style.backgroundColor = randomColor;

            // Random starting position (spread across the screen)
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;

            butterfly.style.top = `${startY}vh`;
            butterfly.style.left = `${startX}vw`;

            // Random animation speed and delay for variety
            const duration = (Math.random() * 4) + 3; // 3s to 7s
            const delay = Math.random() * 4;
            butterfly.style.animationDuration = `${duration}s`;
            butterfly.style.animationDelay = `${delay}s`;

            scene.appendChild(butterfly);
        }

        // Create 10 butterflies when the page loads to make the scene busy!
        for (let i = 0; i < 10; i++) {
            createButterfly(i);
        }
    </script>
</body>
</html>
