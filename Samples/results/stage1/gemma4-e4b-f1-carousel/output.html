<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Spinning Carousel</title>
    <style>
        /* --- Global & Body Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Hides the excess spinning content */
            background-color: #1a0025; /* Deep space background */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Carousel Container --- */
        .carousel-wrapper {
            width: 90vw;
            height: 70vh;
            position: relative;
            display: flex;
            justify-content: space-between; /* Distributes the horses */
            align-items: center;
            transform-style: preserve-3d; /* Crucial for 3D rotation */
            
            /* The core animation: spins continuously around the Y-axis */
            animation: spin 40s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        /* --- Individual Horse Styling --- */
        .horse {
            /* Basic styling for the 'horse' representation */
            flex-shrink: 0; /* Prevents horses from shrinking */
            width: 18vw; 
            height: 80%;
            min-width: 150px;
            background-color: #333; /* Base color */
            border-radius: 20px 20px 10px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.3s;
            border: 5px solid rgba(255, 255, 255, 0.1);
        }

        .horse:hover {
            transform: scale(1.05) translateY(-10px); /* Slight lift effect on hover */
            z-index: 10;
        }

        /* --- Horse Body Decoration (Making it look more vibrant) --- */
        .horse::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 0 0 15px 15px;
        }

        /* Specific Vivid Color Overrides for each 'horse' */
        .horse-1 { background-color: #ff69b4; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.7); }
        .horse-2 { background-color: #00ffff; box-shadow: 0 10px 30px rgba(0, 255, 255, 0.7); }
        .horse-3 { background-color: #ff7f00; box-shadow: 0 10px 30px rgba(255, 127, 0, 0.7); }
        .horse-4 { background-color: #9932cc; box-shadow: 0 10px 30px rgba(153, 50, 204, 0.7); }
        .horse-5 { background-color: #32cd32; box-shadow: 0 10px 30px rgba(50, 205, 50, 0.7); }
        .horse-6 { background-color: #ff4500; box-shadow: 0 10px 30px rgba(255, 69, 0, 0.7); }
        
        /* Adding stylized "mane" and "tail" accents */
        .horse::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 5%;
            width: 15%;
            height: 30%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            transform: rotate(-20deg);
        }

    </style>
</head>
<body>

    <div class="carousel-wrapper">
        <!-- We repeat the horses to ensure the carousel doesn't end abruptly -->
        <div class="horse horse-1"></div>
        <div class="horse horse-2"></div>
        <div class="horse horse-3"></div>
        <div class="horse horse-4"></div>
        <div class="horse horse-5"></div>
        <div class="horse horse-6"></div>

        <!-- Repeat for continuous visual flow -->
        <div class="horse horse-1"></div>
        <div class="horse horse-2"></div>
        <div class="horse horse-3"></div>
        <div class="horse horse-4"></div>
        <div class="horse horse-5"></div>
        <div class="horse horse-6"></div>
    </div>

</body>
</html>
