<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Fluttering Butterflies</title>
    <style>
        :root {
            --bg-color: #a8d5ff; /* Sky blue background */
            --shadow-color: rgba(0, 0, 0, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Keep the action contained */
            background: linear-gradient(135deg, #a8d5ff 0%, #ffcc00 100%); /* Vivid gradient background */
            position: relative;
            font-family: sans-serif;
        }

        /* ========================================
           FLOWER STYLING (Static Anchors)
           ======================================== */
        .flower {
            position: absolute;
            opacity: 0.95;
            z-index: 10;
            animation: pulse 4s infinite ease-in-out;
        }

        .flower-stem {
            width: 5px;
            height: 80px;
            background-color: #2e8b57; /* Sea Green */
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .petal {
            position: absolute;
            background-color: #ff69b4; /* Hot Pink */
            border-radius: 50%;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        /* Flower 1: Top Left */
        #flower1 { top: 20%; left: 10%; }
        #flower1 .petal:nth-child(1) { width: 40px; height: 30px; top: 0px; left: 15px; background-color: #ff1493; }
        #flower1 .petal:nth-child(2) { width: 35px; height: 35px; top: 5px; left: 20px; background-color: #ff69b4; }
        #flower1 .petal:nth-child(3) { width: 45px; height: 30px; top: 10px; left: 10px; background-color: #e91e63; }
        #flower1 .center { width: 20px; height: 20px; background-color: #ffd700; border-radius: 50%; top: 5px; left: 15px;}

        /* Flower 2: Center Right */
        #flower2 { top: 40%; left: 65%; }
        #flower2 .petal:nth-child(1) { width: 50px; height: 40px; top: 0px; left: 10px; background-color: #ff8c00; }
        #flower2 .petal:nth-child(2) { width: 40px; height: 40px; top: 10px; left: 25px; background-color: #ffa500; }
        #flower2 .petal:nth-child(3) { width: 55px; height: 35px; top: 5px; left: 0px; background-color: #ff4500; }
        #flower2 .center { width: 25px; height: 25px; background-color: #ffdb58; border-radius: 50%; top: 8px; left: 20px;}

        /* Flower 3: Bottom Left */
        #flower3 { top: 70%; left: 5%; }
        #flower3 .petal:nth-child(1) { width: 30px; height: 30px; top: 0px; left: 0px; background-color: #9932cc; }
        #flower3 .petal:nth-child(2) { width: 40px; height: 40px; top: 5px; left: 25px; background-color: #ba55d3; }
        #flower3 .petal:nth-child(3) { width: 35px; height: 35px; top: 10px; left: 10px; background-color: #8a2be2; }
        #flower3 .center { width: 18px; height: 18px; background-color: #ffcc00; border-radius: 50%; top: 5px; left: 15px;}

        /* Flower 4: Large, Far Right */
        #flower4 { top: 30%; left: 90%; }
        #flower4 .petal:nth-child(1) { width: 60px; height: 45px; top: 0px; left: 0px; background-color: #ff6347; }
        #flower4 .petal:nth-child(2) { width: 50px; height: 40px; top: 10px; left: 15px; background-color: #ff4500; }
        #flower4 .petal:nth-child(3) { width: 55px; height: 35px; top: 5px; left: 0px; background-color: #ff7f50; }
        #flower4 .center { width: 30px; height: 30px; background-color: #ffdb58; border-radius: 50%; top: 10px; left: 25px;}


        /* ========================================
           BUTTERFLY STYLING & ANIMATION
           ======================================== */
        .butterfly {
            position: absolute;
            width: 60px;
            height: 40px;
            z-index: 20;
            pointer-events: none; /* Ensures it doesn't block clicks */
            animation: fly-path linear infinite;
            opacity: 0.9;
            transform-origin: center center;
        }

        /* Butterfly Wings Structure */
        .wing {
            position: absolute;
            width: 100%;
            height: 50%;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.5) 0%, transparent 100%);
            border-radius: 5px 5px 0 0;
            transform-style: preserve-3d;
            animation: flap linear infinite;
        }
        .wing-top {
            top: 0;
            transform: rotateX(0deg) scaleY(1);
            animation-delay: 0s;
        }
        .wing-bottom {
            top: 50%;
            transform: rotateX(0deg) scaleY(1);
            animation-delay: 0.1s;
        }

        /* Keyframe Animations */

        /* 1. Wing Flapping Animation */
        @keyframes flap {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(45deg) scale(1.1); }
            100% { transform: rotateY(0deg) scale(1); }
        }

        /* 2. Butterfly Path Animation (Simulates flight) */
        @keyframes fly-path {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { transform: translate(var(--x-start), var(--y-start)) scale(1.1); opacity: 0.9; }
            80% { transform: translate(calc(var(--x-end) + 5vw), calc(var(--y-end) + 5vh)) scale(1.05); opacity: 1; }
            100% { transform: translate(var(--x-end), var(--y-end)) scale(1); opacity: 0; }
        }

        /* 3. Flower Pulse Animation */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

    </style>
</head>
<body>

    <!-- ========================================
         FLOWERS (Static Background Elements)
         ======================================== -->
    <div class="flower" id="flower1">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
        <div class="flower-stem"></div>
    </div>

    <div class="flower" id="flower2">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
        <div class="flower-stem"></div>
    </div>

    <div class="flower" id="flower3">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
        <div class="flower-stem"></div>
    </div>

    <div class="flower" id="flower4">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
        <div class="flower-stem"></div>
    </div>


    <!-- ========================================
         BUTTERFLIES (Animated Elements)
         ======================================== -->

    <!-- Butterfly 1: Bright Yellow/Cyan - Flying across the top -->
    <div class="butterfly" style="left: 5%; top: 10%; width: 50px; height: 35px;"
        style="--x-start: 0%; --y-start: 10%; --x-end: 80%; --y-end: 5%;">
        <div class="wing wing-top" style="background: linear-gradient(120deg, rgba(255, 255, 255, 0.7) 0%, rgba(173, 216, 230, 0.4) 100%);"></div>
        <div class="wing wing-bottom" style="background: linear-gradient(120deg, rgba(255, 255, 255, 0.7) 0%, rgba(173, 216, 230, 0.4) 100%);"></div>
    </div>

    <!-- Butterfly 2: Magenta/Orange - Circling the center -->
    <div class="butterfly" style="left: 40%; top: 30%; width: 60px; height: 40px;"
        style="--x-start: 10%; --y-start: 30%; --x-end: 70%; --y-end: 45%;">
        <div class="wing wing-top" style="background: linear-gradient(120deg, rgba(255, 105, 180, 0.7) 0%, rgba(255, 140, 0, 0.4) 100%);"></div>
        <div class="wing wing-bottom" style="background: linear-gradient(120deg, rgba(255, 105, 180, 0.7) 0%, rgba(255, 140, 0, 0.4) 100%);"></div>
    </div>

    <!-- Butterfly 3: Electric Blue/Yellow - Low and fast -->
    <div class="butterfly" style="left: 75%; top: 60%; width: 55px; height: 38px;"
        style="--x-start: 80%; --y-start: 55%; --x-end: 10%; --y-end: 75%;">
        <div class="wing wing-top" style="background: linear-gradient(120deg, rgba(173, 216, 230, 0.7) 0%, rgba(255, 215, 0, 0.4) 100%);"></div>
        <div class="wing wing-bottom" style="background: linear-gradient(120deg, rgba(173, 216, 230, 0.7) 0%, rgba(255, 215, 0, 0.4) 100%);"></div>
    </div>

    <!-- Butterfly 4: Red/Purple - Higher altitude sweep -->
    <div class="butterfly" style="left: 20%; top: 15%; width: 70px; height: 45px;"
        style="--x-start: 5%; --y-start: 15%; --x-end: 95%; --y-end: 25%;">
        <div class="wing wing-top" style="background: linear-gradient(120deg, rgba(224, 10, 150, 0.7) 0%, rgba(128, 0, 128, 0.4) 100%);"></div>
        <div class="wing wing-bottom" style="background: linear-gradient(120deg, rgba(224, 10, 150, 0.7) 0%, rgba(128, 0, 128, 0.4) 100%);"></div>
    </div>


    <script>
        // JavaScript to reset butterfly positions periodically, giving the illusion of endless flying
        const butterflies = document.querySelectorAll('.butterfly');

        function resetAnimation() {
            butterflies.forEach((butterfly, index) => {
                // Calculate new random paths
                const newXStart = Math.random() * 10 + 5; // 5% to 15% start x
                const newYStart = Math.random() * 30 + 10; // 10% to 40% start y
                const newXEnd = Math.random() * 90 + 10; // 10% to 100% end x
                const newYEnd = Math.random() * 40 + 20; // 20% to 60% end y

                // Set the custom CSS properties for the next cycle
                butterfly.style.setProperty('--x-start', newXStart + '%');
                butterfly.style.setProperty('--y-start', newYStart + '%');
                butterfly.style.setProperty('--x-end', newXEnd + '%');
                butterfly.style.setProperty('--y-end', newYEnd + '%');
                
                // Increase the animation duration slightly to look more natural
                const duration = Math.random() * 15 + 15; // 15s to 30s
                butterfly.style.animationDuration = `${duration}s`;

                // Reset the animation start point immediately
                butterfly.style.animationPlayState = 'paused';
                setTimeout(() => {
                     butterfly.style.animationPlayState = 'running';
                }, 100);
            });
        }

        // Reset all animations every 20 seconds
        setInterval(resetAnimation, 20000);
    </script>
</body>
</html>
