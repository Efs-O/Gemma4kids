<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Bouncing Ball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a1a; /* Deep space background */
            overflow: hidden; /* Hide scrollbars */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ball {
            width: 80px;
            height: 80px;
            background-color: #ff00ff; /* Vivid Magenta */
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; /* Neon glow */
            animation: bounce 1.5s infinite ease-in-out;
        }

        /* Define the bouncing motion */
        @keyframes bounce {
            0% {
                top: 10px; /* Start near the top */
                animation-timing-function: ease-out;
            }
            40% {
                top: 80%; /* Hit the bottom */
                animation-timing-function: ease-in;
            }
            60% {
                top: 10px; /* Bounce back up */
                animation-timing-function: ease-out;
            }
            100% {
                top: 10px;
                animation-timing-function: ease-in;
            }
        }
    </style>
</head>
<body>

    <div class="ball"></div>

</body>
</html>
