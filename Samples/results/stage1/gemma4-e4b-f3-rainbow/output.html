<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Rain Rainbow Animation</title>
    <style>
        /* Set the overall scene and background (Bright post-rain sky) */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #4682B4, #2F4F4F); /* Bright Sky to deeper, wet ground tone */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Container for all rainbow layers */
        .rainbow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Start the rainbow near the horizon line */
            z-index: 10;
        }

        /* Individual arc layer styling */
        .arc {
            position: absolute;
            width: 100%;
            height: 150px; /* Height of the visible arc */
            border-radius: 50% / 100% 100% 0 0; /* Makes it look like an arc segment */
            opacity: 0; /* Start invisible */
            animation: rainbowPulse 8s infinite cubic-bezier(0.1, 1.1, 0.5, 1.1) forwards;
        }

        /* Define the sequence of rainbow colors */
        /* The color stops are adjusted to simulate the natural gradient appearance */
        .arc:nth-child(1) {
            background-color: #FF0000; /* Red */
            transform: translateY(100px) scale(1.1);
            animation-delay: 0s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }
        .arc:nth-child(2) {
            background-color: #FF7F00; /* Orange */
            transform: translateY(110px) scale(1.1);
            animation-delay: 0.5s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }
        .arc:nth-child(3) {
            background-color: #FFFF00; /* Yellow */
            transform: translateY(120px) scale(1.1);
            animation-delay: 1s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }
        .arc:nth-child(4) {
            background-color: #008000; /* Green */
            transform: translateY(130px) scale(1.1);
            animation-delay: 1.5s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }
        .arc:nth-child(5) {
            background-color: #0000FF; /* Blue */
            transform: translateY(140px) scale(1.1);
            animation-delay: 2s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }
        .arc:nth-child(6) {
            background-color: #4B0082; /* Indigo/Violet */
            transform: translateY(150px) scale(1.1);
            animation-delay: 2.5s;
            animation-duration: 10s;
            animation-timing-function: ease-out;
        }

        /* Keyframes for the pulsing/expanding rainbow effect */
        @keyframes rainbowPulse {
            0% {
                opacity: 0.3;
                transform: translateY(var(--initial-y)) scale(0.5);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            50% {
                opacity: 1;
                transform: translateY(calc(var(--initial-y) - 20px)) scale(1.05);
                box-shadow: 0 0 50px var(--arc-color);
            }
            100% {
                opacity: 0.7;
                transform: translateY(calc(var(--initial-y) - 10px)) scale(1.0);
                box-shadow: 0 0 30px var(--arc-color);
            }
        }
        
        /* Applying necessary CSS variables to the arcs for animation */
        .arc:nth-child(1) { --initial-y: 100px; --arc-color: #FF0000; }
        .arc:nth-child(2) { --initial-y: 110px; --arc-color: #FF7F00; }
        .arc:nth-child(3) { --initial-y: 120px; --arc-color: #FFFF00; }
        .arc:nth-child(4) { --initial-y: 130px; --arc-color: #008000; }
        .arc:nth-child(5) { --initial-y: 140px; --arc-color: #0000FF; }
        .arc:nth-child(6) { --initial-y: 150px; --arc-color: #4B0082; }

    </style>
</head>
<body>

    <div class="rainbow-container">
        <!-- 6 Layers to simulate the full visible spectrum -->
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="arc"></div>
    </div>

</body>
</html>
