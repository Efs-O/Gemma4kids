<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Autumn Leaves Fall</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Keeps the falling leaves contained */
            background-color: #a0c4ff; /* Light sky blue background */
            font-family: sans-serif;
        }

        .leaf-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ensures leaves don't interfere with clicks */
        }

        /* Keyframe for falling and drifting */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(20vw) rotate(360deg);
                opacity: 0.7;
            }
        }

        /* Keyframe for fluttering/swaying mid-fall */
        @keyframes flutter {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 10px) rotate(-10deg); }
            50% { transform: translate(-5px, -10px) rotate(10deg); }
            75% { transform: translate(3px, 5px) rotate(-5deg); }
        }


        /* --- Leaf Styling --- */

        /* General leaf base styling */
        .leaf {
            position: absolute;
            width: 60px;
            height: 80px;
            background-size: cover;
            opacity: 0.8;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.2));
            pointer-events: none;
            /* Combine falling motion with slight random floating */
            animation: fall linear infinite, flutter ease-in-out 0.5s infinite alternate;
        }

        /* Red Leaf */
        .leaf.red {
            background: radial-gradient(circle at 50% 50%, #ff4136, #cc0000);
            transform: rotate(-15deg);
            left: 10%;
            top: -10%;
            animation-duration: 12s;
            animation-delay: 0s;
        }
        /* Yellow Leaf */
        .leaf.yellow {
            background: linear-gradient(135deg, #ffdc00, #ffd700);
            width: 50px;
            height: 70px;
            transform: rotate(20deg);
            left: 35%;
            top: -5%;
            animation-duration: 15s;
            animation-delay: -2s;
        }
        /* Orange Leaf */
        .leaf.orange {
            background: radial-gradient(circle, #ff8c00, #ffa500);
            transform: rotate(5deg);
            width: 70px;
            height: 90px;
            left: 65%;
            top: -15%;
            animation-duration: 10s;
            animation-delay: -5s;
        }
        /* Brown Leaf */
        .leaf.brown {
            background: linear-gradient(to bottom right, #8b4513, #a0522d);
            width: 40px;
            height: 60px;
            transform: rotate(45deg);
            left: 90%;
            top: -20%;
            animation-duration: 18s;
            animation-delay: -10s;
        }

        /* Specific placement and staggered timing for density */
        #leaf1 { top: -10%; left: 5%; width: 50px; height: 70px; background: radial-gradient(circle at 50% 50%, #ff4136, #cc0000); animation-duration: 11s; }
        #leaf2 { top: -30%; left: 20%; width: 60px; height: 80px; background: linear-gradient(135deg, #ffdc00, #ffd700); animation-duration: 14s; }
        #leaf3 { top: -5%; left: 50%; width: 70px; height: 90px; background: radial-gradient(circle, #ff8c00, #ffa500); animation-duration: 10s; }
        #leaf4 { top: -25%; left: 80%; width: 40px; height: 60px; background: linear-gradient(to bottom right, #8b4513, #a0522d); animation-duration: 16s; }
        #leaf5 { top: -1%; left: 70%; width: 55px; height: 75px; background: radial-gradient(circle at 50% 50%, #ff4136, #cc0000); animation-duration: 13s; animation-delay: -3s; }

    </style>
</head>
<body>

    <div class="leaf-container">
        <!-- Multiple leaves with varying animation timings and starting positions for realism -->
        <div id="leaf1" class="leaf"></div>
        <div id="leaf2" class="leaf"></div>
        <div id="leaf3" class="leaf"></div>
        <div id="leaf4" class="leaf"></div>
        <div id="leaf5" class="leaf"></div>

        <!-- Adding more elements for continuous effect -->
        <div class="leaf" style="top: -40%; left: 5%; width: 50px; height: 70px; background: radial-gradient(circle at 50% 50%, #ff4136, #cc0000); animation-duration: 15s; animation-delay: -1s;"></div>
        <div class="leaf" style="top: -15%; left: 40%; width: 70px; height: 90px; background: linear-gradient(135deg, #ffdc00, #ffd700); animation-duration: 12s; animation-delay: -5s;"></div>
        <div class="leaf" style="top: -20%; left: 60%; width: 60px; height: 80px; background: radial-gradient(circle, #ff8c00, #ffa500); animation-duration: 14s; animation-delay: -7s;"></div>
        <div class="leaf" style="top: -5%; left: 90%; width: 40px; height: 60px; background: linear-gradient(to bottom right, #8b4513, #a0522d); animation-duration: 18s; animation-delay: -2s;"></div>

    </div>

</body>
</html>
