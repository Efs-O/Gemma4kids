<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twinkling Starfield with Shooting Stars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Vivid deep space background gradient */
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #111827 100%);
            color: white;
        }

        /* Container for all stars and effects */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Individual star styling */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px #aaffff; /* Slight glow */
            opacity: 0;
            animation: twinkle ease-in-out infinite alternate;
        }

        /* Keyframes for twinkling effect */
        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
                box-shadow: 0 0 8px #aaffff, 0 0 4px #ffffff;
            }
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }

        /* Shooting Star Styling */
        .shooting-star {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #fff3b0, #ffdd00, transparent);
            transform: translateZ(0); /* Hardware acceleration */
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 10px #ffdd00;
            animation: shoot linear forwards;
        }

        /* Animation for the shooting star trajectory */
        @keyframes shoot {
            0% {
                transform: translate(-10vw, 0);
                opacity: 1;
            }
            100% {
                transform: translate(110vw, 100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="starfield">
        <!-- Stars will be populated here by JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const starfield = document.getElementById('starfield');
            const starCount = 150;
            const numShootingStars = 3;

            // --- 1. Star Generation (Twinkling Stars) ---
            function generateStars() {
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    // Random positioning across the full viewport
                    const size = Math.random() * 3 + 1; // 1px to 4px
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}vw`;
                    star.style.top = `${Math.random() * 100}vh`;
                    
                    // Randomize animation delay/duration for natural twinkling effect
                    star.style.animationDuration = `${Math.random() * 4 + 3}s`;
                    star.style.animationDelay = `-${Math.random() * 10}s`; // Start slightly faded in

                    starfield.appendChild(star);
                }
            }

            // --- 2. Shooting Star Generation ---
            function createShootingStar() {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                
                // Set starting position off the left edge
                star.style.left = '0%';
                star.style.top = `${Math.random() * 90}vh`;
                
                // Randomize duration and delay
                const duration = Math.random() * 15 + 10; // 10s to 25s long
                const delay = Math.random() * 5; // Stagger start times
                
                star.style.animationDuration = `${duration}s`;
                star.style.animationDelay = `${delay}s`;
                
                starfield.appendChild(star);

                // Cleanup: Remove the star element after its animation finishes
                setTimeout(() => {
                    starfield.removeChild(star);
                }, (duration + 1) * 1000 + 100);
            }

            // --- Initialization ---
            generateStars();

            // Create initial burst of shooting stars immediately
            for (let i = 0; i < numShootingStars; i++) {
                setTimeout(createShootingStar, i * 1000);
            }

            // Loop continuously to generate new shooting stars
            setInterval(() => {
                createShootingStar();
            }, 2000); // Spawn a new shooting star every 2 seconds
        });
    </script>
</body>
</html>
