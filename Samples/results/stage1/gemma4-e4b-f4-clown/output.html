<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clown Juggling Extravaganza</title>
    <style>
        :root {
            --color-primary: #ff6b6b; /* Coral Red */
            --color-secondary: #4ecdc4; /* Teal */
            --color-accent1: #feca57; /* Bright Yellow */
            --color-accent2: #ff9a9e; /* Light Pink */
            --color-accent3: #45bbf3; /* Sky Blue */
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffeb3b, #ff9800, #ffeb3b); /* Bright, candy-colored background */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* For depth effects */
        }

        /* Background Layer - Slow, rolling movement */
        #background-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #ff6b6b,
                #ff6b6b 10px,
                #4ecdc4 10px,
                #4ecdc4 20px
            );
            background-size: 200% 200%;
            animation: backgroundScroll 30s linear infinite;
            z-index: 0;
        }

        @keyframes backgroundScroll {
            from { background-position: 0% 0%; }
            to { background-position: 100% 100%; }
        }

        /* Juggling Area / Midground Styling */
        #juggling-area {
            position: relative;
            z-index: 10;
            width: 90%;
            height: 90%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Clown Placeholder/Handler area */
        .handler {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 20px;
            text-align: center;
            font-family: 'Impact', sans-serif;
            color: #d81b60; /* Bright Magenta */
            text-shadow: 4px 4px 0 #ffeb3b;
            animation: floatHandler 6s ease-in-out infinite;
        }

        @keyframes floatHandler {
            0%, 100% { transform: translate(-50%, 0) scale(1.0); }
            50% { transform: translate(-48%, 5px) scale(1.02); }
        }

        /* Bouncing Ball Styling */
        .ball {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
            opacity: 0; /* Start invisible for animation control */
            z-index: 15;
            animation: bounceCycle linear infinite;
        }

        /* Ball Specific Colors and Initial States */
        #ball1 {
            width: 60px;
            height: 60px;
            background-color: var(--color-accent1); /* Yellow */
            left: 10%;
            top: 15%;
            animation-duration: 2.5s;
            animation-timing-function: cubic-bezier(0.6, -0.2, 0.4, 1.2);
            animation-delay: 0s;
        }

        #ball2 {
            width: 55px;
            height: 55px;
            background-color: var(--color-secondary); /* Teal */
            left: 35%;
            top: 30%;
            animation-duration: 3s;
            animation-timing-function: cubic-bezier(0.7, -0.3, 0.3, 1.3);
            animation-delay: 0.5s;
        }

        #ball3 {
            width: 65px;
            height: 65px;
            background-color: var(--color-primary); /* Coral Red */
            left: 65%;
            top: 20%;
            animation-duration: 2s;
            animation-timing-function: cubic-bezier(0.8, -0.1, 0.2, 1.1);
            animation-delay: 1s;
        }

        #ball4 {
            width: 50px;
            height: 50px;
            background-color: var(--color-accent2); /* Light Pink */
            left: 85%;
            top: 40%;
            animation-duration: 3.5s;
            animation-timing-function: cubic-bezier(0.5, -0.4, 0.5, 1.2);
            animation-delay: 1.5s;
        }

        /* Keyframes defining the bouncing motion (Simulation of continuous arc) */
        @keyframes bounceCycle {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            50% {
                /* Apex position: Moves horizontally and rises */
                transform: translateY(-150px) translateX(calc(var(--dx) * 1.5)) scale(1.1);
                opacity: 1;
            }
            100% {
                /* Returns close to the initial Y position, slightly moved horizontally */
                transform: translateY(0) translateX(calc(var(--dx) * 3)) scale(1);
                opacity: 1;
            }
        }

        /* Adjusting ball keyframes using CSS variables for varied paths */
        /* Note: We redefine the animation properties here to simulate different paths without conflicting delays */

        #ball1 {
            animation-name: bounceCycle;
            /* Custom variables for path definition (simulating an arc across the screen) */
            --dx: 150vw;
        }
        #ball2 {
            animation-name: bounceCycle;
            --dx: -100vw;
            /* We need to adjust the start positions via JS/CSS manipulation if we want them to interact realistically. 
               For pure CSS, we apply the animation to simulate the movement *relative* to its starting point.*/
        }
        #ball3 {
            animation-name: bounceCycle;
            --dx: 200vw;
        }
        #ball4 {
            animation-name: bounceCycle;
            --dx: -250vw;
        }

    </style>
</head>
<body>

    <div id="background-gradient"></div>

    <div id="juggling-area">
        <!-- The balls will be placed here -->
        <div class="ball" id="ball1" style="transform: translate(0, 0);"></div>
        <div class="ball" id="ball2" style="transform: translate(0, 0);"></div>
        <div class="ball" id="ball3" style="transform: translate(0, 0);"></div>
        <div class="ball" id="ball4" style="transform: translate(0, 0);"></div>
    </div>

    <div class="handler">
        ✨ CLOWN JUGGLER! ✨<br>
        (The colorful chaos!)
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const balls = [
                document.getElementById('ball1'),
                document.getElementById('ball2'),
                document.getElementById('ball3'),
                document.getElementById('ball4')
            ];

            // Function to initialize the dynamic 'bounce' effect
            // Since CSS keyframes for complex, timed arcs interacting with specific start positions are difficult,
            // we use JS to ensure the animation starts correctly and maintains vibrant initial styles.
            balls.forEach((ball, index) => {
                // Set initial dynamic properties via JS
                ball.style.opacity = 1;
                ball.style.transform = 'translate(0, 0)';

                // To make the CSS animation function robustly for varied paths, 
                // we'll adjust the CSS variable application slightly to emphasize distinct paths.
                // The core bouncing motion is handled by the CSS animation-delay and timing functions.
            });

            console.log("Juggling show activated!");
        });
    </script>

</body>
</html>
