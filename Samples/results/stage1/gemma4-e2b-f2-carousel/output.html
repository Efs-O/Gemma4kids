<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Horse Carousel</title>
    <style>
        /* Define CSS Variables for easy color changes */
        :root {
            --carousel-size: 400px;
            --horse-color-1: #FF6347; /* Tomato */
            --horse-color-2: #4169E1; /* Royal Blue */
            --horse-color-3: #3CB371; /* Medium Sea Green */
            --carousel-bg: linear-gradient(to right, hsl(120, 60%, 70%), hsl(140, 60%, 80%), hsl(160, 60%, 90%));
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #1a1a2e, #16213e); /* Dark space/night sky background */
            font-family: 'Arial', sans-serif;
        }

        .carousel-container {
            width: var(--carousel-size);
            height: var(--carousel-size);
            position: relative;
            border: 8px solid hsl(200, 90%, 55%);
            border-radius: 50%;
            background: hsl(200, 100%, 70%); /* Light center for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .horse {
            position: absolute;
            width: 80px;
            height: 100px;
            border-radius: 15px;
            background-color: var(--horse-color-1);
            border: 3px solid hsl(0, 0%, 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 1s ease-in-out; /* Smooth transition for movement */
        }

        /* Positioning the horses around the circle */
        .horse:nth-child(1) {
            transform: rotate(0deg) translate(0px) rotate(0deg);
            background-color: var(--horse-color-1);
        }

        .horse:nth-child(2) {
            transform: rotate(120deg) translate(0px) rotate(-120deg);
            background-color: var(--horse-color-2);
        }

        .horse:nth-child(3) {
            transform: rotate(240deg) translate(0px) rotate(-240deg);
            background-color: var(--horse-color-3);
        }

        /* Add more horses for a fuller carousel look */
        .horse:nth-child(4) {
            transform: rotate(360deg) translate(0px) rotate(-360deg);
            background-color: var(--horse-color-1);
        }

        /* Make sure the entire carousel structure rotates */
        .carousel-container {
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="horse">🐎</div>
        <div class="horse">🐴</div>
        <div class="horse">🦄</div>
        <div class="horse">🌟</div>
    </div>
</body>
</html>
