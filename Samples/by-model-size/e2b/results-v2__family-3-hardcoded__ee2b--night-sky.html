<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Starfield Night Sky</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000011; /* Deep space blue/black */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const NUM_STARS = 80;
        const shootingStars = [];
        const MAX_SHOOTING_STARS = 10;

        // Set canvas size to fill the viewport
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Star Initialization ---
        function createStar() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const size = Math.random() * 1.5 + 0.5; // Size between 0.5 and 2.0
            // Vivid colors: bright cyan, magenta, electric white
            const color = [
                '#FFFFFF', '#FFD700', '#00FFFF', '#FF00FF'
            ][Math.floor(Math.random() * 4)];

            stars.push({ x, y, size, color, opacity: Math.random() * 0.8 + 0.2 });
        }

        for (let i = 0; i < NUM_STARS; i++) {
            createStar();
        }

        // --- Shooting Star Initialization ---
        function createShootingStar() {
            const x = Math.random() * canvas.width;
            const y = -10; // Start above the screen
            const speed = Math.random() * 3 + 1;
            const trailLength = 150;
            const color = `hsl(${Math.random() * 360}, 100%, 70%)`;

            shootingStars.push({ x, y, speed, trailLength, color, age: 0 });
        }

        for (let i = 0; i < MAX_SHOOTING_STARS; i++) {
            createShootingStar();
        }


        // --- Animation Loop ---
        function animate() {
            // 1. Clear the canvas with a slight fade effect for a lingering trail look
            ctx.fillStyle = 'rgba(0, 0, 17, 0.1)'; // Very subtle fade over time
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Stars (Twinkling)
            stars.forEach(star => {
                // Twinkling effect: Randomly adjust opacity
                star.opacity = Math.max(0.1, star.opacity + (Math.random() - 0.5) * 0.05);
                
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Draw Shooting Stars
            shootingStars.forEach(shot => {
                // Move the star
                shot.y += shot.speed;
                shot.age++;

                // Draw the trail (as a fading line)
                ctx.strokeStyle = shot.color;
                ctx.lineWidth = 1.5;
                
                // Draw the moving line segment
                ctx.beginPath();
                ctx.moveTo(shot.x, shot.y - shot.trailLength);
                ctx.lineTo(shot.x, shot.y);
                ctx.stroke();

                // If the star goes off screen, reset it to the top
                if (shot.y > canvas.height) {
                    shot.y = -shot.trailLength;
                    shot.x = Math.random() * canvas.width;
                    shot.speed = Math.random() * 3 + 1;
                    shot.trailLength = 150;
                }
            });

            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();

    </script>
</body>
</html>
