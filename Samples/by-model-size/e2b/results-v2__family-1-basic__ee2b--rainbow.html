<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain to Rainbow</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a1a; /* Deep night blue/purple */
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- Rain Simulation --- */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(173, 216, 230, 0.9)); /* Light blue/white streaks */
            animation: fall linear infinite;
            animation-duration: 2s;
            animation-delay: 0s;
        }

        @keyframes fall {
            from {
                transform: translateY(-100vh);
                opacity: 0.5;
            }
            to {
                transform: translateY(100vh);
                opacity: 0.8;
            }
        }

        /* --- Rainbow Effect --- */
        .rainbow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            opacity: 0; /* Start hidden */
            transition: opacity 2s ease-in-out; /* Smooth fade in */
        }

        .rainbow-active {
            opacity: 1;
        }

        .rainbow-gradient {
            width: 100%;
            height: 100%;
            /* The actual rainbow effect using a vibrant gradient */
            background: linear-gradient(
                to bottom,
                #ff0000, /* Red */
                #ff7f50, /* Orange */
                #ffff00, /* Yellow */
                #7f7fcf, /* Light Blue */
                #00ff7f, /* Spring Green */
                #0000ff /* Blue */
            );
            background-size: 100% 100%;
            animation: rainbowShift 4s ease-in-out forwards;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
    </style>
</head>
<body>

    <!-- Rain Layer -->
    <div class="rain-container" id="rainLayer">
        <!-- Raindrops will be generated by JavaScript -->
    </div>

    <!-- Rainbow Layer -->
    <div class="rainbow-overlay" id="rainbowOverlay">
        <div class="rainbow-gradient"></div>
    </div>

    <script>
        const rainLayer = document.getElementById('rainLayer');
        const rainbowOverlay = document.getElementById('rainbowOverlay');

        // --- Step 1: Simulate Rain Generation ---
        const numDrops = 100;
        for (let i = 0; i < numDrops; i++) {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            
            // Random starting position and animation delay for varied effect
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDelay = `${Math.random() * 2}s`; // Stagger the start
            
            rainLayer.appendChild(drop);
        }

        // --- Step 2: Trigger the Rainbow Appearance ---
        // Wait for a short delay (to simulate rain falling) and then trigger the transition.
        // We wait slightly longer than the longest rain animation duration (2s)
        const triggerTime = 3000; // 3 seconds

        setTimeout(() => {
            // Make the rainbow visible
            rainbowOverlay.classList.add('rainbow-active');
            
            // Optional: Stop the rain movement or change its appearance dramatically here if desired.
            // For this effect, we let the rain continue faintly while the rainbow dominates.
            
        }, triggerTime);

    </script>
</body>
</html>
