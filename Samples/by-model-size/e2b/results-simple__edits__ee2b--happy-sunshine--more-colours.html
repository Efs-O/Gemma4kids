<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Sunshine</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #00FFFF; /* Bright Cyan Sky */
            font-family: 'Comic Sans MS', cursive;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* The Sun - Super Happy and Big */
        .sun {
            width: 350px;
            height: 350px;
            background-color: #FFFF00; /* Very Bright Yellow */
            border-radius: 50%;
            position: relative;
            border: 15px solid #FF8C00; /* Deep Orange Border */
            box-shadow: 0 0 40px #FFD700, 0 0 80px #FFA500; /* Intense, vibrant glow effect */
        }

        /* Sun's Happy Face (Symmetry) - Inner Core */
        .sun::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background-color: #FFEB3B; /* Bright central core */
            border-radius: 50%;
            border: 8px solid #FFD700;
        }

        /* Sun's Happy Eyes (Symmetric) - Use vibrant contrast */
        .sun::after {
            content: '';
            position: absolute;
            top: 40%;
            left: 30%;
            width: 50px;
            height: 50px;
            background-color: #FF0000; /* Vivid Red Eyes */
            border-radius: 50%;
            border: 4px solid #FFFF00; /* Yellow outline for eyes */
        }

        .sun .eye-left {
            left: 30%;
            top: 30%;
        }

        .sun .eye-right {
            right: 30%;
            top: 30%;
        }

        /* Sun's Happy Smile (Symmetric) - Hot Coral Smile */
        .sun .smile {
            width: 150px;
            height: 40px;
            background-color: #FF6B6B; /* Bright Coral */
            border: 8px solid #FF4500; /* Deep Orange outline */
            border-radius: 0 0 60px 60px;
            margin: 30px auto;
            /* Creating a happy arc/smile shape */
            border-bottom: none;
        }

        /* Sun Rays (Enhanced) */
        .sun::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid #FFEB3B; /* Bright Yellow Rays */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Title/Caption area */
        .sky-text {
            color: #FF4500; /* Deep Orange text */
            font-size: 2.5em;
            margin-top: 30px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            border: 5px dashed #00FFFF;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun">
            <!-- Eyes -->
            <div class="eye-left"></div>
            <div class="eye-right"></div>
            <!-- Smile -->
            <div class="smile"></div>
        </div>
        <div class="sky-text">Super Sunshine!</div>
    </div>
</body>
</html>
