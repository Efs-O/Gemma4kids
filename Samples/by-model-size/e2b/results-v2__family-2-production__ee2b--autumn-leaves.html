<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Autumn Leaves</title>
    <style>
        :root {
            --sky-blue: hsl(200, 80%, 60%);
            --tree-color-1: hsl(30, 90%, 50%); /* Red */
            --tree-color-2: hsl(40, 80%, 50%); /* Orange */
            --tree-color-3: hsl(50, 90%, 50%); /* Yellow */
            --leaf-color-1: #FF4500; /* Orange-Red */
            --leaf-color-2: #FF8C00; /* Dark Orange */
            --leaf-color-3: #FFD700; /* Gold */
            --fall-duration: 10s;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Start elements from the top */
            background: linear-gradient(to bottom, hsl(200, 80%, 60%), hsl(150, 70%, 40%));
            overflow: hidden;
        }

        /* Style for the "trees" or general scene context (optional base) */
        .tree-line {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 100px;
            background-color: hsl(30, 90%, 50%); /* Base tree color */
            z-index: 1;
        }

        /* Style for the falling leaves */
        .leaf {
            position: absolute;
            width: 30px;
            height: 40px;
            background-color: var(--leaf-color-1); /* Default color */
            border-radius: 50% 50% 0 0; /* Slightly pointed top */
            opacity: 0.8;
            animation: fall var(--fall-duration) linear forwards;
            z-index: 10;
        }

        /* Define the falling animation */
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Simulating some tree lines as falling zones -->
    <div class="tree-line" style="left: 10%; bottom: 10%;"></div>
    <div class="tree-line" style="left: 40%; bottom: 15%;"></div>
    <div class="tree-line" style="left: 70%; bottom: 10%;"></div>

    <!-- The leaves will be added by JavaScript -->
    <script>
        const body = document.body;
        const numberOfLeaves = 50;

        for (let i = 0; i < numberOfLeaves; i++) {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');

            // Randomize starting position (where the leaf appears in the scene)
            const startX = Math.random() * 100;
            
            // Randomize color
            const colors = [
                'var(--leaf-color-1)', 
                'var(--leaf-color-2)', 
                'var(--leaf-color-3)'
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            leaf.style.backgroundColor = randomColor;

            // Randomize starting horizontal position
            leaf.style.left = `${startX}vw`;
            
            // Randomize starting delay to stagger the fall
            leaf.style.animationDelay = `${Math.random() * 2}s`; 

            body.appendChild(leaf);
        }
    </script>

</body>
</html>
