<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Night Sky</title>
    <style>
        /* --- Global Setup and Background --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a001f; /* Deep space blue/purple */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- Star Layer (Midground/Background) --- */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            animation: twinkle 4s ease-in-out infinite alternate;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: scale(1);
            }
            100% {
                opacity: 1.0;
                transform: scale(1.2);
            }
        }

        /* --- Shooting Star Layer (Foreground) --- */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 100px;
            background-color: #ffcc00; /* Vivid yellow/gold trail */
            border-radius: 1px;
            animation: shoot 3s linear forwards;
            opacity: 0; /* Start invisible */
        }

        @keyframes shoot {
            0% {
                transform: translateX(-10vw);
                opacity: 1;
            }
            100% {
                transform: translateX(110vw);
                opacity: 0;
            }
        }

        /* --- Layering for Depth --- */

        /* Background Stars (Farthest) - Slow twinkle */
        .star:nth-child(3n) {
            top: 10%;
            left: 5%;
            width: 1px;
            height: 1px;
            animation-duration: 10s;
        }
        .star:nth-child(3n + 1) {
            top: 40%;
            left: 60%;
            animation-duration: 8s;
        }
        .star:nth-child(3n + 2) {
            top: 75%;
            left: 20%;
            animation-duration: 12s;
        }

        /* Shooting Stars (Fast Movement) - Foreground layer */
        .shooting-star:nth-child(1) {
            top: 50%;
            left: 0;
            animation-delay: 0.5s;
            animation-duration: 3.5s;
            background-color: #00ffff; /* Cyan streak */
        }
        .shooting-star:nth-child(2) {
            top: 100%;
            left: 100%;
            animation-delay: 1.5s;
            animation-duration: 4s;
            background-color: #ff00ff; /* Magenta streak */
        }
        .shooting-star:nth-child(3) {
            top: 20%;
            left: 50%;
            animation-delay: 2.5s;
            animation-duration: 3s;
            background-color: #ffff00; /* Bright yellow streak */
        }

        /* Adding more stars for density and variety */
        .star:nth-child(4n) {
            width: 1.5px;
            height: 1.5px;
            animation-duration: 9s;
        }
    </style>
</head>
<body>

    <!-- Stars (Background/Midground) - Generating 50 stars -->
    <script>
        const body = document.body;
        const numberOfStars = 50;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random positioning spread across the viewport
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            star.style.left = `${x}vw`;
            star.style.top = `${y}vh`;
            
            // Randomizing animation start time/phase for staggered twinkling
            star.style.animationDelay = `${Math.random() * 4}s`;
            star.style.animationDuration = `${6 + Math.random() * 6}s`; // Duration between 6s and 12s
            
            body.appendChild(star);
        }

        // Shooting Stars (Foreground) - Generating 10 shooting stars
        const numberOfShootingStars = 10;
        for (let i = 0; i < numberOfShootingStars; i++) {
            const ss = document.createElement('div');
            ss.className = 'shooting-star';
            
            // Random starting position and initial style variation
            ss.style.left = `${Math.random() * 100}vw`;
            ss.style.top = `${Math.random() * 100}vh`;
            ss.style.animationDelay = `${Math.random() * 2}s`;
            ss.style.animationDuration = `${3 + Math.random() * 2}s`;
            
            body.appendChild(ss);
        }
    </script>

</body>
</html>
