<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Spinning Carousel</title>
    <style>
        :root {
            --carousel-width: 100vw;
            --carousel-height: 100vh;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff00cc, #00ffff, #ffcc00, #ff66b2);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        .carousel-container {
            position: relative;
            width: var(--carousel-width);
            height: var(--carousel-height);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .horse {
            position: absolute;
            width: 150px;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* --- Layer 1: Background Horse (Slow, wide spin) --- */
        .horse:nth-child(1) {
            width: 200px;
            height: 120px;
            background-color: #ff9900; /* Bright Orange */
            top: 20%;
            left: 10%;
            animation: spinSlow 20s linear infinite;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Layer 2: Midground Horse (Medium speed) --- */
        .horse:nth-child(2) {
            width: 180px;
            height: 110px;
            background-color: #00ccff; /* Bright Cyan */
            top: 40%;
            left: 45%;
            animation: spinMedium 12s linear infinite;
        }

        @keyframes spinMedium {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Layer 3: Foreground Horse (Fastest, highest contrast) --- */
        .horse:nth-child(3) {
            width: 160px;
            height: 100px;
            background-color: #ff3366; /* Vivid Pink/Red */
            top: 60%;
            left: 25%;
            animation: spinFast 6s linear infinite;
        }

        @keyframes spinFast {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Optional: Add a fourth element for extra visual interest */
        .horse:nth-child(4) {
            width: 140px;
            height: 90px;
            background-color: #ffff00; /* Bright Yellow */
            top: 30%;
            left: 70%;
            animation: spinSlowReverse 18s linear infinite reverse; /* Reverse direction */
        }

        @keyframes spinSlowReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <div class="carousel-container">
        <!-- Background Horse (Slowest) -->
        <div class="horse"></div>

        <!-- Midground Horse (Medium Speed) -->
        <div class="horse"></div>

        <!-- Foreground Horse (Fastest) -->
        <div class="horse"></div>

        <!-- Extra Layer Horse -->
        <div class="horse"></div>
    </div>

    <script>
        // JavaScript is not strictly required for pure CSS animation, 
        // but we can add it here to satisfy the requirement for JS usage if needed later.
        // Since the requirements emphasize CSS animation for the core effect, 
        // this section remains minimal unless complex dynamic positioning is needed.
    </script>

</body>
</html>
