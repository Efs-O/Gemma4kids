<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juggling Clown</title>
    <style>
        body {
            background-color: #2a0e3c; /* Deep purple background */
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- Clown Styling --- */
        .clown {
            position: relative;
            width: 150px;
            height: 250px;
            background: linear-gradient(45deg, #ffcc00, #ff6600); /* Bright orange/yellow body */
            border-radius: 50% 50% 100% 100%;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.5);
            animation: float 4s ease-in-out infinite alternate;
        }

        .clown::before {
            content: '🤡'; /* Simple clown face representation */
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            color: white;
            text-shadow: 2px 2px 5px #ff00ff; /* Pink shadow */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        /* --- Ball Styling and Animation --- */
        .ball {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            top: -100px; /* Start above the clown */
            animation: bounce linear infinite;
        }

        /* Define different colors for the balls */
        .ball:nth-child(1) { background-color: #FF0000; animation-duration: 2.5s; } /* Red */
        .ball:nth-child(2) { background-color: #00FFFF; animation-duration: 3.5s; } /* Cyan */
        .ball:nth-child(3) { background-color: #FFFF00; animation-duration: 2.0s; } /* Yellow */
        .ball:nth-child(4) { background-color: #00FF00; animation-duration: 4.0s; } /* Green */
        .ball:nth-child(5) { background-color: #FF00FF; animation-duration: 2.8s; } /* Magenta */
        .ball:nth-child(6) { background-color: #0000FF; animation-duration: 3.0s; } /* Blue */
        .ball:nth-child(7) { background-color: #FFA500; animation-duration: 3.2s; } /* Orange */

        @keyframes bounce {
            0% { transform: translateY(-100px); opacity: 1; }
            50% { transform: translateY(200px); opacity: 0.8; }
            100% { transform: translateY(-100px); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="clown">
        <!-- Juggling Balls -->
        <div class="ball" style="left: 10%; animation-delay: 0s;"></div>
        <div class="ball" style="left: 30%; animation-delay: 0.5s;"></div>
        <div class="ball" style="left: 50%; animation-delay: 1.0s;"></div>
        <div class="ball" style="left: 70%; animation-delay: 1.5s;"></div>
        <div class="ball" style="left: 10%; animation-delay: 2.0s;"></div>
        <div class="ball" style="left: 30%; animation-delay: 2.5s;"></div>
        <div class="ball" style="left: 50%; animation-delay: 3.0s;"></div>
    </div>

</body>
</html>
