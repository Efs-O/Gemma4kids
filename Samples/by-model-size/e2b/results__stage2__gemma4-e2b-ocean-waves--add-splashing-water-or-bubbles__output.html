<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Beach Waves</title>
    <style>
        /* CSS Variables for easy color changes */
        :root {
            --sky-blue: hsl(180, 70%, 50%);
            --ocean-blue: hsl(130, 60%, 40%);
            --sand-color: hsl(40, 100%, 60%);
            --wave-color: hsl(150, 100%, 50%);
            --foam-color: hsl(200, 100%, 70%);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', sans-serif;
            /* Background: Sky and Sand */
            background: linear-gradient(to bottom, var(--sky-blue), var(--sand-color));
        }

        /* The Ocean Area */
        .ocean {
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* Keep waves contained */
            background: linear-gradient(to bottom, var(--ocean-blue), var(--sky-blue));
        }

        /* Styling for the individual waves */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: var(--wave-color);
            border-radius: 15px;
            /* Animation for the wave movement */
            animation: waveMotion linear infinite;
        }

        /* Styling for the foam/splashes */
        .foam {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            /* Initial state for splashing effect */
            animation: foamSplash linear infinite;
        }

        /* Styling for added bubbles */
        .bubble {
            position: absolute;
            bottom: -15px;
            left: 10%;
            width: 10px;
            height: 10px;
            background-color: var(--foam-color);
            border-radius: 50%;
            animation: bubbleFloat linear infinite;
        }

        /* Defining different wave sizes and starting positions */
        .wave:nth-child(1) {
            height: 80px;
            animation-duration: 4s;
            animation-delay: 0s;
            background: hsl(100, 70%, 40%);
        }

        .wave:nth-child(2) {
            height: 50px;
            animation-duration: 3.5s;
            animation-delay: 1s;
            background: hsl(120, 70%, 40%);
        }

        .wave:nth-child(3) {
            height: 90px;
            animation-duration: 4.5s;
            animation-delay: 2s;
            background: hsl(130, 70%, 40%);
        }

        /* Keyframe Animations */
        @keyframes waveMotion {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes foamSplash {
            0%, 100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-5px); /* Initial splash */
            }
            75% {
                transform: translateY(5px); /* Wave recedes */
            }
        }
        
        @keyframes bubbleFloat {
            0% {
                transform: translateY(0) translateX(0);
            }
            100% {
                transform: translateY(-50px) translateX(50px); /* Moves up and across */
            }
        }

        /* Styling for the Sun and Beach details */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            background-color: #FFD700; /* Bright yellow */
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
            animation: sunGlow 4s ease-in-out infinite alternate;
        }

        @keyframes sunGlow {
            from {
                transform: scale(1);
                box-shadow: 0 0 30px #FFD700;
            }
            to {
                transform: scale(1.05);
                box-shadow: 0 0 40px #FFD700;
            }
        }

        /* Beach text for atmosphere */
        .beach-text {
            padding: 20px;
            text-align: center;
            color: #333;
            font-size: 1.5em;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="ocean">
        <!-- Animated Waves -->
        <div class="wave">
            <div class="foam"></div>
            <div class="bubble"></div>
        </div>
        <div class="wave">
            <div class="foam"></div>
            <div class="bubble"></div>
        </div>
        <div class="wave">
            <div class="foam"></div>
            <div class="bubble"></div>
        </div>
        <div class="wave">
            <div class="foam"></div>
            <div class="bubble"></div>
        </div>
        <div class="wave">
            <div class="foam"></div>
            <div class="bubble"></div>
        </div>
    </div>
    <div class="beach-text">Sunny Beach Time!</div>
    <div class="sun"></div>
</body>
</html>
