<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ff99cc; /* Bright background color */
        }

        .cat-face {
            width: 300px;
            height: 300px;
            background-color: #ffdd88; /* Light, warm fur color */
            border-radius: 50%;
            position: relative;
            border: 8px solid #ff66b2; /* Pink border for cuteness */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* --- Eyes --- */
        .eye {
            width: 60px;
            height: 60px;
            background-color: #6666ff; /* Big blue/purple eyes */
            border-radius: 50%;
            position: absolute;
            top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #333333;
        }

        .eye.left {
            left: 50px;
            background-color: #ff3366; /* Pinkish eye */
        }

        .eye.right {
            right: 50px;
            background-color: #ff9933; /* Orangeish eye */
        }

        /* --- Whiskers (Symmetric) --- */
        .whiskers {
            position: absolute;
            top: 120px;
            width: 200px;
            height: 50px;
            display: flex;
            justify-content: space-between;
            /* Center the whiskers around the face */
        }

        .whisker {
            width: 40px;
            height: 3px;
            background-color: #333333;
            border-radius: 2px;
        }

        .whisker.left {
            margin-left: 50px;
        }

        .whisker.right {
            margin-right: 50px;
        }
    </style>
</head>
<body>
    <div class="cat-face">
        <!-- Eyes -->
        <div class="eye left"></div>
        <div class="eye right"></div>

        <!-- Whiskers -->
        <div class="whiskers">
            <div class="whisker left"></div>
            <div class="whisker right"></div>
        </div>
    </div>
</body>
</html>
