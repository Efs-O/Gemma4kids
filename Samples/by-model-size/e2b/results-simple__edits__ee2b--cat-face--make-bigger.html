<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Cute Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffccff; /* Lighter, softer background */
        }

        .cat-face {
            width: 400px; /* Increased size */
            height: 400px; /* Increased size */
            background-color: #ffdd88; /* Light, warm fur color */
            border-radius: 50%;
            position: relative;
            border: 10px solid #ff66b2; /* Thicker, more prominent border */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        /* --- Eyes --- */
        .eye {
            width: 80px; /* Increased size */
            height: 80px; /* Increased size */
            background-color: #6666ff; /* Big blue/purple eyes */
            border-radius: 50%;
            position: absolute;
            top: 110px; /* Adjusted position */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 6px solid #333333; /* Thicker border */
        }

        .eye.left {
            left: 60px;
            background-color: #ff3366; /* Pinkish eye */
        }

        .eye.right {
            right: 60px;
            background-color: #ff9933; /* Orangeish eye */
        }

        /* --- Whiskers (Symmetric) --- */
        .whiskers {
            position: absolute;
            top: 140px; /* Adjusted position to center on the larger face */
            width: 320px; /* Adjusted width to fit larger face */
            height: 60px;
            display: flex;
            justify-content: space-between;
        }

        .whisker {
            width: 50px; /* Thicker whiskers */
            height: 4px;
            background-color: #333333;
            border-radius: 2px;
        }

        .whisker.left {
            margin-left: 60px; /* Centered relative to the new face */
        }

        .whisker.right {
            margin-right: 60px; /* Centered relative to the new face */
        }
    </style>
</head>
<body>
    <div class="cat-face">
        <!-- Eyes -->
        <div class="eye left"></div>
        <div class="eye right"></div>

        <!-- Whiskers -->
        <div class="whiskers">
            <div class="whisker left"></div>
            <div class="whisker right"></div>
        </div>
    </div>
</body>
</html>
