<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow After Rain</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --rain-color: #4682B4; /* Steel blue for a moody sky */
            --rainbow-start: hsl(0, 60%, 30%);
            --rainbow-end: hsl(30, 60%, 70%);
        }

        body {
            background: linear-gradient(to bottom, var(--sky-blue), #ADD8E6);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Rain simulation (subtle effect) */
        .rain-line {
            position: absolute;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1));
            animation: fall 0.5s linear infinite;
            top: 0;
        }

        /* Rainbow Effect Container */
        .rainbow-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0; /* Start hidden */
            transition: opacity 2s ease-in-out;
        }

        /* The actual rainbow layer using a gradient */
        .rainbow-layer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                hsl(210, 70%, 50%) 0%, /* Blue */
                hsl(140, 70%, 50%) 33%, /* Cyan */
                hsl(100, 70%, 50%) 66%, /* Green */
                hsl(30, 60%, 70%) 100% /* Red */
            );
            animation: rainbow-flash 5s ease-in-out forwards;
        }

        /* Animation for the rain falling */
        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        /* Animation for the rainbow appearing */
        @keyframes rainbow-flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Simulate rain streaks as subtle lines -->
    <div class="rain-line" style="left: 0;"></div
    <div class="rain-line" style="left: 10%;"></div>
    <div class="rain-line" style="left: 20%;"></div>
    <div class="rain-line" style="left: 30%;"></div>
    <div class="rain-line" style="left: 40%;"></div>

    <!-- The rainbow that appears after the rain -->
    <div class="rainbow-container">
        <div class="rainbow-layer"></div>
    </div>

</body>
</html>
