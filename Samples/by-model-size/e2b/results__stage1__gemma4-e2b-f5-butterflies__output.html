<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Butterfly Garden</title>
    <style>
        /* --- Global Setup --- */
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); /* Soft gradient background */
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- Scene Container --- */
        .garden-scene {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- Flower Styling --- */
        .flower {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffeb3b; /* Bright Yellow Center */
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.8), 0 0 30px rgba(255, 105, 180, 0.6); /* Glow effect */
            animation: pulse 3s infinite alternate;
        }

        .flower::before, .flower::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #4caf50; /* Vivid Green Petals */
            opacity: 0.7;
        }

        .flower::before {
            transform: scale(0.8);
            top: -10px;
            left: -10px;
        }

        .flower::after {
            transform: scale(0.9);
            bottom: -10px;
            right: -10px;
        }

        /* --- Butterfly Styling --- */
        .butterfly {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* Butterfly shape */
            top: 10%;
            left: 5%;
            /* Initial animation setup */
            animation: fly_cycle linear infinite;
        }

        /* --- Keyframe Animations --- */

        /* Flower Pulse Animation */
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Butterfly Flight Animation */
        @keyframes fly_cycle {
            0% {
                transform: translate(0, 0) rotate(0deg);
                background-color: #ff69b4; /* Pink */
                opacity: 1;
            }
            25% {
                transform: translate(20vw, 10vh) rotate(45deg);
                background-color: #00ffff; /* Cyan */
                opacity: 0.9;
            }
            50% {
                transform: translate(50vw, 50vh) rotate(90deg);
                background-color: #ffeb3b; /* Yellow */
                opacity: 1;
            }
            75% {
                transform: translate(80vw, 20vh) rotate(135deg);
                background-color: #ff4500; /* OrangeRed */
                opacity: 0.8;
            }
            100% {
                transform: translate(0, 0) rotate(180deg);
                background-color: #3cb371; /* MediumSeaGreen */
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="garden-scene">

        <!-- Flowers -->
        <div class="flower" style="top: 15%; left: 10%;"></div>
        <div class="flower" style="top: 40%; left: 30%;"></div>
        <div class="flower" style="top: 60%; left: 50%;"></div>
        <div class="flower" style="top: 20%; left: 75%;"></div>
        <div class="flower" style="top: 55%; left: 15%;"></div>

        <!-- Butterflies (Multiple instances for variety) -->
        <div class="butterfly" style="animation-duration: 8s; animation-delay: 0s; top: 10%; left: 5%;"></div>
        <div class="butterfly" style="animation-duration: 10s; animation-delay: 1s; top: 30%; left: 80%;"></div>
        <div class="butterfly" style="animation-duration: 6s; animation-delay: 2s; top: 50%; left: 5%;"></div>
        <div class="butterfly" style="animation-duration: 9s; animation-delay: 3s; top: 15%; left: 90%;"></div>
        <div class="butterfly" style="animation-duration: 7s; animation-delay: 4s; top: 70%; left: 35%;"></div>
        <div class="butterfly" style="animation-duration: 8s; animation-delay: 5s; top: 25%; left: 70%;"></div>
        <div class="butterfly" style="animation-duration: 10s; animation-delay: 6s; top: 45%; left: 10%;"></div>

    </div>

</body>
</html>
