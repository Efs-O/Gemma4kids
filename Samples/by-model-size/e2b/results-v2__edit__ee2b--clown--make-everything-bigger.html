<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juggling Clown</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --ground-green: #32CD32;
            --clown-color: #FF6347; /* Tomato red for fun */
            --ball-colors: #FFD700, #4169E1, #3CB371, #FF4500; /* Gold, Blue, Green, Orange-Red */
        }

        body {
            background: linear-gradient(to bottom, hsl(200, 90%, 55%), hsl(100, 50%, 50%));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', cursive; /* Fun font choice! */
        }

        h1 {
            color: var(--clown-color);
            text-shadow: 3px 3px 5px #10B981;
        }

        .clown-area {
            width: 95vw; /* Increased width */
            height: 80vh; /* Increased height */
            background-color: hsl(200, 90%, 60%);
            border: 5px solid var(--clown-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden; /* Keep balls inside */
        }

        /* Simple Clown Face/Body Shape using borders */
        .clown-figure {
            width: 200px; /* Increased width */
            height: 250px; /* Increased height */
            background-color: #FFDAB9; /* Light skin tone */
            border-radius: 50% 50% 10px 10px;
            border: 8px solid var(--clown-color);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .clown-face {
            width: 120px; /* Increased size */
            height: 120px; /* Increased size */
            background-color: #FFC0CB; /* Pink face */
            border-radius: 50%;
            border: 4px solid #333;
            margin-bottom: 10px;
        }

        .ball {
            position: absolute;
            width: 50px; /* Increased size */
            height: 50px; /* Increased size */
            border-radius: 50%;
            background-color: var(--ball-colors);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            animation: bounce 1s infinite alternate;
        }

        /* Keyframes for bouncing effect */
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-25px); } /* Adjusted bounce for larger objects */
        }
    </style>
</head>
<body>

    <h1>The Juggling Clown!</h1>

    <div class="clown-area">
        <div class="clown-figure">
            <div class="clown-face"></div>
            <p>Watch the balls bounce!</p>
        </div>
    </div>

    <script>
        const clownArea = document.querySelector('.clown-area');
        const ballColors = [
            '#FFD700', // Gold
            '#4169E1', // Royal Blue
            '#3CB371', // Medium Sea Green
            '#FF4500'  // Orange Red
        ];
        const numBalls = 10;
        const ballContainer = document.createElement('div');
        ballContainer.style.position = 'relative';
        ballContainer.style.width = '100%';
        ballContainer.style.height = '100%';
        ballContainer.style.overflow = 'hidden'; // Keep balls visually contained

        // Create the balls
        for (let i = 0; i < numBalls; i++) {
            const ball = document.createElement('div');
            ball.classList.add('ball');
            
            // Randomize starting position
            const startX = Math.random() * (window.innerWidth - 100); // Adjusted calculation
            const startY = Math.random() * (window.innerHeight - 150); // Adjusted calculation
            
            ball.style.left = `${startX}px`;
            ball.style.top = `${startY}px`;
            
            // Randomize color
            ball.style.backgroundColor = ballColors[Math.floor(Math.random() * ballColors.length)];

            // Randomize animation delay and duration for a more natural juggle feel
            ball.style.animationDuration = `${1 + Math.random() * 1.5}s`;
            ball.style.animationDelay = `${Math.random() * 2}s`;

            ballContainer.appendChild(ball);
        }
        
        // Append the balls container to the clown area
        clownArea.appendChild(ballContainer);
    </script>

</body>
</html>
