<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Bouncing Ball</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: #000000; /* Black background for contrast */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ball {
            width: 80px;
            height: 80px;
            background-color: #FF00FF; /* Vivid Pink/Magenta */
            border-radius: 50%;
            position: absolute;
            top: 50px; /* Starting position */
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #FF00FF, 0 0 40px #FFFF00; /* Bright glow effect */
            transition: background-color 0.1s; /* Smooth color change on impact */
        }
    </style>
</head>
<body>

    <div id="ball"></div>

    <script>
        const ball = document.getElementById('ball');
        const container = document.body;
        
        let positionY = 50; // Initial vertical position
        let velocityY = 3;   // Initial downward speed
        const gravity = 0.4; // Simulated gravity effect
        const bounceFactor = -1; // Controls direction change upon collision

        function updateBallPosition() {
            // 1. Apply velocity (movement)
            positionY += velocityY;

            // 2. Apply gravity (acceleration downwards)
            velocityY += gravity;

            // 3. Check boundaries (Floor and Ceiling)
            const ballHeight = 80;
            const floor = container.clientHeight - ballHeight - 50; // Allow some margin from bottom
            const ceiling = 50; // Allow some margin from top

            if (positionY >= floor) {
                // Hit the floor, reverse direction and apply bounce
                velocityY *= bounceFactor; // Reverse velocity and dampen it slightly
                positionY = floor;
                
                // Change color on impact
                ball.style.backgroundColor = '#00FFFF'; // Cyan on floor impact
            } else if (positionY <= ceiling) {
                // Hit the ceiling, reverse direction and apply bounce
                velocityY *= bounceFactor;
                positionY = ceiling;

                // Change color on impact
                ball.style.backgroundColor = '#FF00FF'; // Magenta on ceiling impact
            }

            // 4. Apply new position to the DOM
            ball.style.top = `${positionY}px`;
        }

        // Start the animation loop
        function animate() {
            updateBallPosition();
            requestAnimationFrame(animate);
        }

        // Initialize the animation loop
        animate();
    </script>

</body>
</html>
