<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Autumn Drift</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #4b0082, #ff4500, #ff8c00);
            background-attachment: fixed;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.3) 100%);
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <canvas id="leafCanvas"></canvas>

    <script>
        const canvas = document.getElementById('leafCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let leaves = [];
        const leafCount = 70;
        const colors = [
            '#FF0000', // Bright Red
            '#FF4500', // OrangeRed
            '#FFD700', // Gold
            '#ADFF2F', // Green Yellow
            '#FF1493', // Deep Pink
            '#FFA500', // Orange
            '#FF8C00'  // Dark Orange
        ];

        class Leaf {
            constructor() {
                this.init();
                // Start leaves at various heights so they don't all appear at once
                this.y = Math.random() * height;
            }

            init() {
                this.x = Math.random() * width;
                this.y = -50;
                this.size = Math.random() * 15 + 10;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.rotation = Math.random() * 360;
                this.spin = (Math.random() - 0.5) * 2;
                this.drift = Math.random() * 2;
                this.oscillation = Math.random() * 100;
                this.oscSpeed = Math.random() * 0.02;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.oscillation) * this.drift + this.speedX;
                this.rotation += this.spin;
                this.oscillation += this.oscSpeed;

                // Reset if leaf leaves the screen
                if (this.y > height + 50) {
                    this.init();
                    this.y = -50;
                }
                
                // Wrap around sides
                if (this.x > width + 50) this.x = -50;
                if (this.x < -50) this.x = width + 50;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                
                ctx.beginPath();
                // Create a simple leaf shape (two arcs)
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(this.size, 0, 0, this.size);
                ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
                
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                
                // Vein in the middle
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(0, this.size);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Re-initialize leaves to fill the new space
            leaves = [];
            for (let i = 0; i < leafCount; i++) {
                leaves.push(new Leaf());
            }
        }

        function drawBranches() {
            ctx.save();
            ctx.strokeStyle = '#2d0a0a';
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';

            // Draw some abstract branch shapes at the top
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(width * 0.3, 50, width * 0.5, 0);
            ctx.quadraticCurveTo(width * 0.7, 80, width, 20);
            ctx.stroke();

            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(width * 0.2, 0);
            ctx.lineTo(width * 0.1, 100);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(width * 0.8, 0);
            ctx.lineTo(width * 0.9, 120);
            ctx.stroke();
            
            ctx.restore();
        }

        function animate() {
            // Clear with a slight trail effect
            ctx.clearRect(0, 0, width, height);
            
            // Draw background elements
            drawBranches();

            // Update and draw leaves
            leaves.forEach(leaf => {
                leaf.update();
                leaf.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        // Start the scene
        resize();
        animate();
    </script>
</body>
</html>
