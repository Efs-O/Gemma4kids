<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Leaves Falling</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #ff9a9e, #fad0c4, #ffd1ff);
            height: 100vh;
            display: flex;
            justify
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #fbc2eb);
            overflow: hidden;
        }

        /* The ground/grass */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, #2d5a27, #1e3c1a);
            z-index: 10;
        }

        /* Creating a leaf shape with CSS */
        .leaf {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 0 80% 0 80%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Adding a little detail to leaves */
        .leaf::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 100%;
            background: rgba(0,0,0,0.1);
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(25vh) translateX(20px) rotate(90deg);
            }
            50% {
                transform: translateY(50vh) translateX(-20px) rotate(180deg);
            }
            75% {
                transform: translateY(75vh) translateX(20px) rotate(270deg);
            }
            100% {
                transform: translateY(110vh) translateX(0) rotate(360deg);
            }
        }

        /* Different colors for the leaves */
        .leaf-1 { background-color: #FF4500; animation-duration: 20s; left: 10%; }
        .leaf-2 { background-color: #FF8C00; animation-duration: 25s; left: 25%; animation-delay: 1s; }
        .leaf-3 { background-color: #FFD700; animation-duration: 22s; left: 40%; animation-delay: 3s; }
        .leaf-4 { background-color: #E67E22; animation-duration: 30s; left: 55%; animation-delay: 2s; }
        .leaf-5 { background: #C0392B; animation-duration: 18s; left: 70%; animation-delay: 5s; }
        .leaf-6 { background: #F39C12; animation-duration: 28s; left: 85%; animation-delay: 0.5s; }
        .leaf-7 { background: #D35400; animation-duration: 24s; left: 15%; animation-delay: 4s; }
        .leaf-8 { background: #E74C3C; animation-duration: 32s; left: 35%; animation-delay: 6s; }
        .leaf-9 { background: #F1C40F; animation-duration: 15s; left: 65%; animation-delay: 2.5s; }
        .leaf-10 { background: #E67E22; animation-duration: 35s; left: 80%; animation-delay: 7s; }
        .leaf-11 { background: #FF6347; animation-duration: 20s; left: 50%; animation-delay: 1.5s; }
        .leaf-12 { background: #FFD700; animation-duration: 26s; left: 90%; animation-delay: 3.5s; }

    </style>
</head>
<body>

    <div class="scene">
        <!-- The leaves -->
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="leaf leaf-4"></div>
        <div class="leaf leaf-5"></div>
        <div class="leaf leaf-6"></div>
        <div class="leaf leaf-7"></div>
        <div class="leaf leaf-8"></div>
        <div class="leaf leaf-9"></div>
        <div class="leaf leaf-10"></div>
        <div class="leaf leaf-11"></div>
        <div class="leaf leaf-12"></div>

        <div class="ground"></div>
    </div>

</body>
</html>
