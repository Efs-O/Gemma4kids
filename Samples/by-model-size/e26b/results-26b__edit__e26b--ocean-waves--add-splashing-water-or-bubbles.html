<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Beach Waves</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 40%, #F4A460 60%, #EDC9AF 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* The Sun */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFF700, #FF8C00);
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700;
            z-index: 1;
        }

        /* The Ocean Container */
        .ocean {
            position: relative;
            width: 100%;
            height: 60vh;
            background: #0077be;
            overflow: hidden;
        }

        /* The Waves */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.3)" d="M0,160L48,176C96,192,192,224,288,224C384,224,480,192,576,165.3C672,139,768,117,864,128C960,139,1056,181,1152,186.7C1248,192,1344,160,1392,144L1rad,1deg,1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: 50% 100%;
            animation: wave-move 10s linear infinite;
        }

        .wave:nth-child(2) {
            bottom: 5px;
            opacity: 0.6;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.5)" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,218.7C672,235,768,251,864,234.7C960,219,1056,171,1152,149.3C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: 50% 100%;
            animation: wave-move 7s linear infinite;
            opacity: 0.8;
        }

        .wave:nth-child(3) {
            bottom: 10px;
            background: #00aaff;
            animation: wave-move 15s linear infinite;
            opacity: 0.4;
        }

        @keyframes wave-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* The Sand/Beach */
        .beach {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40vh;
            background: linear-gradient(to bottom, #EDC9AF, #C2B280);
            z-index: 0;
        }

        /* Little foam dots/bubbles */
        .foam {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: bubble-rise 5s ease-in infinite;
        }

        @keyframes bubble-rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-150px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="sun"></div>
    
    <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="beach"></div>

    <script>
        // Let's add some sparkling foam and bubbles to the waves!
        const ocean = document.querySelector('.ocean');
        const bubbleCount = 50;

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'foam';
            
            const size = Math.random() * 12 + 4 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.bottom = Math.random() * 100 + '%';
            
            // Staggered animation
            const duration = Math.random() * 4 + 3;
            const delay = Math.random() * 5;
            bubble.style.animationDuration = duration + 's';
            bubble.style.animationDelay = '-' + delay + 's'; // Negative delay starts them mid-animation
            
            ocean.appendChild(bubble);
        }
    </script>
</body>
</html>
