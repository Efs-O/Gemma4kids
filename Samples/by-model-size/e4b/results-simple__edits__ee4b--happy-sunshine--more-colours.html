<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Bright Sunshine Friend</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(to bottom right, #ff6f61, #ffc371); /* Vivid Sunset/Coral Gradient */
            overflow: hidden;
        }

        .sun-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun {
            background-color: #ffe066; /* Brighter, Lighter Yellow */
            border-radius: 50%;
            box-shadow: 0 15px 40px rgba(255, 165, 0, 0.9), 0 0 50px #ff8c00; /* Intense Orange/Yellow glow */
            width: 320px;
            height: 320px;
            border: 8px solid #ffa500; /* Vivid Orange Outline */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sun face features */
        .eye {
            background-color: #1e90ff; /* Dodger Blue - Vivid Color */
            border-radius: 50%;
            width: 35px;
            height: 35px;
            position: absolute;
            top: 50px;
            /* Symmetry: Left and Right */
        }

        .eye.left {
            left: 100px;
        }

        .eye.right {
            right: 100px;
        }

        .pupil {
            background-color: #8b0000; /* Deep Ruby Red - Vivid Contrast */
            border-radius: 50%;
            width: 12px;
            height: 12px;
            position: absolute;
            top: 7px;
            left: 7px;
        }
        
        /* Adjusting pupils for symmetry and placement */
        .eye.left .pupil {
             left: 7px;
        }
        .eye.right .pupil {
             right: 7px;
        }


        .smile {
            position: absolute;
            bottom: 60px;
            width: 180px;
            height: 40px;
            border-radius: 0 0 180px 180px; /* Semi-circle shape */
            background-color: #ff4500; /* Vivid Orange-Red */
            border: 4px solid #ff0000; /* Bright Red outline */
            box-shadow: 0 8px 15px rgba(255, 69, 0, 0.6);
        }

        /* Light Rays Effect - Using a vibrant gradient overlay */
        .sun::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 150, 0.6) 0%, transparent 60%);
            z-index: 1;
        }

    </style>
</head>
<body>
    <div class="sun-container">
        <div class="sun">
            <!-- Eyes -->
            <div class="eye left">
                <div class="pupil"></div>
            </div>
            <div class="eye right">
                <div class="pupil"></div>
            </div>
            
            <!-- Smile -->
            <div class="smile"></div>
        </div>
    </div>
</body>
</html>
