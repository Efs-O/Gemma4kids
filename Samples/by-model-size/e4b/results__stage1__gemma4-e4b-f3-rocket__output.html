<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch to Space</title>
    <style>
        :root {
            --space-dark: #000020;
            --star-color: #ffffff;
            --rocket-body: #ff4500; /* Vivid Orange-Red */
            --exhaust-color: #ff8c00; /* Bright Orange */
            --trail-color: #ffa500;
        }

        body {
            background: radial-gradient(ellipse at center, #0a0a30 0%, #000000 100%);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Start the launch from the bottom */
            position: relative;
            perspective: 1000px;
        }

        /* --- Starfield Background --- */
        .starfield {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                /* Creating multiple layers of random, twinkling stars */
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.8) 1px, transparent 1.5px),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.6) 1px, transparent 1.5px),
                radial-gradient(circle at 30% 90%, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px);
            background-size: 100vw 100vh;
            animation: twinkle 100s linear infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-20vw, -20vh);
            }
        }

        /* --- Rocket Elements --- */
        .rocket {
            position: absolute;
            bottom: 0;
            width: 50px;
            height: 120px;
            background: linear-gradient(to top, #3a3a6d 0%, #ff4500 100%); /* Dark blue to orange body */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Simple base shape */
            z-index: 10;
            transform: translateY(0);
            animation: launch 4s cubic-bezier(0.1, 0.9, 0.2, 1.5) forwards;
        }

        .rocket::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #ff6347; /* Nose cone color */
            border-radius: 50% 50% 0 0;
            transform: rotate(-10deg);
        }

        /* --- Exhaust/Flame Effect --- */
        .exhaust {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 20px;
            height: 50px;
            background: radial-gradient(ellipse at 50% 100%, #ffd700 0%, #ff8c00 50%, rgba(255, 140, 0, 0) 100%);
            z-index: 11;
            animation: thrust 0.1s linear infinite;
            filter: blur(5px);
        }

        /* --- Animation Keyframes --- */

        /* Rocket Launch Animation */
        @keyframes launch {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(0.8); /* Moves up and shrinks slightly */
                opacity: 0;
            }
        }
        
        /* Thrust/Flame Flicker Animation (Makes the rocket look like it's firing) */
        @keyframes thrust {
            0%, 100% {
                transform: scale(1) translateY(0);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.2) translateY(5px);
                opacity: 1;
            }
        }

    </style>
</head>
<body>
    <!-- Background Starfield -->
    <div class="starfield"></div>

    <!-- Rocket Structure -->
    <div class="rocket"></div>
    <div class="exhaust"></div>

    <script>
        // JavaScript is kept minimal here as CSS handles the main animation.
        // We can add a small event listener to confirm the animation is running.
        window.onload = function() {
            console.log("Rocket Launch initiated!");
        };
    </script>
</body>
</html>
