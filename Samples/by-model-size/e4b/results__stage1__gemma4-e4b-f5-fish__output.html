<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Underwater Animation</title>
    <style>
        /* Global Reset and Seascape Setup */
        :root {
            --sea-color: #0055a5; /* Deep vibrant blue */
            --waterline-color: #0077be; /* Lighter cyan for visual interest */
            --fish-color-1: #ff6b6b; /* Coral Red */
            --fish-color-2: #4ecdc4; /* Turquoise Green */
            --fish-color-3: #ffe66d; /* Bright Yellow */
            --bubble-color: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Essential to keep animations contained */
            background-color: var(--sea-color);
            font-family: sans-serif;
        }

        /* --- Water Surface Effect --- */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 15%; /* Simulating surface movement */
            background: linear-gradient(to bottom, rgba(0, 130, 170, 0.8), transparent);
            animation: surfaceWave 10s linear infinite;
            z-index: 1;
        }

        @keyframes surfaceWave {
            0% { transform: translateY(-5%); }
            100% { transform: translateY(10%); }
        }

        /* --- Fish Styling & Animation --- */
        .fish {
            position: absolute;
            bottom: 10vh; /* Start them slightly off the bottom */
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .fish-body {
            width: 0;
            height: 0;
            background: var(--fish-color-1);
            border-radius: 50%;
            /* Base shape creation using multiple elements */
            position: relative;
        }

        /* Specific Fish Styling for variation */
        .fish-1 {
            left: -10%;
            bottom: 15vh;
            width: 100px;
            height: 40px;
            background: linear-gradient(to right, var(--fish-color-1), #ff9a9a);
            border-radius: 50% 50% 0 0;
            animation: swim-left linear infinite;
            animation-duration: 20s;
            animation-delay: 0s;
        }

        .fish-2 {
            left: -10%;
            bottom: 20vh;
            width: 140px;
            height: 50px;
            background: linear-gradient(to right, var(--fish-color-2), #6ad6c7);
            border-radius: 50% 50% 0 0;
            animation: swim-right linear infinite;
            animation-duration: 25s;
            animation-delay: 5s;
        }

        .fish-3 {
            left: -10%;
            bottom: 12vh;
            width: 80px;
            height: 30px;
            background: linear-gradient(to right, var(--fish-color-3), #fffa7a);
            border-radius: 50% 50% 0 0;
            animation: swim-left linear infinite;
            animation-duration: 18s;
            animation-delay: 10s;
        }

        @keyframes swim-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(150vw); }
        }

        @keyframes swim-right {
            0% { transform: translateX(150vw); }
            100% { transform: translateX(-100vw); }
        }

        /* --- Bubble Styling & Animation --- */
        .bubble-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore mouse events */
            z-index: 5;
        }

        .bubble {
            position: absolute;
            background: var(--bubble-color);
            border-radius: 50%;
            opacity: 0; /* Start invisible */
            animation-fill-mode: forwards;
            animation-timing-function: ease-out;
        }

        /* Specific bubble properties to stagger timing and size */
        .bubble-1 {
            width: 15px;
            height: 15px;
            left: 10%;
            bottom: 10%;
            animation: rise 10s linear infinite;
        }
        .bubble-2 {
            width: 10px;
            height: 10px;
            left: 40%;
            bottom: 5%;
            animation: rise 15s linear infinite;
        }
        .bubble-3 {
            width: 20px;
            height: 20px;
            left: 80%;
            bottom: 20%;
            animation: rise 8s linear infinite;
        }
        .bubble-4 {
            width: 8px;
            height: 8px;
            left: 65%;
            bottom: 30%;
            animation: rise 20s linear infinite;
        }

        @keyframes rise {
            0% {
                opacity: 0;
                transform: translate(0, 0);
                /* Initial position is set by CSS 'left' and 'bottom' */
            }
            10% {
                 /* Quick visible pop */
                opacity: 0.7;
            }
            100% {
                opacity: 0; /* Fade out */
                transform: translateY(-120vh) scale(1.2); /* Move way up and slightly expand */
            }
        }
    </style>
</head>
<body>

    <!-- Bubble Container -->
    <div class="bubble-container">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
    </div>

    <!-- Fish Elements -->
    <div class="fish fish-1"></div>
    <div class="fish fish-2"></div>
    <div class="fish fish-3"></div>

</body>
</html>
