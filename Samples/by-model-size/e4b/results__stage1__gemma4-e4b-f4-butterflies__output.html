<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Butterfly Garden Animation</title>
    <style>
        /* Global Setup & Background */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: sans-serif;
        }

        /* Background Layer (Slow moving color wash) */
        .background-wash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(100, 255, 150, 0.5) 0%, transparent 30%),
                        radial-gradient(circle at 90% 80%, rgba(255, 100, 150, 0.4) 0%, transparent 30%);
            animation: backgroundPan 30s linear infinite alternate;
            z-index: 1;
        }

        @keyframes backgroundPan {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100vw, -100vh); }
        }

        /* Flower Layer (Midground - Stationary focal points) */
        .flower {
            position: absolute;
            width: 80px;
            height: 120px;
            background-color: #ff6b6b; /* Base color */
            border-radius: 50% / 10% 10% 80% 80%;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        /* Flower 1: Deep Pink */
        #flower1 {
            bottom: 10%;
            left: 15%;
            background-color: #ff4154;
            transform: scale(1.1);
        }
        /* Flower 2: Bright Yellow */
        #flower2 {
            bottom: 25%;
            right: 20%;
            background-color: #ffda00;
            transform: scale(0.9);
        }
        /* Flower 3: Cyan Blue */
        #flower3 {
            bottom: 5%;
            left: 40%;
            background-color: #00bcd4;
            width: 100px;
            height: 150px;
            border-radius: 50% / 20% 20% 90% 90%;
        }

        /* Butterfly Styling (Foreground - Animated elements) */
        .butterfly {
            position: absolute;
            width: 60px;
            height: 60px;
            /* Using simple divs to mimic wings spread out */
            background-color: transparent;
            z-index: 10;
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Butterfly Shape Styling (Creates the wing look) */
        .butterfly::before, .butterfly::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: currentColor; /* Uses the color set by the butterfly element itself */
            border-radius: 50% / 60% 60% 40% 40%;
            opacity: 0.8;
        }
        .butterfly::before {
            transform: rotate(0deg);
        }
        .butterfly::after {
            transform: rotate(180deg);
        }

        /* Specific Butterfly Colors and Initial Positions */
        #butterly1 {
            color: #ff007f; /* Vivid Magenta */
            bottom: 10%;
            left: 5%;
            animation: fly1 15s infinite ease-in-out;
        }
        #butterly2 {
            color: #ffb800; /* Vivid Orange/Gold */
            bottom: 30%;
            right: 15%;
            animation: fly2 20s infinite ease-in-out;
        }
        #butterly3 {
            color: #00bcd4; /* Cyan Blue */
            bottom: 50%;
            left: 45%;
            animation: fly3 18s infinite ease-in-out;
        }

        /* Keyframe Animations for Flying */

        /* Butterfly 1: Gentle wave, slow, starts left */
        @keyframes fly1 {
            0% { transform: translate(-10vw, 0); opacity: 0.8; }
            25% { transform: translate(15vw, 10vh); opacity: 1; }
            50% { transform: translate(30vw, 0); opacity: 1; }
            75% { transform: translate(10vw, -15vh); opacity: 0.8; }
            100% { transform: translate(-10vw, 0); opacity: 0.8; }
        }

        /* Butterfly 2: Looping pattern, medium speed, starts right */
        @keyframes fly2 {
            0% { transform: translate(110vw, 0); opacity: 0.9; }
            20% { transform: translate(80vw, -20vh); opacity: 1; }
            50% { transform: translate(30vw, 5vh); opacity: 1; }
            80% { transform: translate(10vw, 15vh); opacity: 0.9; }
            100% { transform: translate(110vw, 0); opacity: 0.9; }
        }

        /* Butterfly 3: Zig-zag, faster, starts center-left */
        @keyframes fly3 {
            0% { transform: translate(20vw, 5vh); opacity: 0.7; }
            20% { transform: translate(50vw, -10vh); opacity: 1; }
            50% { transform: translate(70vw, 15vh); opacity: 1; }
            80% { transform: translate(30vw, 5vh); opacity: 0.7; }
            100% { transform: translate(20vw, 5vh); opacity: 0.7; }
        }

    </style>
</head>
<body>

    <!-- Background Layer -->
    <div class="background-wash"></div>

    <!-- Foreground Elements: Butterflies -->
    <div class="butterfly" id="butterly1"></div>
    <div class="butterfly" id="butterly2"></div>
    <div class="butterfly" id="butterly3"></div>

    <!-- Midground Elements: Flowers -->
    <div class="flower" id="flower1"></div>
    <div class="flower" id="flower2"></div>
    <div class="flower" id="flower3"></div>


    <script>
        // JavaScript is used here only to ensure initial visual verification of element positioning
        // and adhering to JS style assignment rules, even though animation is CSS driven.

        window.onload = function() {
            // Set initial style attributes using camelCase
            const body = document.body;
            body.style.backgroundColor = 'transparent'; // Allowing CSS gradient to take over
            
            // Confirming element readiness (no immediate manipulation needed for this setup)
        };
    </script>
</body>
</html>
