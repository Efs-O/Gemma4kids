<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Flower Bouquet</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: #ff3366; /* Changed background to vivid red */
        }

        .scene-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: transparent;
        }

        /* --- Vase --- */
        .vase {
            width: 120px;
            background: linear-gradient(to bottom, #ff6b6b, #ee5253); /* Bright red/coral gradient */
            border-radius: 0 0 50% 50%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .vase-water {
            width: 100%;
            height: 40px;
            background-color: #66ccff; /* Bright light blue water */
            border-top: 2px solid #3399ff;
            border-radius: 0 0 50% 50%;
            z-index: 2;
        }

        /* --- Flowers and Foliage --- */
        .flower-arrangement {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -10px; /* Overlap slightly with vase */
            z-index: 3;
        }

        .stem {
            width: 8px;
            height: 100px;
            background-color: #4caf50; /* Bright green stem */
            border-radius: 4px;
            position: relative;
            z-index: 2;
        }

        .leaf {
            position: absolute;
            background-color: #38a169; /* Darker green leaf */
            height: 15px;
            border-radius: 0 0 50% 50%;
            transform: rotate(20deg);
            z-index: 1;
        }

        .leaf-left {
            width: 40px;
            top: 50px;
            left: -20px;
            transform: rotate(15deg);
        }

        .leaf-right {
            width: 40px;
            top: 60px;
            right: -20px;
            transform: rotate(-15deg);
        }

        .bloom {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -20px;
        }

        .flower {
            position: relative;
            width: 150px;
            height: 180px;
            display: flex;
            justify-content: space-around;
        }

        .petal {
            position: absolute;
            border-radius: 50%;
            width: 40px;
            height: 60px;
            transform-origin: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Petal Colors and Positions - Emphasizing symmetry */
        
        /* Center Flower (Yellow/Orange) */
        .petal-y1 { background-color: #ffeb3b; top: 10px; left: 20px; transform: rotate(-20deg); }
        .petal-y2 { background-color: #ffc107; top: 20px; left: 60px; transform: rotate(0deg); }
        .petal-y3 { background-color: #ff9800; top: 10px; right: 20px; transform: rotate(20deg); }
        .petal-y4 { background-color: #ffeb3b; top: 20px; right: 60px; transform: rotate(0deg); }

        /* Second Flower (Pink/Magenta) */
        .petal-p1 { background-color: #e91e63; top: 30px; left: 30px; transform: rotate(-30deg); width: 50px; height: 70px; }
        .petal-p2 { background-color: #f44336; top: 40px; right: 30px; transform: rotate(30deg); width: 50px; height: 70px; }

        /* Third Flower (Blue/Purple) */
        .petal-b1 { background-color: #9c27b0; top: 20px; left: 10px; transform: rotate(10deg); width: 35px; height: 55px; }
        .petal-b2 { background-color: #2196f3; top: 30px; right: 10px; transform: rotate(-10deg); width: 35px; height: 55px; }

    </style>
</head>
<body>
    <div class="scene-container">
        <!-- The Flower Arrangement -->
        <div class="flower-arrangement">
            <div class="bloom">
                <div class="petal petal-y1"></div>
                <div class="petal petal-y2"></div>
                <div class="petal petal-y3"></div>
                <div class="petal petal-y4"></div>
            </div>
            <div class="bloom" style="transform: translateY(-10px);">
                <div class="petal petal-p1"></div>
                <div class="petal petal-p2"></div>
            </div>
            <div class="bloom" style="transform: translateY(-20px);">
                <div class="petal petal-b1"></div>
                <div class="petal petal-b2"></div>
            </div>
        </div >
        
        <!-- Foliage -->
        <div class="stem">
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>

        <!-- The Vase -->
        <div class="vase"></div>
        <div class="vase-water"></div>
    </div>
</body>
</html>
