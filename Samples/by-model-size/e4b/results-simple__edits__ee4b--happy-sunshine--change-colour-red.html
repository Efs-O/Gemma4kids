<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Red Sun</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: #ff6347; /* Vivid Tomato Red/Orange background */
            overflow: hidden;
        }

        .sun-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun {
            background-color: #ff4500; /* Bright Orange-Red Main Color */
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(255, 69, 0, 1), 0 0 20px rgba(255, 140, 0, 0.8); /* Red/Orange Shadow */
            /* Making it large and visible */
            width: 300px;
            height: 300px;
            border: 5px solid #ff8c00; /* Deeper Gold/Orange outline */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sun face features */
        .eye {
            background-color: #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            position: absolute;
            top: 60px;
            /* Symmetry: Left and Right */
        }

        .eye.left {
            left: 90px; /* Adjusted for visual balance */
        }

        .eye.right {
            right: 90px; /* Adjusted for visual balance */
        }

        .pupil {
            background-color: #000;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            position: absolute;
            top: 5px;
            left: 5px;
        }
        
        .eye.left .pupil {
             left: 5px;
        }
        .eye.right .pupil {
             right: 5px;
        }


        .smile {
            position: absolute;
            bottom: 70px;
            width: 150px;
            height: 35px;
            border-radius: 0 0 150px 150px; /* Semi-circle shape */
            background-color: #dc143c; /* Crimson Red Smile */
            border: 3px solid #b22222;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        /* Optional: Adding light rays effect using pseudo-elements for extra shine */
        .sun::before, .sun::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 150, 0.4) 0%, transparent 70%);
            z-index: 0;
        }

    </style>
</head>
<body>
    <div class="sun-container">
        <div class="sun">
            <!-- Eyes -->
            <div class="eye left">
                <div class="pupil"></div>
            </div>
            <div class="eye right">
                <div class="pupil"></div>
            </div>
            
            <!-- Smile -->
            <div class="smile"></div>
        </div>
    </div>
</body>
</html>
