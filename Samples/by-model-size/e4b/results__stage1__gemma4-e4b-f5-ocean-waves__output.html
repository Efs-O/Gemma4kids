<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Ocean Waves Beach</title>
    <style>
        /* Global Setup & Color Palette */
        :root {
            --sky-color: #87CEEB; /* Light Blue Sky */
            --deep-sea-color: #0056b3; /* Deep Ocean Blue */
            --shallow-water-color: #4dc0e8; /* Bright Turquoise */
            --sand-color: #f0e68c; /* Khaki/Sand */
            --foam-color: #ffffff;
            --sun-color: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Keep animation contained */
            font-family: sans-serif;
            background: linear-gradient(to bottom, var(--sky-color) 0%, #4682b4 50%, var(--shallow-water-color) 100%);
        }

        /* --- Scene Elements --- */
        #scene-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* Sky/Horizon Division (Optional, using background gradient handles this well) */

        /* The Sand Beach Area */
        #beach {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh; /* Takes up the bottom quarter */
            background-color: var(--sand-color);
            z-index: 10;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1);
        }

        /* The Ocean Area */
        #ocean-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75vh; /* Above the beach */
            overflow: hidden; /* Crucial to contain the waves */
            z-index: 20;
        }

        /* --- Sun Element --- */
        .sun {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background-color: var(--sun-color);
            border-radius: 50%;
            box-shadow: 0 0 50px 20px rgba(255, 204, 0, 0.8);
            z-index: 30;
        }

        /* --- Wave Styling & Animation --- */

        .wave {
            position: absolute;
            width: 100%;
            height: 100px; /* Base height for the wave layer */
            background: radial-gradient(ellipse at 50% 0, rgba(255, 255, 255, 0.5) 0%, rgba(135, 206, 235, 0.7) 50%, transparent 100%);
            bottom: 0; /* Starts at the water line */
            left: 0;
            z-index: 25;
            opacity: 0.8;
        }

        /* Multiple waves to create depth and rhythm */
        .wave-1 {
            background-color: rgba(0, 100, 180, 0.6);
            animation: waveMotion1 6s linear infinite;
        }
        .wave-2 {
            background-color: rgba(0, 150, 255, 0.5);
            animation: waveMotion2 6s linear infinite;
        }
        .wave-3 {
            background-color: rgba(0, 200, 255, 0.3);
            animation: waveMotion3 5s linear infinite;
        }
        /* Foam Crest Animation (The crashing element) */
        .foam-crest {
            position: absolute;
            width: 100%;
            height: 15px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, var(--foam-color) 50%, rgba(255, 255, 255, 0) 100%);
            bottom: 0;
            left: 0;
            z-index: 26;
            animation: crashMotion 1.5s linear infinite;
        }

        /* --- KEYFRAME ANIMATIONS --- */

        /* 1. Wave Movement (Horizontal/Vertical Oscillation) */
        @keyframes waveMotion1 {
            0% { transform: translateX(-10%) translateY(0); }
            50% { transform: translateX(10%) translateY(20px); }
            100% { transform: translateX(-10%) translateY(0); }
        }

        @keyframes waveMotion2 {
            0% { transform: translateX(15%) translateY(0); }
            50% { transform: translateX(-15%) translateY(-15px); }
            100% { transform: translateX(15%) translateY(0); }
        }

        @keyframes waveMotion3 {
            0% { transform: translateX(0%) translateY(0); }
            50% { transform: translateX(20%) translateY(30px); }
            100% { transform: translateX(0%) translateY(0); }
        }

        /* 2. Foam Crash Animation (More aggressive movement) */
        @keyframes crashMotion {
            0% { transform: translateX(-100%) translateY(0); opacity: 0; }
            15% { transform: translateX(100%) translateY(-10px); opacity: 1; }
            90% { transform: translateX(110%) translateY(10px); opacity: 1; }
            100% { transform: translateX(100%) translateY(0); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="scene-container">
        <!-- Sky background is handled by the body gradient -->

        <!-- Sun -->
        <div class="sun"></div>

        <!-- Ocean Layer 1 (The deepest part) -->
        <div class="wave wave-1">
            <!-- Foam layer placed over the first wave -->
            <div class="foam-crest" style="animation-delay: 0s; width: 120%;"></div>
        </div>

        <!-- Ocean Layer 2 (Mid-depth) -->
        <div class="wave wave-2">
            <!-- Foam layer placed over the second wave -->
            <div class="foam-crest" style="animation-delay: -0.5s; width: 100%;"></div>
        </div>

        <!-- Ocean Layer 3 (Shallowest wave hitting the beach) -->
        <div class="wave wave-3">
            <!-- Foam layer placed over the third wave -->
            <div class="foam-crest" style="animation-delay: -1s; width: 150%;"></div>
        </div>

        <!-- The Beach -->
        <div id="beach"></div>
    </div>

</body>
</html>
