<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Cute Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #FF1493; /* Vivid Deep Pink Background */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .cat-face {
            background-color: #FFFACD; /* Softer but still bright yellow/cream Cat Fur */
            border-radius: 50% / 70% 70% 40% 40%;
            width: 90vmin; /* Increased size */
            height: 95vmin; /* Increased size */
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding-top: 30px;
        }

        /* Ears */
        .ear {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 30px 90px 30px; /* Larger */
            border-color: transparent transparent #8B4513 transparent; /* Deeper Brownish color for ears */
            position: absolute;
            top: -50px;
            transform: translateY(-50%);
            z-index: 10;
        }

        .left-ear {
            left: 15%;
            border-right-color: transparent;
            border-bottom-color: transparent;
        }

        .right-ear {
            right: 15%;
            border-left-color: transparent;
            border-bottom-color: transparent;
        }

        /* Nose and Mouth Area */
        .nose {
            background-color: #CD5C5C; /* Reddish Nose */
            width: 60px; /* Bigger */
            height: 30px; /* Bigger */
            border-radius: 50%;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .mouth {
            width: 50px; /* Bigger */
            height: 20px; /* Bigger */
            border-radius: 0 0 20px 20px;
            background-color: #D2691E;
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        }

        /* Eyes */
        .eye {
            width: 160px; /* Bigger */
            height: 80px; /* Bigger */
            background-color: #79C2FF; /* Brighter Blue Iris */
            border-radius: 50%;
            position: absolute;
            top: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .left-eye {
            left: 20%;
        }

        .right-eye {
            right: 20%;
        }

        .pupil {
            width: 40px; /* Bigger */
            height: 40px; /* Bigger */
            background-color: #000080; /* Dark Navy Pupil */
            border-radius: 50%;
            position: absolute;
            z-index: 11;
        }

        .left-pupil {
            left: 45px;
            top: 20px;
        }

        .right-pupil {
            right: 45px;
            top: 20px;
        }

        /* Whiskers Container */
        .whiskers-container {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .whisker-group {
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
        }

        /* Individual Whisker Style */
        .whisker {
            width: 120px; /* Wider */
            height: 2px; /* Thicker */
            background-color: #333;
            position: relative;
        }

        /* Overriding structure for symmetry and simplicity using direct divs */
        .whisker-l1 { width: 100px; }
        .whisker-l2 { width: 150px; }
        .whisker-r1 { width: 100px; }
        .whisker-r2 { width: 150px; }


    </style>
</head>
<body>

    <div class="cat-face">
        <!-- Ears -->
        <div class="ear left-ear"></div>
        <div class="ear right-ear"></div>

        <!-- Eyes -->
        <div class="eye left-eye">
            <div class="pupil left-pupil"></div>
        </div>
        <div class="eye right-eye">
            <div class="pupil right-pupil"></div>
        </div>

        <!-- Whiskers (Structured for 4 whiskers on each side) -->
        <div class="whiskers-container">
            <!-- Left Side Whiskers -->
            <div class="whisker-group">
                <div class="whisker whisker-l1"></div>
                <div class="whisker whisker-l2"></div>
            </div>
            <!-- Right Side Whiskers -->
            <div class="whisker-group" style="flex-direction: row-reverse;">
                <div class="whisker whisker-r1"></div>
                <div class="whisker whisker-r2"></div>
            </div>
        </div>

        <!-- Nose and Mouth -->
        <div class="nose">
            <div style="width: 15px; height: 8px; background-color: #CD5C5C; border-radius: 50%; position: relative; top: 5px; left: 50%; transform: translateX(-50%);"></div>
        </div>
        <div class="mouth"></div>

    </div
>
</body
