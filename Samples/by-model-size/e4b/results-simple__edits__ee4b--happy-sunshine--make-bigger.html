<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Happy Sunshine</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: #ff91d2; /* Vivid Pink Sky */
            overflow: hidden;
        }

        .sun-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun {
            background-color: #ffe038; /* Brighter Yellow */
            border-radius: 50%;
            box-shadow: 0 20px 50px rgba(255, 165, 0, 1), 0 0 80px rgba(255, 220, 56, 0.8);
            width: 550px; /* Increased size */
            height: 550px; /* Increased size */
            border: 8px solid #ffb300; /* Thicker, bolder outline */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Sun face features */
        .eye {
            background-color: #333;
            border-radius: 50%;
            width: 60px; /* Bigger eyes */
            height: 60px;
            position: absolute;
            top: 120px; /* Adjusted vertical position */
            /* Symmetry: Left and Right */
        }

        .eye.left {
            left: 150px; /* Adjusted for visual balance */
        }

        .eye.right {
            right: 150px; /* Adjusted for visual balance */
        }

        .pupil {
            background-color: #000;
            border-radius: 50%;
            width: 25px; /* Bigger pupils */
            height: 25px;
            position: absolute;
            top: 10px;
        }
        
        .eye.left .pupil {
             left: 15px;
        }
        .eye.right .pupil {
             right: 15px;
        }


        .smile {
            position: absolute;
            bottom: 100px; /* Moved down */
            width: 300px; /* Wider smile */
            height: 60px;
            border-radius: 0 0 200px 200px; /* More curved semi-circle */
            background-color: #ff6f00; /* Deeper, brighter orange */
            border: 5px solid #e65100;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* Optional: Adding light rays effect using pseudo-elements for extra shine */
        .sun::before, .sun::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            /* Increased gradient size/opacity for bigger effect */
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 150, 0.5) 0%, transparent 60%);
            z-index: 0;
        }

    </style>
</head>
<body>
    <div class="sun-container">
        <div class="sun">
            <!-- Eyes -->
            <div class="eye left">
                <div class="pupil"></div>
            </div>
            <div class="eye right">
                <div class="pupil"></div>
            </div>
            
            <!-- Smile -->
            <div class="smile"></div>
        </div>
    </div>
</body>
</html>
