<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Butterfly Garden</title>
    <style>
        /* Global Setup & Background */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff6b81 0%, #ffe66d 50%, #4d96ff 100%);
            overflow: hidden;
            min-height: 100vh;
            position: relative;
            /* Setting a vibrant background suitable for a garden */
        }

        /* --- Butterfly Styling & Animation --- */
        .butterfly {
            position: absolute;
            width: 80px;
            height: 60px;
            pointer-events: none;
            /* Initial placement will be handled by JS/inline styles for variety */
            transform: translate(-50%, -50%);
            animation: fly-path linear infinite;
            z-index: 10;
        }

        /* The main body of the butterfly */
        .butterfly-body {
            width: 20px;
            height: 30px;
            background-color: #ff00aa; /* Vivid magenta body */
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 10px rgba(255, 150, 255, 0.8);
        }

        /* The wings container */
        .wings {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: wing-flap 0.15s linear infinite alternate;
        }

        .wing {
            position: absolute;
            width: 45px;
            height: 35px;
            background-color: #ffcc00; /* Vivid yellow/orange */
            border-radius: 50% 50% 40% 40%;
            opacity: 0.8;
            transform-origin: center;
            border: 1px solid rgba(0, 0, 0, 0.1);
            /* Slight asymmetry for better look */
        }

        /* Left Wing Definition */
        .wing-l {
            top: 10px;
            left: 10%;
            transform: rotateY(0deg) scale(1.1);
            background-color: #ff6b81; /* Pink */
            z-index: 2;
        }
        /* Right Wing Definition */
        .wing-r {
            top: 10px;
            left: 80%;
            transform: rotateY(0deg) scale(1.1);
            background-color: #4d96ff; /* Bright Blue */
            z-index: 2;
        }

        /* Wing Flapping Animation */
        @keyframes wing-flap {
            0% {
                transform: scaleY(1) translateY(0px);
            }
            100% {
                transform: scaleY(1.2) translateY(-5px);
            }
        }

        /* Flight Path Animation (Meandering movement) */
        @keyframes fly-path {
            0% { transform: translate(-50%, -50%) translateX(0px) translateY(0px); }
            25% { transform: translate(-50%, -50%) translateX(10vw) translateY(-20px); }
            50% { transform: translate(-50%, -50%) translateX(5vw) translateY(5px); }
            75% { transform: translate(-50%, -50%) translateX(-15vw) translateY(-10px); }
            100% { transform: translate(-50%, -50%) translateX(0vw) translateY(0px); }
        }

        /* --- Flower Styling (Static Elements) --- */
        .flower {
            position: absolute;
            bottom: 0;
            z-index: 5;
            animation: gentle-pulse 4s ease-in-out infinite alternate;
        }

        /* Specific Flower Colors/Shapes */
        .flower-1 {
            bottom: 0; left: 10%; transform: scale(1.2);
        }
        .flower-2 {
            bottom: 0; right: 15%; transform: scale(1.4);
        }
        .flower-3 {
            bottom: 0; left: 60%; transform: scale(1.1);
        }
        .flower-4 {
            bottom: 0; right: 30%; transform: scale(1.3);
        }

        /* Flower structure details */
        .petal {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ff00aa; /* Magenta */
            opacity: 0.9;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            /* Arrangement of multiple petals */
        }

        .stamen {
            width: 8px;
            height: 15px;
            background-color: #ffcc00; /* Yellow center */
            border-radius: 5px 5px 5px 5px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }
        
        /* Keyframe for gentle, ambient pulsing */
        @keyframes gentle-pulse {
            0% { transform: scale(1) translateY(0px); }
            100% { transform: scale(1.05) translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- Flowers in the foreground -->
    <div class="flower flower-1">
        <div class="petal" style="background-color: #ff6b81; top: 0px; left: 10px;"></div>
        <div class="petal" style="background-color: #ff6b81; top: 30px; left: 5px;"></div>
        <div class="petal" style="background-color: #ff6b81; top: 15px; left: 45px;"></div>
        <div class="stamen"></div>
    </div>

    <div class="flower flower-2">
        <div class="petal" style="background-color: #4d96ff; top: 10px; left: 15px;"></div>
        <div class="petal" style="background-color: #4d96ff; top: 40px; left: 25px;"></div>
        <div class="petal" style="background-color: #4d96ff; top: 20px; left: 40px;"></div>
        <div class="stamen" style="background-color: #ffcc00;"></div>
    </div>

    <div class="flower flower-3">
        <div class="petal" style="background-color: #ffcc00; top: 5px; left: 20px;"></div>
        <div class="petal" style="background-color: #ffcc00; top: 35px; left: 35px;"></div>
        <div class="petal" style="background-color: #ffcc00; top: 25px; left: 5px;"></div>
        <div class="stamen" style="background-color: #ff00aa;"></div>
    </div>

    <div class="flower flower-4">
        <div class="petal" style="background-color: #ff6b81; top: 15px; left: 10px;"></div>
        <div class="petal" style="background-color: #ff6b81; top: 45px; left: 30px;"></div>
        <div class="petal" style="background-color: #ff6b81; top: 25px; left: 45px;"></div>
        <div class="stamen"></div>
    </div>

    <!-- Butterfly Elements (JS will position and populate these) -->
    <div class="butterfly" id="b1" style="top: 10%; left: 15%;">
        <div class="wings">
            <div class="wing wing-l"></div>
            <div class="wing wing-r"></div>
        </div>
        <div class="butterfly-body"></div>
    </div>

    <div class="butterfly" id="b2" style="top: 40%; left: 70%;">
        <div class="wings">
            <div class="wing wing-l" style="background-color: #ff9900;"></div>
            <div class="wing wing-r" style="background-color: #9900ff;"></div>
        </div>
        <div class="butterfly-body" style="background-color: #ff00aa;"></div>
    </div>

    <div class="butterfly" id="b3" style="top: 60%; left: 30%;">
        <div class="wings">
            <div class="wing wing-l" style="background-color: #00c853;"></div>
            <div class="wing wing-r" style="background-color: #00897b;"></div>
        </div>
        <div class="butterfly-body" style="background-color: #ff6b81;"></div>
    </div>
    
    <div class="butterfly" id="b4" style="top: 25%; left: 85%;">
        <div class="wings">
            <div class="wing wing-l" style="background-color: #f44336;"></div>
            <div class="wing wing-r" style="background-color: #ffeb3b;"></div>
        </div>
        <div class="butterfly-body" style="background-color: #ff00aa;"></div>
    </div>

    <script>
        // JavaScript is used here primarily to ensure the flight animations run correctly
        // and to give slightly different randomized initial timings/durations to the butterflies.
        document.addEventListener('DOMContentLoaded', function() {
            const butterflies = document.querySelectorAll('.butterfly');
            
            // Function to randomize flight path duration and timing
            function randomizeButterfly(butterflyElement) {
                // Random flight duration (8s to 20s)
                const duration = Math.random() * 12000 + 8000; 
                
                // Set the custom animation duration on the element's style
                butterflyElement.style.animationDuration = `${duration}ms`;
                
                // Set a slight initial delay to stagger the start
                const delay = Math.random() * 2000;
                butterflyElement.style.animationDelay = `${delay}ms`;
            }

            butterflies.forEach(randomizeButterfly);
        });
    </script>
</body>
</html>
