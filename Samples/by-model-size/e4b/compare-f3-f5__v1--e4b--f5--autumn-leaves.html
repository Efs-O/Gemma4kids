<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Autumn Leaf Fall</title>
    <style>
        /* Global Setup */
        body {
            margin: 0;
            padding: 0;
            background-color: #2a1a0f; /* Dark, forest background color */
            overflow: hidden; /* Hide scrollbars as leaves fall */
            height: 100vh;
            width: 100vw;
            perspective: 1000px; /* For subtle 3D feel */
        }

        /* Keyframes for the falling motion */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Falls down and drifts slightly sideways */
                transform: translateY(110vh) translateX(30vw) rotate(15deg);
                opacity: 0;
            }
        }

        /* Keyframes for flutter (subtle rotation variation) */
        @keyframes flutter {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }

        /* Container for all falling elements */
        .leaf-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore mouse events */
        }

        /* --- Individual Leaf Styling --- */
        .leaf {
            position: absolute;
            width: 60px;
            height: 40px;
            background: rgba(255, 100, 0, 0.9); /* Base Orange */
            border-radius: 50% / 60% 30% 50% 50%; /* Leaf shape approximation */
            pointer-events: none;
            animation-timing-function: cubic-bezier(0.2, 1, 0.3, 1); /* Natural acceleration feel */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
            will-change: transform, opacity; /* Performance optimization */
        }

        /* Specific Leaf Colors (Autumn Palette) */
        .leaf-red {
            background: #d92e00; /* Deep Crimson Red */
            transform: rotate(0deg);
        }

        .leaf-yellow {
            background: #ffc300; /* Bright Golden Yellow */
            transform: rotate(20deg);
        }

        .leaf-orange {
            background: #ff7f00; /* Vivid Autumn Orange */
            transform: rotate(-10deg);
        }

        /* Leaf Placement and Animation Staggering */

        /* Group 1: Top Left Corner (Simulated Tree Canopy) */
        .leaf-group-1 {
            top: 0;
            left: -20%;
            animation: fall 15s linear infinite;
        }

        /* Group 2: Center Top Area */
        .leaf-group-2 {
            top: 0;
            left: 20%;
            animation: fall 18s linear infinite;
        }

        /* Group 3: Top Right Corner */
        .leaf-group-3 {
            top: 0;
            left: 80%;
            animation: fall 14s linear infinite;
        }

        /* Helper class to apply the complex animation sequence */
        .falling-element {
            animation: 
                fall linear infinite, 
                flutter 6s linear infinite alternate;
        }
    </style>
</head>
<body>

    <div class="leaf-container">
        <!-- Group 1: Left Side Canopy -->
        <div class="leaf-group-1">
            <div class="leaf leaf-red falling-element" style="left: 0%; top: -50px; animation-delay: 0s;"></div>
            <div class="leaf leaf-yellow falling-element" style="left: 10%; top: -120px; animation-delay: 1s;"></div>
            <div class="leaf leaf-orange falling-element" style="left: 15%; top: -80px; animation-delay: 2.5s;"></div>
            <div class="leaf leaf-red falling-element" style="left: 5%; top: -150px; animation-delay: 4s;"></div>
        </div>

        <!-- Group 2: Center Canopy -->
        <div class="leaf-group-2">
            <div class="leaf leaf-orange falling-element" style="left: 5%; top: -30px; animation-delay: 0.5s;"></div>
            <div class="leaf leaf-red falling-element" style="left: 25%; top: -100px; animation-delay: 1.5s;"></div>
            <div class="leaf leaf-yellow falling-element" style="left: 10%; top: -160px; animation-delay: 3s;"></div>
            <div class="leaf leaf-orange falling-element" style="left: 35%; top: -60px; animation-delay: 4s;"></div>
        </div>

        <!-- Group 3: Right Side Canopy -->
        <div class="leaf-group-3">
            <div class="leaf leaf-yellow falling-element" style="left: 10%; top: -110px; animation-delay: 0.2s;"></div>
            <div class="leaf leaf-red falling-element" style="left: 40%; top: -40px; animation-delay: 1.8s;"></div>
            <div class="leaf leaf-orange falling-element" style="left: 70%; top: -130px; animation-delay: 3.5s;"></div>
            <div class="leaf leaf-yellow falling-element" style="left: 20%; top: -90px; animation-delay: 5s;"></div>
        </div>

    </div>

    <script>
        // JavaScript is only used here to dynamically add more leaves for a richer, continuous fall effect,
        // ensuring the animation is visible and robustly spread across the viewport.

        const leafContainer = document.querySelector('.leaf-container');
        const colors = ['leaf-red', 'leaf-yellow', 'leaf-orange'];
        const leafCount = 100; // Total number of leaves to spawn

        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf', 'falling-element');
            
            // Randomize color
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            leaf.classList.add(randomColor);

            // Randomize initial position across the top edge
            leaf.style.left = `${Math.random() * 100}%`;
            leaf.style.top = `-${Math.random() * 150 + 50}px`; // Start between 50px and 200px above the screen
            
            // Randomize animation properties for variety
            leaf.style.animationDuration = `${Math.random() * 10 + 12}s`; // Duration 12s to 22s
            leaf.style.animationDelay = `${Math.random() * 10}s`; // Delay 0s to 10s
            leaf.style.transform = `rotate(${Math.random() * 720}deg)`;
            leaf.style.opacity = `${Math.random() * 0.5 + 0.4} opacity`;
            
            // Set a slightly varied final drift target (for visual interest)
            const finalDrift = Math.random() * 50 + 10;
            leaf.style.setProperty('--final-drift', `${finalDrift}vw`);

            return leaf;
        }

        function populateLeaves() {
            for (let i = 0; i < leafCount; i++) {
                const newLeaf = createLeaf();
                leafContainer.appendChild(newLeaf);
            }
        }

        // Run the population when the page loads
        document.addEventListener('DOMContentLoaded', populateLeaves);
    </script>

</body>
</html>
