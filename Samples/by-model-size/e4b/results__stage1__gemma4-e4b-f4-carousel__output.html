<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Spinning Carousel</title>
    <style>
        /* Global Setup & Background */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff006e 0%, #6a00ff 50%, #00eaff 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
        }

        /* Carousel Container Setup */
        .carousel-wrapper {
            width: 80vw;
            max-width: 1200px;
            height: 400px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            /* This element handles the rotation */
            animation: spin 20s linear infinite;
            padding: 20px 0;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
        }

        /* Keyframe Animation for Spinning */
        @keyframes spin {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        /* Individual "Horse" Element Styling (Simulated using colorful blocks/shapes) */
        .carousel-item {
            flex-shrink: 0;
            width: 18vw;
            height: 300px;
            border-radius: 50% / 30% 30% 0 0; /* Gives a curved, stylized appearance */
            background: linear-gradient(45deg, var(--color-start), var(--color-end));
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease-in-out;
            border: 5px solid rgba(255, 255, 255, 0.5);
        }

        .carousel-item:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        /* Styling for abstract representation within the item */
        .horse-figure {
            width: 70%;
            height: 70%;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 15% 15% 10% 10%;
            position: relative;
            transform: translateY(10px);
            filter: brightness(1.2);
        }

        /* Variations for depth and timing adjustment (Applying different visual characteristics) */

        /* Item 1: Foreground Focus */
        .horse1 {
            --color-start: #ff5722; /* Vivid Orange */
            --color-end: #ff9800;
            animation-delay: -2s; /* Start slightly delayed in the cycle for visual effect */
            animation-duration: 20s;
        }
        /* Item 2: Midground Focus */
        .horse2 {
            --color-start: #00c853; /* Lime Green */
            --color-end: #4caf50;
            animation-delay: 0s;
            animation-duration: 22s;
        }
        /* Item 3: Background Focus */
        .horse3 {
            --color-start: #29b6f6; /* Bright Blue */
            --color-end: #039be5;
            animation-delay: 4s;
            animation-duration: 18s;
        }
        /* Item 4: Foreground Contrast */
        .horse4 {
            --color-start: #e91e63; /* Vivid Pink */
            --color-end: #ad1457;
            animation-delay: -4s;
            animation-duration: 24s;
        }
        /* Item 5: Midground Warmth */
        .horse5 {
            --color-start: #ffeb3b; /* Bright Yellow */
            --color-end: #fbc02d;
            animation-delay: 1s;
            animation-duration: 21s;
        }

        /* Additional Depth/Twinkle Effect on all items */
        .carousel-item::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 5%;
            width: 10%;
            height: 10%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s ease-out infinite alternate;
        }

        /* Twinkle Keyframe Animation */
        @keyframes twinkle {
            from {
                transform: scale(0.8);
                opacity: 0.5;
            }
            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

    </style>
</head>
<body>

    <div class="carousel-wrapper">
        <!-- Element 1: Vivid Orange/Pink tones (Foreground) -->
        <div class="carousel-item horse1">
            <div class="horse-figure"></div>
            <h3 style="color: #fff; text-shadow: 2px 2px 4px #000;">Majestic Horse</h3>
        </div>

        <!-- Element 2: Lime Green/Teal tones (Midground) -->
        <div class="carousel-item horse2">
            <div class="horse-figure"></div>
            <h3 style="color: #000; text-shadow: 2px 2px 4px #fff;">Spring Spirit</h3>
        </div>

        <!-- Element 3: Bright Blue/Purple tones (Background) -->
        <div class="carousel-item horse3">
            <div class="horse-figure"></div>
            <h3 style="color: #fff; text-shadow: 2px 2px 4px #000;">Sky Runner</h3>
        </div>

        <!-- Element 4: Vivid Pink/Red tones (Foreground) -->
        <div class="carousel-item horse4">
            <div class="horse-figure"></div>
            <h3 style="color: #fff; text-shadow: 2px 2px 4px #000;">Crimson Dream</h3>
        </div>

        <!-- Element 5: Bright Yellow/Green tones (Midground) -->
        <div class="carousel-item horse5">
            <div class="horse-figure"></div>
            <h3 style="color: #000; text-shadow: 2px 2px 4px #fff;">Golden Gallop</h3>
        </div>
    </div>

</body>
</html>
