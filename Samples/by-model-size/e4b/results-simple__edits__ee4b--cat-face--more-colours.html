<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Cute Cat Face</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            /* Vivid Background: Bright Cyan/Aqua */
            background-color: #00CED1; 
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .cat-face {
            /* Vivid Cat Fur: Bright Sunny Yellow */
            background-color: #FFD700; 
            border-radius: 50% / 60% 60% 30% 30%;
            width: 80vmin;
            height: 85vmin;
            position: relative;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.5); /* Adding a bright pink shadow pop */
            padding-top: 20px;
        }

        /* Ears */
        .ear {
            width: 0;
            height: 0;
            border-style: solid;
            /* Vivid Orange/Gold for ears */
            border-width: 0 25px 70px 25px;
            border-color: transparent transparent #FF8C00 transparent; 
            position: absolute;
            top: -30px;
            transform: translateY(-50%);
            z-index: 10;
        }

        .left-ear {
            left: 15%;
            border-right-color: transparent;
            border-bottom-color: transparent;
        }

        .right-ear {
            right: 15%;
            border-left-color: transparent;
            border-bottom-color: transparent;
        }

        /* Nose and Mouth Area */
        .nose {
            /* Vivid Coral Red Nose */
            background-color: #FF69B4; 
            width: 40px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .mouth {
            width: 35px;
            height: 12px;
            border-radius: 0 0 20px 20px;
            /* Deep Magenta for mouth contrast */
            background-color: #DC143C;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        }

        /* Eyes */
        .eye {
            width: 140px;
            height: 70px;
            /* Bright Electric Blue Iris */
            background-color: #00BFFF; 
            border-radius: 50%;
            position: absolute;
            top: 28%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .left-eye {
            left: 18%;
        }

        .right-eye {
            right: 18%;
        }

        .pupil {
            width: 35px;
            height: 35px;
            /* Very dark, saturated color for pupil */
            background-color: #8B0000; 
            border-radius: 50%;
            position: absolute;
            z-index: 11;
        }

        .left-pupil {
            left: 38px;
            top: 12px;
        }

        .right-pupil {
            right: 38px;
            top: 12px;
        }

        /* Whiskers Container */
        .whiskers-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .whisker-group {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Individual Whisker Style */
        .whisker {
            width: 100px;
            height: 2px; /* Slightly thicker */
            background-color: #000000;
            position: relative;
        }

        /* Overriding structure for symmetry and simplicity using direct divs */
        .whisker-l1 { width: 70px; }
        .whisker-l2 { width: 100px; }
        .whisker-r1 { width: 70px; }
        .whisker-r2 { width: 100px; }


    </style>
</head>
<body>

    <div class="cat-face">
        <!-- Ears -->
        <div class="ear left-ear"></div>
        <div class="ear right-ear"></div>

        <!-- Eyes -->
        <div class="eye left-eye">
            <div class="pupil left-pupil"></div>
        </div>
        <div class="eye right-eye">
            <div class="pupil right-pupil"></div>
        </div>

        <!-- Whiskers (Structured for 4 whiskers on each side) -->
        <div class="whiskers-container">
            <!-- Left Side Whiskers -->
            <div class="whisker-group">
                <div class="whisker whisker-l1"></div>
                <div class="whisker whisker-l2"></div>
            </div>
            <!-- Right Side Whiskers -->
            <div class="whisker-group" style="flex-direction: row-reverse;">
                <div class="whisker whisker-r1"></div>
                <div class="whisker whisker-r2"></div>
            </div>
        </div>

        <!-- Nose and Mouth -->
        <div class="nose">
            <div style="width: 10px; height: 5px; background-color: #FF69B4; border-radius: 50%; position: relative; top: 5px;"></div>
        </div>
        <div class="mouth"></div>

    </div>

</body>
</html>
