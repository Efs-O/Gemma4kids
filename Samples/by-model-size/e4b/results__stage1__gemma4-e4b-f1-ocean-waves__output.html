<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Animated Ocean Waves</title>
    <style>
        /* Global Reset and Vivid Background */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #1e90ff); /* Sky to deep ocean gradient */
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
        }

        /* Beach Area (Foreground) */
        .beach {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20vh;
            background: linear-gradient(to top, #FFD700, #FFA500); /* Sunny, vivid sand */
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Water Container (Behind the foam, above the sand) */
        .ocean {
            position: absolute;
            bottom: 20vh; /* Starts right at the top of the sand */
            width: 100%;
            height: 40vh;
            z-index: 5;
            overflow: hidden;
        }

        /* Wave Layer Styling */
        .wave-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 144, 255, 0.6); /* Vivid Sky Blue */
            border-radius: 0;
            animation-timing-function: cubic-bezier(0.2, 1, 0.2, 1);
        }

        /* Specific Wave Layers (Depth simulation) */
        #wave1 {
            height: 20%;
            background-color: rgba(30, 144, 255, 0.7);
            animation: waveFlow 6s linear infinite;
            transform: translateY(0);
            z-index: 3;
        }

        #wave2 {
            height: 15%;
            background-color: rgba(0, 128, 128, 0.6); /* Teal/Turquoise */
            animation: waveFlow 7s linear infinite;
            transform: translateY(0);
            z-index: 2;
        }

        #wave3 {
            height: 10%;
            background-color: rgba(70, 130, 180, 0.7); /* Steel Blue */
            animation: waveFlow 5s linear infinite;
            transform: translateY(0);
            z-index: 1;
        }

        /* Foam/Crash Simulation (The active element) */
        .foam {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 150%; /* Needs extra width to appear and dissipate */
            height: 5vh;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 20;
            animation: crash 1.5s ease-in-out infinite;
            border-radius: 0 0 50% 50%;
            opacity: 0; /* Start invisible */
        }

        /* Keyframe Animations */

        /* 1. General Wave Flow (Subtle up/down movement) */
        @keyframes waveFlow {
            0% {
                transform: translateY(0) skewX(0deg);
            }
            50% {
                /* Slight distortion/peak effect */
                transform: translateY(-10px) skewX(5deg);
            }
            100% {
                transform: translateY(0) skewX(0deg);
            }
        }

        /* 2. The Crashing Foam Animation (The visible impact) */
        @keyframes crash {
            0% {
                transform: translateX(-100%) scaleY(0.1);
                opacity: 0.1;
            }
            10% {
                transform: translateX(-50%) scaleY(1); /* Rises and appears */
                opacity: 1;
            }
            50% {
                transform: translateX(100%) scaleY(0.8); /* Reaches peak width */
                opacity: 1;
            }
            100% {
                transform: translateX(200%) scaleY(0.1); /* Dissipates */
                opacity: 0;
            }
        }

    </style>
</head>
<body>

    <!-- Background structure -->
    <div class="ocean">
        <!-- Waves providing depth and movement -->
        <div id="wave1" class="wave-layer"></div>
        <div id="wave2" class="wave-layer"></div>
        <div id="wave3" class="wave-layer"></div>
        
        <!-- The actively crashing foam element -->
        <div class="foam"></div>
    </div>

    <!-- Foreground Beach -->
    <div class="beach"></div>

</body>
</html>
