<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Underwater Scene</title>
    <style>
        /* Global Setup & Background */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #003366 0%, #005599 60%, #0077cc 100%);
            overflow: hidden;
            font-family: sans-serif;
            height: 100vh;
            position: relative;
        }

        /* --- Bubble Effects --- */
        .bubble {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: bubbleRise linear infinite;
            opacity: 0.8;
        }

        @keyframes bubbleRise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(1.2);
                opacity: 0;
            }
        }

        /* --- Fish Styling --- */
        .fish-container {
            position: absolute;
            bottom: 20%;
            width: 200px;
            height: 100px;
            /* Ensures fish stay visually within the frame boundaries */
            will-change: transform;
        }

        .fish {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            animation: swim linear infinite;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.3));
        }

        /* Fish Body Styling (Using pseudo-elements for shape) */
        .fish::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 60%;
            border-radius: 50% 50% 20% 20%;
            background: inherit;
            left: 10%;
            bottom: 10%;
            transform: scaleX(1);
        }

        /* Tail Fin */
        .fish::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            border-left: 60px solid inherit;
            left: 100%;
            bottom: 15%;
            transform: rotate(30deg);
        }

        /* --- Specific Fish Customizations --- */

        /* Fish 1: Electric Blue/Cyan */
        #fish1 {
            animation: swim 12s linear infinite alternate; /* Slower, more meandering */
            /* Set base color properties on the element itself for easier inheritance/use */
            --fish-color: #00bfff;
        }
        #fish1::before, #fish1::after {
            background: var(--fish-color);
            border-left-color: var(--fish-color);
        }
        /* Slight curve variation for fish 1 */
        #fish1 {
            transform: rotate(10deg);
        }


        /* Fish 2: Vivid Pink/Magenta */
        #fish2 {
            animation: swim 15s linear infinite alternate; /* Medium speed */
            --fish-color: #ff00cc;
        }
        #fish2::before, #fish2::after {
            background: var(--fish-color);
            border-left-color: var(--fish-color);
        }
        #fish2 {
            transform: rotate(-15deg);
        }

        /* Fish 3: Lime Green/Yellow */
        #fish3 {
            animation: swim 10s linear infinite alternate; /* Fast, active */
            --fish-color: #adff2f;
        }
        #fish3::before, #fish3::after {
            background: var(--fish-color);
            border-left-color: var(--fish-color);
        }
        #fish3 {
            transform: rotate(5deg);
        }


        /* --- Keyframe Animations --- */

        /* Swimming Animation: Sinusoidal horizontal movement */
        @keyframes swim {
            0% {
                transform: translateX(-10vw) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateX(10vw) rotate(5deg);
                opacity: 0.9;
            }
            100% {
                transform: translateX(-10vw) rotate(0deg);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Fish Elements -->
    <div id="fish1" class="fish-container fish"></div>
    <div id="fish2" class="fish-container fish"></div>
    <div id="fish3" class="fish-container fish"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;

            // Function to create and animate a single bubble
            function createBubble(x, y) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // Set initial random scale and size slightly varied
                const size = Math.random() * 10 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                bubble.style.left = `${x}px`;
                bubble.style.top = `${y}px`;

                // Reset animation duration for variation
                const duration = Math.random() * 5 + 5; // 5s to 10s rise time
                bubble.style.animationDuration = `${duration}s`;
                
                body.appendChild(bubble);

                // Clean up the bubble after animation finishes to prevent memory leaks
                setTimeout(() => {
                    bubble.remove();
                }, duration * 1000 + 100);
            }

            // Bubble Spawning Loop
            function spawnBubbles() {
                // Random horizontal position (10vw to 90vw)
                const x = Math.random() * (window.innerWidth * 0.8) + (window.innerWidth * 0.1);
                // Spawn from near the bottom (80vh)
                const y = window.innerHeight * 0.8 + (Math.random() * 100); 
                
                createBubble(x, y);
            }

            // Spawn a bubble every 50 to 150 milliseconds
            setInterval(spawnBubbles, Math.random() * 100 + 50);
        });
    </script>
</body>
</html>
