<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Badge</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: #FF6B6B; /* Bright background color */
            overflow: hidden;
        }

        .badge-container {
            position: relative;
            width: 60vmin;
            height: 60vmin;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Shield Shape */
        .shield {
            background: linear-gradient(145deg, #264653, #3A82B0); /* Dark blue/teal gradient for depth */
            width: 100%;
            height: 100%;
            clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 100%);
            border: 10px solid #FFD93D; /* Gold border */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-radius: 15% 15% 0 0;
        }

        /* The Bold Letter */
        .super-letter {
            font-family: 'Impact', sans-serif; /* Super bold font feeling */
            font-size: 30vmin;
            font-weight: 900;
            color: #FFD93D; /* Bright gold color */
            text-shadow: 
                -5px -5px 0 #E63946, /* Red shadow */
                5px -5px 0 #E63946,  /* Red shadow */
                -5px 5px 0 #E63946,  /* Red shadow */
                5px 5px 0 #E63946;   /* Red shadow */
            z-index: 10;
        }

        /* Inner Circle Accent */
        .inner-accent {
            position: absolute;
            width: 70%;
            height: 70%;
            background-color: #FF6B6B; /* Vivid red/coral */
            border: 8px solid #FFD93D;
            border-radius: 50%;
            top: 15%;
            z-index: 5;
        }

        /* Optional outer glow effect using box shadow on the container */
        .badge-container {
            box-shadow: 0 0 30px 10px rgba(255, 150, 0, 0.8);
        }

    </style>
</head>
<body>

    <div class="badge-container">
        <div class="shield"></div>
        <div class="inner-accent"></div>
        <div class="super-letter">S</div>
    </div>

</body>
</html>
