<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Underwater Swim</title>
    <style>
        :root {
            --sea-blue-dark: #003366;
            --sea-blue-light: #00aacc;
            --fish-color-1: #ff6b6b;
            --fish-color-2: #ffe66d;
            --fish-color-3: #4ecdc4;
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0077be, #0055aa); /* Gradient Sea effect */
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* --- Global Container for Scene --- */
        .sea-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through if needed */
        }

        /* ======================== */
        /* --- FISH STYLING & ANIMATION --- */
        /* ======================== */

        .fish {
            position: absolute;
            width: 80px;
            height: 30px;
            background-color: transparent;
            border-radius: 50% / 20px; /* Body shape */
            animation: swim linear infinite;
            z-index: 10;
            opacity: 0.9;
            transform: rotate(0deg);
        }

        /* Fish Body Styling (Using pseudo-elements for tails/fins for complexity) */
        .fish::before {
            content: '';
            position: absolute;
            width: 0;
            height: 100%;
            background-color: inherit;
            top: 0;
            right: -15px; /* Position the tail */
            border-radius: 0 50% 50% 0;
        }

        /* Specific Fish Styles */
        #fish1 {
            background-color: var(--fish-color-1);
            top: 20%;
            left: -10%;
            width: 100px;
            height: 40px;
            animation-duration: 15s;
            animation-delay: 0s;
        }
        #fish1::before { background-color: var(--fish-color-1); }

        #fish2 {
            background-color: var(--fish-color-2);
            top: 60%;
            left: 120%;
            width: 120px;
            height: 35px;
            animation-duration: 18s;
            animation-delay: 3s;
        }
        #fish2::before { background-color: var(--fish-color-2); }

        #fish3 {
            background-color: var(--fish-color-3);
            top: 40%;
            right: -5%;
            width: 90px;
            height: 30px;
            animation-duration: 12s;
            animation-delay: 1.5s;
        }
        #fish3::before { background-color: var(--fish-color-3); }


        /* Keyframes for Swimming Movement */
        @keyframes swim {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            25% {
                transform: translateX(calc(100vw + 20px)) rotate(5deg);
            }
            50% {
                transform: translateX(calc(100vw + 30px)) rotate(0deg);
            }
            75% {
                transform: translateX(calc(100vw + 10px)) rotate(-5deg);
            }
            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        /* ======================== */
        /* --- BUBBLES STYLING & ANIMATION --- */
        /* ======================== */

        .bubble {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            opacity: 0.8;
            animation: floatUp linear infinite;
            z-index: 5;
        }

        /* Bubble 1: Large, slow */
        .bubble-1 {
            width: 40px;
            height: 40px;
            top: 100%; /* Start at the bottom */
            left: 10%;
            animation-duration: 15s;
            animation-timing-function: ease-out;
            animation-delay: 0s;
        }

        /* Bubble 2: Medium, fast */
        .bubble-2 {
            width: 25px;
            height: 25px;
            top: 100%;
            left: 60%;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-delay: 2s;
        }

        /* Bubble 3: Small, gentle */
        .bubble-3 {
            width: 15px;
            height: 15px;
            top: 100%;
            left: 90%;
            animation-duration: 12s;
            animation-timing-function: ease-in;
            animation-delay: 4s;
        }

        /* Keyframes for Bubbling Upwards */
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(0.3); /* Move up and shrink */
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="sea-scene">
        <!-- Fish Elements -->
        <div class="fish" id="fish1"></div>
        <div class="fish" id="fish2"></div>
        <div class="fish" id="fish3"></div>

        <!-- Bubble Elements -->
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>

        <!-- Added extra bubbles for density -->
        <div class="bubble" style="width: 20px; height: 20px; top: 100%; left: 30%; animation-duration: 9s; animation-delay: 5s;"></div>
        <div class="bubble" style="width: 35px; height: 35px; top: 100%; left: 75%; animation-duration: 16s; animation-delay: 1s;"></div>
    </div>

</body>
</html>
